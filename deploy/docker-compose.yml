# Bastion Pro — déploiement (images Docker Hub publiques)
#
#   cp .env.example .env
#   docker network create --subnet=10.5.0.0/16 vpcbr 2>/dev/null || true
#   docker compose pull && docker compose up -d
#
# Images : vincenttisseront/bastion-pro-{app,migrate,nginx}
# Voir README.md

name: bastion

services:
  bastion-app-migrate:
    image: ${BASTION_MIGRATE_IMAGE:-vincenttisseront/bastion-pro-migrate:latest}
    user: "0:0"
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p /var/lib/sso-portal/exports /var/lib/sso-portal/uploads/app-logos /var/lib/sso-portal/keys /var/lib/sso-portal/nginx-logs /var/lib/sso-portal-files/private/files
        python /app/scripts/encrypt_portal_db.py
        alembic upgrade head
        python -m app.runtime_secrets_service
        chown -R 65532:65532 /var/lib/sso-portal /var/lib/sso-portal-files 2>/dev/null || true
        if [ -d /var/lib/sso-portal/pgdata ]; then
          chown -R 70:70 /var/lib/sso-portal/pgdata 2>/dev/null || true
          chmod 700 /var/lib/sso-portal/pgdata 2>/dev/null || true
        fi
        # nginx (uid 101) writes Accès apps + modsec_audit; app (65532) reads via group.
        mkdir -p /var/lib/sso-portal/nginx-logs /var/lib/sso-portal/exports /var/lib/sso-portal/acme-challenge
        chown -R 101:65532 /var/lib/sso-portal/nginx-logs 2>/dev/null || true
        chmod 2770 /var/lib/sso-portal/nginx-logs 2>/dev/null || true
        if [ ! -f /var/lib/sso-portal/exports/nginx-portal-realms.conf ]; then
          echo "# no secondary realms yet" > /var/lib/sso-portal/exports/nginx-portal-realms.conf
          chown 65532:65532 /var/lib/sso-portal/exports/nginx-portal-realms.conf 2>/dev/null || true
        fi
        chown -R 65532:65532 /var/lib/sso-portal/acme-challenge 2>/dev/null || true
        chmod 0755 /var/lib/sso-portal/acme-challenge 2>/dev/null || true
        # ACME PEMs must be readable by nginx uid 101 (else sync-acme-tls skips → bastion-default).
        if [ -d /var/lib/sso-portal/certs ]; then
          find /var/lib/sso-portal/certs -type d -exec chmod 755 {} \; 2>/dev/null || true
          find /var/lib/sso-portal/certs -type f -name '*.pem' -exec chmod 644 {} \; 2>/dev/null || true
        fi
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////var/lib/sso-portal/portal.db}
      EXPORTS_DIR: /var/lib/sso-portal/exports
      PORTAL_DATA_DIR: /var/lib/sso-portal
      FILES_STORAGE_DIR: /var/lib/sso-portal-files/private/files
      VAULT_KEYS_DIR: /var/lib/sso-portal/keys
      OAUTH2_PROXY_NETWORK_MODE: docker
      OAUTH2_PROXY_DEFAULT_URL: http://oauth2-proxy-core:4180
    volumes:
      - ${SSO_PORTAL_DATA_DIR:-./data/sso-portal}:/var/lib/sso-portal
      - ${SSO_PORTAL_FILES_DATA_DIR:-./data/sso-portal-files}:/var/lib/sso-portal-files
    networks:
      vpcbr:
        aliases:
          - bastion-app-migrate
    restart: "no"

  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    entrypoint: ["/bin/sh", "/bastion-entrypoint.sh"]
    command: ["postgres"]
    environment:
      POSTGRES_USER: ${HOT_STORE_PG_USER:-bastion_hot}
      POSTGRES_PASSWORD: ${HOT_STORE_PG_PASSWORD:-bastion_hot_change_me}
      POSTGRES_DB: ${HOT_STORE_PG_DB:-bastion_hot}
    volumes:
      - ${SSO_PORTAL_DATA_DIR:-./data/sso-portal}/pgdata:/var/lib/postgresql/data
      - ./docker/postgres/bastion-entrypoint.sh:/bastion-entrypoint.sh:ro
    networks:
      vpcbr:
        aliases:
          - postgres
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  bastion-app:
    image: ${BASTION_APP_IMAGE:-vincenttisseront/bastion-pro-app:latest}
    user: "65532:65532"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${BASTION_APP_MEM_LIMIT:-512m}
    cpus: ${BASTION_APP_CPUS:-0.50}
    tmpfs:
      - /tmp:size=64M,mode=1777
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////var/lib/sso-portal/portal.db}
      EXPORTS_DIR: /var/lib/sso-portal/exports
      PORTAL_DATA_DIR: /var/lib/sso-portal
      NGINX_APP_LOGS_DIR: /var/lib/sso-portal/nginx-logs
      BASTION_NGINX_WAF_SNAPSHOT_PATH: /var/lib/sso-portal/nginx-logs/nginx-waf-snapshot.json
      FILES_STORAGE_DIR: /var/lib/sso-portal-files/private/files
      VAULT_KEYS_DIR: /var/lib/sso-portal/keys
      OAUTH2_PROXY_NETWORK_MODE: docker
      OAUTH2_PROXY_DEFAULT_URL: http://oauth2-proxy-core:4180
      ACME_CHALLENGE_WEBROOT: /var/www/acme-challenge
    volumes:
      - ${SSO_PORTAL_DATA_DIR:-./data/sso-portal}:/var/lib/sso-portal
      - ${SSO_PORTAL_FILES_DATA_DIR:-./data/sso-portal-files}:/var/lib/sso-portal-files
      - ${SSO_PORTAL_DATA_DIR:-./data/sso-portal}/nginx-logs:/var/lib/sso-portal/nginx-logs
      - ${SSO_PORTAL_DATA_DIR:-./data/sso-portal}/acme-challenge:/var/www/acme-challenge
    networks:
      vpcbr:
        aliases:
          - bastion-app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      bastion-app-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    restart: unless-stopped

  oauth2-proxy-core:
    image: quay.io/oauth2-proxy/oauth2-proxy:${OAUTH2_PROXY_IMAGE_TAG:-v7.7.1}
    env_file:
      - path: ${OAUTH2_CORE_ENV_FILE:-.env.oauth2-core}
        required: false
    command:
      - --config=/etc/oauth2-proxy/oauth2-proxy.cfg
    volumes:
      - ${OAUTH2_CORE_CONFIG_DIR:-./docker/oauth2-core}:/etc/oauth2-proxy:ro
    networks:
      vpcbr:
        aliases:
          - oauth2-proxy-core
    ports:
      - "127.0.0.1:4180:4180"
    restart: unless-stopped

  nginx:
    image: ${BASTION_NGINX_IMAGE:-vincenttisseront/bastion-pro-nginx:latest}
    container_name: bastion-nginx
    # Root only for entrypoint: mirror root:600 ACME PEMs → ssl-local, then su-exec nginx.
    user: "0:0"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      # Entrypoint starts as 0:0 (ACME root:600 mirror) then su-exec → nginx.
      # cap_drop ALL removes these; without them: su-exec setgroups(101) EPERM.
      - SETUID
      - SETGID
    mem_limit: ${BASTION_NGINX_MEM_LIMIT:-1g}
    cpus: ${BASTION_NGINX_CPUS:-1.0}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    tmpfs:
      # mode 0777 required: cap_drop ALL removes DAC_OVERRIDE, so even uid 0
      # cannot write uid=101 mode=0755 mounts (seed/realms Permission denied).
      - /tmp:size=256M,mode=1777
      - /var/run:size=16M,uid=101,gid=101,mode=0777
      - /var/cache/nginx:size=128M,uid=101,gid=101,mode=0777
      - /var/log/nginx:size=32M,uid=101,gid=101,mode=0777
      - /etc/nginx/conf.d:size=16M,uid=101,gid=101,mode=0777
      - /etc/nginx/snippets:size=8M,uid=101,gid=101,mode=0777
      - /etc/nginx/includes:size=16M,uid=101,gid=101,mode=0777
      - /etc/nginx/modsecurity/generated:size=8M,uid=101,gid=101,mode=0777
      - /etc/nginx/ssl-local:size=16M,uid=101,gid=101,mode=0777
    environment:
      PORTAL_INTERNAL_TOKEN: ${VAULT_PORTAL_INTERNAL_TOKEN:-${PORTAL_INTERNAL_TOKEN:-}}
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:-portal.example.com}
      SSO_PORTAL_DEFAULT_REALM_SLUG: ${SSO_PORTAL_DEFAULT_REALM_SLUG:-default}
      ACME_CHALLENGE_WEBROOT: /var/www/acme-challenge
      BASTION_NGINX_SEED: /usr/share/bastion-nginx/seed
    volumes:
      - ${SSO_PORTAL_DATA_DIR:-./data/sso-portal}/exports:/var/lib/sso-portal/exports:ro
      - ${SSO_PORTAL_DATA_DIR:-./data/sso-portal}/certs:/etc/nginx/ssl:ro
      - ${SSO_PORTAL_DATA_DIR:-./data/sso-portal}/nginx-logs:/var/log/nginx/apps
      - ${SSO_PORTAL_DATA_DIR:-./data/sso-portal}/acme-challenge:/var/www/acme-challenge:ro
    networks:
      vpcbr:
        aliases:
          - bastion-nginx
          - nginx
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/_portal_nginx_ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      bastion-app:
        condition: service_healthy
      oauth2-proxy-core:
        condition: service_started
      acme-companion:
        condition: service_started
    restart: unless-stopped

  acme-companion:
    image: neilpang/acme.sh:3.1.6@sha256:af6dbefd9d4fe891963528b6f59f82167de0d18251bcd5aaac67adf02863de7a
    container_name: bastion-acme
    env_file:
      - path: ${ACME_ENV_FILE:-.env.acme}
        required: false
    environment:
      CERTS_DIR: /certs
      EXPORTS_DIR: /exports
      ACME_DNS_API: ${ACME_DNS_API:-dns_cf}
      ACME_CA: ${ACME_CA:-letsencrypt}
      ACME_RECONCILE_INTERVAL: ${ACME_RECONCILE_INTERVAL:-300}
    volumes:
      - ${SSO_PORTAL_DATA_DIR:-./data/sso-portal}/acme:/acme.sh
      - ${SSO_PORTAL_DATA_DIR:-./data/sso-portal}/certs:/certs
      - ${SSO_PORTAL_DATA_DIR:-./data/sso-portal}/exports:/exports:ro
      - ./docker/acme/entrypoint-acme.sh:/entrypoint-acme.sh:ro
      - ./docker/acme/reconcile-certs.sh:/reconcile-certs.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint-acme.sh"]
    networks:
      vpcbr:
        aliases:
          - bastion-acme
          - acme-companion
    depends_on:
      bastion-app:
        condition: service_healthy
    restart: unless-stopped

networks:
  vpcbr:
    external: true
    name: vpcbr
