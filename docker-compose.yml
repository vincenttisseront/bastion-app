# Bastion applicatif — Phase 7
#
# Topologie (front) — Traefik coupé, nginx edge :
#   clients → bastion-nginx:80 → 301 HTTPS
#          → bastion-nginx:443 (certs ACME DNS-01)
#              → :8080 (portal / subdomain SSO / public_proxy)
#
# Réseau vpcbr (10.5.0.0/16) conservé pour bastion-app / oauth2 / Keycloak.
#
# Smoke local (loopback HTTP only) :
#   docker compose -f docker-compose.yml -f docker-compose.publish.yml up -d

name: bastion

services:
  bastion-app-migrate:
    build: .
    image: bastion-app:local
    user: "0:0"
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p /var/lib/sso-portal/exports /var/lib/sso-portal/uploads/app-logos /var/lib/sso-portal/keys /var/lib/sso-portal-files/private/files
        # Encrypt plaintext portal.db before Alembic/app expect SQLCipher (idempotent).
        python /app/scripts/encrypt_portal_db.py
        alembic upgrade head
        # HMAC secrets in portal_settings (not .env) — idempotent.
        python -m app.runtime_secrets_service
        chown -R 1000:1000 /var/lib/sso-portal /var/lib/sso-portal-files
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////var/lib/sso-portal/portal.db}
      EXPORTS_DIR: /var/lib/sso-portal/exports
      PORTAL_DATA_DIR: /var/lib/sso-portal
      FILES_STORAGE_DIR: /var/lib/sso-portal-files/private/files
      VAULT_KEYS_DIR: /var/lib/sso-portal/keys
      OAUTH2_PROXY_NETWORK_MODE: docker
      OAUTH2_PROXY_DEFAULT_URL: http://oauth2-proxy-core:4180
    volumes:
      - ${SSO_PORTAL_DATA_DIR:-./data/sso-portal}:/var/lib/sso-portal
      - ${SSO_PORTAL_FILES_DATA_DIR:-./data/sso-portal-files}:/var/lib/sso-portal-files
    networks:
      vpcbr:
        aliases:
          - bastion-app-migrate
    restart: "no"

  bastion-app:
    build: .
    image: bastion-app:local
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////var/lib/sso-portal/portal.db}
      EXPORTS_DIR: /var/lib/sso-portal/exports
      PORTAL_DATA_DIR: /var/lib/sso-portal
      FILES_STORAGE_DIR: /var/lib/sso-portal-files/private/files
      VAULT_KEYS_DIR: /var/lib/sso-portal/keys
      OAUTH2_PROXY_NETWORK_MODE: docker
      OAUTH2_PROXY_DEFAULT_URL: http://oauth2-proxy-core:4180
    volumes:
      - ${SSO_PORTAL_DATA_DIR:-./data/sso-portal}:/var/lib/sso-portal
      - ${SSO_PORTAL_FILES_DATA_DIR:-./data/sso-portal-files}:/var/lib/sso-portal-files
    networks:
      vpcbr:
        aliases:
          - bastion-app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      bastion-app-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    restart: unless-stopped

  oauth2-proxy-core:
    image: quay.io/oauth2-proxy/oauth2-proxy:${OAUTH2_PROXY_IMAGE_TAG:-v7.7.1}
    env_file:
      - ${OAUTH2_CORE_ENV_FILE:-.env.oauth2-core}
    command:
      - --config=/etc/oauth2-proxy/oauth2-proxy.cfg
    volumes:
      - ${OAUTH2_CORE_CONFIG_DIR:-./docker/oauth2-core}:/etc/oauth2-proxy:ro
    networks:
      vpcbr:
        aliases:
          - oauth2-proxy-core
    ports:
      - "127.0.0.1:4180:4180"
    restart: unless-stopped

  nginx:
    build: ./docker/nginx
    image: bastion-nginx:local
    container_name: bastion-nginx
    environment:
      PORTAL_INTERNAL_TOKEN: ${VAULT_PORTAL_INTERNAL_TOKEN:-${PORTAL_INTERNAL_TOKEN:-}}
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:-portal.ar-systems.fr}
      SSO_PORTAL_DEFAULT_REALM_SLUG: ${SSO_PORTAL_DEFAULT_REALM_SLUG:-ar-systems}
    volumes:
      - ${SSO_PORTAL_DATA_DIR:-./data/sso-portal}/exports:/var/lib/sso-portal/exports:ro
      - ${SSO_PORTAL_DATA_DIR:-./data/sso-portal}/certs:/etc/nginx/ssl:ro
    networks:
      vpcbr:
        aliases:
          - bastion-nginx
          - nginx
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/_portal_nginx_ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      bastion-app:
        condition: service_healthy
      oauth2-proxy-core:
        condition: service_started
      acme-companion:
        condition: service_started
    restart: unless-stopped

  # Let's Encrypt DNS-01 (Cloudflare) → certs for nginx :443
  acme-companion:
    image: neilpang/acme.sh:latest
    container_name: bastion-acme
    env_file:
      - path: ${ACME_ENV_FILE:-.env.acme}
        required: false
    environment:
      CERTS_DIR: /certs
      EXPORTS_DIR: /exports
      ACME_DNS_API: ${ACME_DNS_API:-dns_cf}
      ACME_CA: ${ACME_CA:-letsencrypt}
      ACME_RECONCILE_INTERVAL: ${ACME_RECONCILE_INTERVAL:-300}
    volumes:
      - ${SSO_PORTAL_DATA_DIR:-./data/sso-portal}/acme:/acme.sh
      - ${SSO_PORTAL_DATA_DIR:-./data/sso-portal}/certs:/certs
      - ${SSO_PORTAL_DATA_DIR:-./data/sso-portal}/exports:/exports:ro
      - ./docker/acme/entrypoint-acme.sh:/entrypoint-acme.sh:ro
      - ./docker/acme/reconcile-certs.sh:/reconcile-certs.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint-acme.sh"]
    networks:
      vpcbr:
        aliases:
          - bastion-acme
          - acme-companion
    depends_on:
      bastion-app:
        condition: service_healthy
    restart: unless-stopped

networks:
  # Réseau partagé (IPAM 10.5.0.0/16 — ne pas recréer ; OK sans Traefik)
  vpcbr:
    external: true
    name: vpcbr

# Volumes nommés (alias documentaire §9.3). En pratique les services montent des binds
# via SSO_PORTAL_DATA_DIR / SSO_PORTAL_FILES_DATA_DIR pour permettre backup hôte Ansible.
volumes:
  sso_portal_files_data:
    name: sso_portal_files_data
    # Utilisation optionnelle : remplacer le bind files par
    #   - sso_portal_files_data:/var/lib/sso-portal-files
    # si un volume Docker nommé est préféré au bind hôte.
