# Bastion applicatif — Phase 7
#
# Topologie cible (front only) :
#   clients → Traefik :443 (TLS) Host=portal|app FQDNs
#       → bastion-nginx:8080 (vpcbr)
#           portal → vhost_sso_portal
#           apps   → exports/nginx-subdomain-apps.conf (App DB + hop)
#
# Transition : reverse01 peut encore router certains Hosts ; inventaire Ansible
# nginx_subdomain_sso_vhosts est legacy — préférer l'export DB.
#
# Smoke local sans Traefik :
#   docker network create --subnet=10.5.0.0/16 vpcbr   # si absent
#   docker compose -f docker-compose.yml -f docker-compose.publish.yml up -d

name: bastion

services:
  bastion-app-migrate:
    build: .
    image: bastion-app:local
    user: "0:0"
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p /var/lib/sso-portal/exports /var/lib/sso-portal/uploads/app-logos /var/lib/sso-portal/keys /var/lib/sso-portal-files/private/files
        # Encrypt plaintext portal.db before Alembic/app expect SQLCipher (idempotent).
        python /app/scripts/encrypt_portal_db.py
        alembic upgrade head
        # HMAC secrets in portal_settings (not .env) — idempotent.
        python -m app.runtime_secrets_service
        chown -R 1000:1000 /var/lib/sso-portal /var/lib/sso-portal-files
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////var/lib/sso-portal/portal.db}
      EXPORTS_DIR: /var/lib/sso-portal/exports
      PORTAL_DATA_DIR: /var/lib/sso-portal
      FILES_STORAGE_DIR: /var/lib/sso-portal-files/private/files
      VAULT_KEYS_DIR: /var/lib/sso-portal/keys
      OAUTH2_PROXY_NETWORK_MODE: docker
      OAUTH2_PROXY_DEFAULT_URL: http://oauth2-proxy-core:4180
    volumes:
      - ${SSO_PORTAL_DATA_DIR:-./data/sso-portal}:/var/lib/sso-portal
      - ${SSO_PORTAL_FILES_DATA_DIR:-./data/sso-portal-files}:/var/lib/sso-portal-files
    networks:
      vpcbr:
        aliases:
          - bastion-app-migrate
    restart: "no"

  bastion-app:
    build: .
    image: bastion-app:local
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////var/lib/sso-portal/portal.db}
      EXPORTS_DIR: /var/lib/sso-portal/exports
      PORTAL_DATA_DIR: /var/lib/sso-portal
      FILES_STORAGE_DIR: /var/lib/sso-portal-files/private/files
      VAULT_KEYS_DIR: /var/lib/sso-portal/keys
      OAUTH2_PROXY_NETWORK_MODE: docker
      OAUTH2_PROXY_DEFAULT_URL: http://oauth2-proxy-core:4180
    volumes:
      - ${SSO_PORTAL_DATA_DIR:-./data/sso-portal}:/var/lib/sso-portal
      - ${SSO_PORTAL_FILES_DATA_DIR:-./data/sso-portal-files}:/var/lib/sso-portal-files
    networks:
      vpcbr:
        aliases:
          - bastion-app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      bastion-app-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    restart: unless-stopped

  oauth2-proxy-core:
    image: quay.io/oauth2-proxy/oauth2-proxy:${OAUTH2_PROXY_IMAGE_TAG:-v7.7.1}
    env_file:
      - ${OAUTH2_CORE_ENV_FILE:-.env.oauth2-core}
    command:
      - --config=/etc/oauth2-proxy/oauth2-proxy.cfg
    volumes:
      - ${OAUTH2_CORE_CONFIG_DIR:-./docker/oauth2-core}:/etc/oauth2-proxy:ro
    networks:
      vpcbr:
        aliases:
          - oauth2-proxy-core
    ports:
      - "127.0.0.1:4180:4180"
    restart: unless-stopped

  nginx:
    build: ./docker/nginx
    image: bastion-nginx:local
    container_name: bastion-nginx
    environment:
      PORTAL_INTERNAL_TOKEN: ${VAULT_PORTAL_INTERNAL_TOKEN:-${PORTAL_INTERNAL_TOKEN:-}}
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:-portal.ar-systems.fr}
      SSO_PORTAL_DEFAULT_REALM_SLUG: ${SSO_PORTAL_DEFAULT_REALM_SLUG:-ar-systems}
    volumes:
      - ${SSO_PORTAL_DATA_DIR:-./data/sso-portal}/exports:/var/lib/sso-portal/exports:ro
    networks:
      vpcbr:
        aliases:
          - bastion-nginx
          - nginx
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=vpcbr"
      # Portal Host (priority default). After infra Hosts live on bastion-nginx,
      # also load docker/traefik/bastion-catchall.example.yml (file provider) so
      # Keycloak/Grafana/Wiki hit bastion-nginx instead of their own Traefik routers.
      - "traefik.http.routers.bastion-portal.rule=Host(`${PORTAL_DOMAIN:-portal.ar-systems.fr}`)"
      - "traefik.http.routers.bastion-portal.entrypoints=websecure"
      - "traefik.http.routers.bastion-portal.tls=true"
      - "traefik.http.routers.bastion-portal.tls.certresolver=cloudflare"
      - "traefik.http.routers.bastion-portal.middlewares=secure-headers@file"
      - "traefik.http.services.bastion-portal.loadbalancer.server.port=8080"
      - "traefik.http.routers.bastion-portal.service=bastion-portal"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/_portal_nginx_ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      bastion-app:
        condition: service_healthy
      oauth2-proxy-core:
        condition: service_started
    restart: unless-stopped

networks:
  # Réseau Traefik / Keycloak existant (IPAM 10.5.0.0/16 — ne pas recréer)
  vpcbr:
    external: true
    name: vpcbr

# Volumes nommés (alias documentaire §9.3). En pratique les services montent des binds
# via SSO_PORTAL_DATA_DIR / SSO_PORTAL_FILES_DATA_DIR pour permettre backup hôte Ansible.
volumes:
  sso_portal_files_data:
    name: sso_portal_files_data
    # Utilisation optionnelle : remplacer le bind files par
    #   - sso_portal_files_data:/var/lib/sso-portal-files
    # si un volume Docker nommé est préféré au bind hôte.
