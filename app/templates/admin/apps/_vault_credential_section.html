{# Vault credential management — edit page only (slug required) #}
{% if app is defined and (vault_enabled | default(false) or app.robotic_driver) %}
<div class="form-section" id="vault-credential-section">
  <div class="form-section-header">
    <div class="form-section-title">Credential vault</div>
    <div class="form-section-sub">Compte de service robotic — mot de passe chiffré en base</div>
  </div>
  <div class="form-body">
    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="vault_robotic_username">Utilisateur robotic</label>
        <input type="text" id="vault_robotic_username" class="form-input" autocomplete="off" placeholder="service-account">
      </div>
      <div class="form-group">
        <label class="form-label" for="vault_password">Mot de passe</label>
        <input type="password" id="vault_password" class="form-input" autocomplete="new-password" placeholder="••••••••">
      </div>
    </div>
    <div id="vault-credential-status" class="form-help"></div>
    <div id="vault-test-result" hidden></div>
    <div class="form-footer" style="padding-left:0;padding-right:0;border:none;">
      <button type="button" id="btn-vault-save" class="btn btn-secondary btn-sm">Enregistrer le credential</button>
      <button type="button" id="btn-vault-test" class="btn btn-ghost btn-sm">Tester la connexion</button>
    </div>
  </div>
</div>
{% endif %}
