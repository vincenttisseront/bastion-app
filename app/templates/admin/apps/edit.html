{% extends "base.html" %}
{% block title %}Modifier {{ app.label }}{% endblock %}
{% block breadcrumb %}Admin / Applications / {{ app.slug }}{% endblock %}

{% block content %}
<div class="page-wrapper" style="max-width:560px;">
  <h1 class="page-title">Modifier {{ app.label }}</h1>
  <form method="post" action="/admin/apps/{{ app.slug }}/edit" class="card" style="margin-top:var(--space-4);">
    <div class="form-group">
      <label class="form-label" for="label">Label</label>
      <input type="text" id="label" name="label" class="form-input" value="{{ app.label }}" required>
    </div>
    <div class="form-group">
      <label class="form-label" for="upstream_url">URL upstream</label>
      <input type="url" id="upstream_url" name="upstream_url" class="form-input" value="{{ app.upstream_url }}" required>
    </div>
    <div class="form-group">
      <label class="form-label" for="access_mode">Mode d'accès</label>
      <select id="access_mode" name="access_mode" class="form-select">
        {% for mode in ['sso', 'direct', 'robotic', 'subdomain'] %}
        <option value="{{ mode }}"{% if app.access_mode == mode %} selected{% endif %}>{{ mode | upper }}</option>
        {% endfor %}
      </select>
    </div>
    <label class="form-checkbox">
      <input type="checkbox" name="enabled"{% if app.enabled %} checked{% endif %}> Application activée
    </label>
    <div style="margin-top:var(--space-4);display:flex;gap:var(--space-2);">
      <button type="submit" class="btn btn-primary">Enregistrer</button>
      <a href="/admin/apps" class="btn btn-ghost">Annuler</a>
    </div>
  </form>
</div>
{% endblock %}
