{% extends "base.html" %}
{% block title %}Créer une application{% endblock %}
{% block breadcrumb %}Admin / Applications / Créer{% endblock %}

{% block content %}
<div class="page-wrapper" style="max-width:560px;">
  <h1 class="page-title">Nouvelle application</h1>
  {% if form_error %}<div class="alert alert-error">{{ form_error }}</div>{% endif %}
  <form method="post" action="/admin/apps/create" class="card" style="margin-top:var(--space-4);">
    <div class="form-group">
      <label class="form-label" for="slug">Slug</label>
      <input type="text" id="slug" name="slug" class="form-input" required pattern="[a-z0-9-]+">
    </div>
    <div class="form-group">
      <label class="form-label" for="label">Label</label>
      <input type="text" id="label" name="label" class="form-input" required>
    </div>
    <div class="form-group">
      <label class="form-label" for="upstream_url">URL upstream</label>
      <input type="url" id="upstream_url" name="upstream_url" class="form-input" required>
    </div>
    <div class="form-group">
      <label class="form-label" for="access_mode">Mode d'accès</label>
      <select id="access_mode" name="access_mode" class="form-select">
        <option value="sso">SSO</option>
        <option value="direct">Direct</option>
        <option value="robotic">Robotic</option>
        <option value="subdomain">Subdomain</option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary">Créer</button>
    <a href="/admin/apps" class="btn btn-ghost">Annuler</a>
  </form>
</div>
{% endblock %}
