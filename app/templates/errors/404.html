{% extends "base.html" %}
{% block title %}Page introuvable{% endblock %}

{% block content %}
<div class="error-page">
  <div class="error-icon" style="background:var(--warn-bg);border-color:rgba(245,158,11,.25);color:var(--warn);">
    <svg width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="11"/><line x1="11" y1="14" x2="11.01" y2="14"/></svg>
  </div>
  <div class="error-code" style="color:var(--warn);">404</div>
  <h1 class="page-title">Page introuvable</h1>
  <p class="error-message">La ressource demandée n'existe pas ou a été déplacée.</p>
  <a href="/dashboard" class="btn btn-primary">Retour au dashboard</a>
</div>
{% endblock %}
