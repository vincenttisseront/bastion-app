{% extends "base_public.html" %}
{% block title %}{{ _('Redirection SSO') }}{% endblock %}

{% block content %}
<div class="login-container">
  <div class="login-card sso-redirect">
    <div class="sso-spinner" role="status" aria-label="{{ _('Redirection en cours') }}"></div>
    <h1 class="login-brand-title">{{ _('Redirection SSO') }}</h1>
    <p class="login-brand-sub">
      {% if branding.welcome_text %}{{ branding.welcome_text }}{% else %}{{ _('Connexion en cours…') }}{% endif %}
    </p>
  </div>
</div>
<script>
  setTimeout(function () {
    window.location.href = {{ redirect_url | tojson }};
  }, 800);
</script>
{% endblock %}
