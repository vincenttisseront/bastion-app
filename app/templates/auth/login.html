{% extends "base.html" %}
{% block title %}Connexion{% endblock %}

{% block content %}
<div class="login-container">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-brand-icon">
        <svg width="28" height="28" fill="none" stroke="#fff" stroke-width="2" viewBox="0 0 24 24">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <h1 class="login-brand-title">Bastion Pro</h1>
      <p class="login-brand-sub">Accès local administrateur</p>
    </div>

    {% if login_error %}
    <div class="login-error" role="alert">{{ login_error }}</div>
    {% endif %}

    <form method="post" action="/auth/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="rd" value="{{ rd | default('/dashboard') }}">
      <div class="form-group">
        <label class="form-label" for="username">Utilisateur</label>
        <input type="text" id="username" name="username" class="form-input" required autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Mot de passe</label>
        <input type="password" id="password" name="password" class="form-input" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-full">Se connecter</button>
    </form>
  </div>
</div>
{% endblock %}
