<header class="topbar">
  <nav class="breadcrumb" aria-label="Fil d'Ariane">
    <a href="/dashboard">Bastion Pro</a>
    <span class="sep">/</span>
    <span class="current">{% block breadcrumb %}{% endblock %}</span>
  </nav>

  <label class="topbar-search" for="global-search-trigger">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="search" id="global-search-trigger" placeholder="Rechercher…" autocomplete="off"
           aria-label="Recherche globale" readonly>
  </label>

  <div class="topbar-spacer"></div>

  <div class="notif-center" id="notif-center">
    <button type="button" class="icon-btn" id="notifications-btn"
            aria-label="Notifications" title="Notifications"
            aria-haspopup="dialog" aria-expanded="false" aria-controls="notif-panel">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span class="dot" data-notif-dot hidden aria-hidden="true"></span>
      <span class="notif-count" data-notif-count hidden aria-hidden="true"></span>
    </button>
    <div id="notif-panel" class="notif-panel" role="dialog" aria-label="Centre de notifications"
         aria-modal="false" hidden tabindex="-1">
      <div class="notif-panel-head">
        <h2 class="notif-panel-title">Notifications</h2>
        <div class="notif-panel-actions">
          <button type="button" class="notif-panel-link" data-notif-dismiss-all hidden>
            Tout marquer lu
          </button>
          <a class="notif-panel-link" href="/admin/logs">Voir les logs</a>
        </div>
      </div>
      <div class="notif-feed" data-notif-feed>
        <div class="notif-loading"><span class="notif-spinner" aria-hidden="true"></span> Chargement…</div>
      </div>
      <div class="notif-shortcuts-label">Accès rapide</div>
      <div class="notif-shortcuts" data-notif-shortcuts></div>
    </div>
  </div>

  <button type="button" class="icon-btn" id="theme-toggle" aria-label="Basculer le thème" title="Thème">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
      <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
    </svg>
  </button>

  {% if current_user %}
  <span class="topbar-sep" aria-hidden="true"></span>
  {% with menu_user=current_user %}
  {% include 'partials/_user_menu.html' %}
  {% endwith %}
  {% endif %}
</header>
