<div class="metric-card {{ variant | default('ok') }}">
  <div class="metric-card-header">
    <div class="metric-icon">{{ icon | safe }}</div>
    {% if trend %}
    <span class="metric-trend {{ trend_class | default('flat') }}">{{ trend }}</span>
    {% endif %}
  </div>
  <div class="metric-value">{{ value | safe }}</div>
  <div class="metric-label">{{ label }}</div>
</div>
