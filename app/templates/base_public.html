<!DOCTYPE html>
<html lang="fr" data-theme="{{ branding.default_theme | default('dark') }}"{% if branding.css_vars %} style="{{ branding.css_vars }}"{% endif %}>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="robots" content="noindex,nofollow">
  <title>{% block title %}{{ branding.page_title }}{% endblock %}{% if branding.show_product_branding %} — Bastion Pro{% endif %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ branding.favicon_url | default('/static/img/generic-shield.svg') }}">
  <script src="/static/portal-theme.js?v=20260801-branding3"></script>
  <link rel="stylesheet" href="/static/portal.css?v=20260802-solid-brand">
  {% block head_extra %}{% endblock %}
</head>
<body class="{% block body_class %}page-login{% endblock %}">
  <main class="main-content" id="main-content">
    {% if messages %}
      <div class="flash-container">{% include 'partials/_flash.html' %}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  {% include 'partials/_bastion_modal.html' %}
  <script src="/static/portal-busy.js?v=20260731-branding"></script>
  <script src="/static/portal-modal.js?v=20260731-branding"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
