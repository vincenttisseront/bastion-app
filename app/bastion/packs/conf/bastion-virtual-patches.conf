# Bastion ModSecurity virtual patches — PHP2Shell (CVE-2026-109618 / CVE-2026-109619).
#
# Interim edge mitigations until origin PHP is patched (8.2.35+ / 8.3.36+ /
# 8.4.27+ / 8.5.12+). OWASP CRS 4.28 has no dedicated PHP2Shell rules; load
# these BEFORE /etc/modsecurity.d/owasp-crs/rules/*.conf (pre-CRS phase:1/2).
#
# Design notes:
# - IDs 100096180–100096199 (outside CRS 900000–999999 and Bastion 1000900110 /
#   1500000+ exclusion ranges).
# - Prefer deny,status:403 when SecRuleEngine On; rules must parse with engine Off.
# - No bare "%" macros in actions (libmodsecurity / nginx -t breakage).
# - Do not block Cookie:PHPSESSID — only PHPSESSID as a POST form field name.
# - SecRequestBodyAccess is already On in modsecurity.conf.
#
# Scope: low FP for Bastion portal login (urlencoded forms without these fields).
# Backends that legitimately use session.upload_progress or deeply nested multipart
# names may need Admin exclusions after arming the WAF.

# 100096180 — session fixation / upload-progress chain: PHPSESSID as POST field.
# Legitimate clients send the session id in Cookie, never as a form field name.
SecRule ARGS_POST_NAMES "@streq PHPSESSID" "id:100096180,phase:2,deny,status:403,log,msg:'php2shell: PHPSESSID as POST form field',tag:'php2shell',tag:'CVE-2026-109618',tag:'CVE-2026-109619',severity:2,t:none"

# 100096181 — PHP session.upload_progress trigger field (default name).
# Bastion and typical apps do not need this field; PoCs require it for CVE-2026-109619.
SecRule ARGS_POST_NAMES "@streq PHP_SESSION_UPLOAD_PROGRESS" "id:100096181,phase:2,deny,status:403,log,msg:'php2shell: PHP_SESSION_UPLOAD_PROGRESS field',tag:'php2shell',tag:'CVE-2026-109619',severity:2,t:none"

# 100096182 — PHP open tags in uploaded filenames (not file contents).
# FILES holds client filenames for multipart file parts only.
SecRule FILES "@rx (?i)<\?(?:php|=)" "id:100096182,phase:2,deny,status:403,log,msg:'php2shell: PHP open tag in upload filename',tag:'php2shell',tag:'CVE-2026-109619',severity:2,t:none"

# 100096183 — deeply nested multipart field names (CVE-2026-109618 memory/path heuristics).
# 12+ bracket levels is far beyond normal Bastion / form nesting (CrowdSec-style threshold).
SecRule REQBODY_PROCESSOR "@streq MULTIPART" "id:100096183,phase:2,deny,status:403,log,msg:'php2shell: deeply nested multipart field name',tag:'php2shell',tag:'CVE-2026-109618',severity:2,t:none,chain"
SecRule ARGS_POST_NAMES|FILES_NAMES "@rx (?:\[[^\[\]]*\]){12,}" "t:none"

# 100096184 — multipart/form-data without Content-Length (chunked / lengthless body).
# Browsers send Content-Length on form uploads; lengthless bodies can bypass post_max_size.
# Residual FP: legitimate streaming / HTTP/2 duplex multipart without Content-Length.
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^\s*multipart/form-data([;,\s]|$)" "id:100096184,phase:1,deny,status:403,log,msg:'php2shell: multipart without Content-Length',tag:'php2shell',tag:'CVE-2026-109618',severity:2,t:none,chain"
SecRule &REQUEST_HEADERS:Content-Length "@eq 0"
