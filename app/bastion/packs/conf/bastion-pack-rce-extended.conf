# Bastion ModSecurity virtual pack — RCE & Shells Étendu.
#
# Complement to PHP2Shell: multi-runtime command execution / webshell markers.
# IDs 100096400–100096449. Pre-CRS via bastion-virtual-patches-enabled.conf.
# Single-line SecRules; deny,status:403; no bare "%" macros.

# 100096400 — python/perl/node one-liners and common process APIs.
SecRule ARGS|REQUEST_BODY "@rx (?i)(?:python(?:3)?\s+-c\b|perl\s+-e\b|node\s+-e\b|os\.system\s*\(|subprocess\.(?:call|Popen|run)\s*\()" "id:100096400,phase:2,deny,status:403,log,msg:'rce_extended: runtime one-liner or process API',tag:'rce_extended',tag:'attack-rce',severity:2,t:none,t:urlDecodeUni"

# 100096401 — shell chaining / downloaders in args or upload filenames.
SecRule ARGS|FILES_NAMES "@rx (?i)(?:;\s*(?:wget|curl|nc|bash|sh)\b|`[^`]{0,80}`|\$\([^)]{0,80}\))" "id:100096401,phase:2,deny,status:403,log,msg:'rce_extended: shell chain or downloader',tag:'rce_extended',tag:'attack-rce',severity:2,t:none,t:urlDecodeUni"

# 100096402 — JSP/ASPX path markers and Java Runtime.exec surface.
# Note: avoid bare "%" in the rule text (libmodsecurity macro parse); ASP <%…%>
# tags are already covered by CRS XSS/RFI families.
SecRule REQUEST_URI|ARGS "@rx (?i)(?:\.(?:jsp|aspx?)(\?|$)|Runtime\.getRuntime\s*\()" "id:100096402,phase:2,deny,status:403,log,msg:'rce_extended: webshell path or Runtime.getRuntime',tag:'rce_extended',tag:'attack-rce',severity:2,t:none,t:urlDecodeUni"
