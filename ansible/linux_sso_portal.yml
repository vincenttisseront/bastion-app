---
# Portail SSO AR Systems — bastion-app (Phase 6)
# Prérequis : client OIDC Keycloak, DNS portal.ar-systems.fr, secrets Vault AWX
#
# Usage:
#   ansible-playbook ansible/linux_sso_portal.yml \
#     -i ansible/inventory/inventory_sso_portal.ini
#
# Dry-run:
#   ansible-playbook ... --check --diff
#
# Inventaire : groupe [sso_portal] (même host que la DMZ aujourd'hui : vmdmz-reverse01).
# Bascule : ce playbook reprend le scope applicatif ; linux_nginx_dmz.yml (awx-playbook)
# redevient infra DMZ pure après validation prod (étapes 6–7 du plan Phase 6).

- name: "PRE-FLIGHT : validation avant modification"
  hosts: sso_portal
  become: true
  gather_facts: true
  tags:
    - preflight
  tasks:
    - name: Run SSO portal preflight checks
      ansible.builtin.include_role:
        name: sso_portal
        tasks_from: preflight.yml
      when: sso_portal_enabled | default(true) | bool

- name: Deploy SSO portal (FastAPI + nginx + apply-infra)
  hosts: sso_portal
  become: true
  gather_facts: true
  tags:
    - deploy
  roles:
    - role: sso_portal
      when: sso_portal_enabled | default(true) | bool

- name: "SMOKE TEST : vérification post-déploiement"
  hosts: sso_portal
  become: true
  gather_facts: false
  tags:
    - smoke_test
  tasks:
    - name: Run SSO portal smoke test (no automatic rollback)
      ansible.builtin.include_role:
        name: sso_portal
        tasks_from: smoke_test.yml
      when: sso_portal_enabled | default(true) | bool
