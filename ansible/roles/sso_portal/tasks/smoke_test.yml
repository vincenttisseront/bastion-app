---
# Smoke test — fail the run on assertion failure; NEVER auto-rollback (Phase 6 §2.3)

- name: "SMOKE : GET /api/health"
  ansible.builtin.uri:
    url: "http://{{ sso_portal_bind_host }}:{{ sso_portal_bind_port }}/api/health"
    return_content: true
    status_code: 200
  register: _health
  retries: 15
  delay: 2
  until: _health.status | default(0) == 200

- name: "SMOKE : assert health phase"
  ansible.builtin.assert:
    that:
      - _health.json is defined
      - _health.json.status == 'ok'
      - _health.json.phase | string == (sso_portal_expected_health_phase | string)
    fail_msg: >-
      /api/health inattendu : {{ _health.content | default('n/a') }}.
      Attendu status=ok phase={{ sso_portal_expected_health_phase }}
      (APP_VERSION {{ sso_portal_app_version }}).

- name: "SMOKE : nginx -t post-déploiement"
  ansible.builtin.command: nginx -t
  changed_when: false
  register: _smoke_nginx
  failed_when: _smoke_nginx.rc != 0

- name: "SMOKE : lister realms actifs + ports depuis SQLite"
  ansible.builtin.shell: |
    set -o pipefail
    {{ sso_portal_venv }}/bin/python - <<'PY'
    import sqlite3, json, os
    db = os.environ.get("DB", "{{ sso_portal_db_path }}")
    con = sqlite3.connect(db)
    con.row_factory = sqlite3.Row
    rows = con.execute(
        "SELECT slug, oauth2_proxy_port FROM realm_configs WHERE enabled = 1 ORDER BY slug"
    ).fetchall()
    print(json.dumps([{"slug": r["slug"], "port": r["oauth2_proxy_port"]} for r in rows]))
    PY
  args:
    executable: /bin/bash
  environment:
    DB: "{{ sso_portal_db_path }}"
  register: _realms_json
  changed_when: false
  failed_when: false

- name: "SMOKE : parser realms"
  ansible.builtin.set_fact:
    _active_realms: "{{ (_realms_json.stdout | default('[]') | from_json) if (_realms_json.rc | default(1)) == 0 else [] }}"
    _oauth2_core_port: "{{ oauth2_core_listen.split(':')[-1] | int }}"
    _oauth2_core_slug: "{{ oauth2_core_realm_slug | default(sso_portal_default_realm_slug) }}"

- name: "SMOKE : secondary realms (hors core)"
  ansible.builtin.set_fact:
    _secondary_realms: "{{ _active_realms | rejectattr('slug', 'equalto', _oauth2_core_slug) | list }}"

- name: "SMOKE : core realm depuis DB ou fallback listen"
  ansible.builtin.set_fact:
    _core_realms: "{{ _active_realms | selectattr('slug', 'equalto', _oauth2_core_slug) | list }}"

- name: "SMOKE : fallback core realm si absent de la DB"
  ansible.builtin.set_fact:
    _core_realms:
      - slug: "{{ _oauth2_core_slug }}"
        port: "{{ _oauth2_core_port | int }}"
  when: (_core_realms | length) == 0

- name: "SMOKE : oauth2/start core realm (302 attendu — bloquant)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ item.port }}/oauth2/start"
    method: GET
    follow_redirects: none
    status_code: [302, 303]
  loop: "{{ _core_realms }}"
  register: _oauth2_core_starts

- name: "SMOKE : assert oauth2/start OK pour realm core"
  ansible.builtin.assert:
    that:
      - item.status | default(0) in [302, 303]
    fail_msg: >-
      oauth2/start CORE slug={{ item.item.slug }} port={{ item.item.port }}
      status={{ item.status | default('n/a') }} — oauth2-proxy-core doit tourner.
  loop: "{{ _oauth2_core_starts.results | default([]) }}"

- name: "SMOKE : stat client_secret des realms secondaires"
  ansible.builtin.stat:
    path: "{{ oauth2_proxy_portal_config_dir }}/{{ item.slug }}/client_secret"
  loop: "{{ _secondary_realms }}"
  register: _secondary_secrets
  when: _secondary_realms | length > 0

- name: "SMOKE : oauth2/start realms secondaires (si secret présent)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ item.item.port }}/oauth2/start"
    method: GET
    follow_redirects: none
    status_code: [302, 303]
  loop: "{{ _secondary_secrets.results | default([]) }}"
  when:
    - _secondary_realms | length > 0
    - item.stat.exists | default(false)
  register: _oauth2_secondary_starts
  failed_when: false

- name: "SMOKE : assert oauth2/start OK pour secondaires configurés"
  ansible.builtin.assert:
    that:
      - item.status | default(0) in [302, 303]
    fail_msg: >-
      oauth2/start secondary slug={{ item.item.item.slug }} port={{ item.item.item.port }}
      status={{ item.status | default('n/a') }} (client_secret présent mais proxy down).
  loop: "{{ _oauth2_secondary_starts.results | default([]) }}"
  when:
    - _oauth2_secondary_starts is defined
    - (_oauth2_secondary_starts.results | default([]) | length) > 0
    - not (item.skipped | default(false))

- name: "SMOKE : warn realms secondaires sans client_secret (non-bloquant)"
  ansible.builtin.debug:
    msg: >-
      Realm secondaire '{{ item.item.slug }}' port={{ item.item.port }} :
      pas de {{ oauth2_proxy_portal_config_dir }}/{{ item.item.slug }}/client_secret —
      oauth2-proxy non démarré (attendu tant que le secret Keycloak n'est pas fourni).
  loop: "{{ _secondary_secrets.results | default([]) }}"
  when:
    - _secondary_realms | length > 0
    - not (item.stat.exists | default(false))

- name: "SMOKE : subdomain-auth (≠ 500 ; 200 OK si bypass RFC1918 depuis AWX)"
  ansible.builtin.uri:
    url: "https://{{ portal_domain }}/internal/subdomain-auth"
    method: GET
    validate_certs: false
    status_code: [200, 401, 302]
    follow_redirects: none
  register: _subdomain_auth
  failed_when: (_subdomain_auth.status | default(0)) == 500

- name: "SMOKE : subdomain-auth direct FastAPI sans cookie / sans RFC1918 → 401"
  ansible.builtin.uri:
    url: "http://{{ sso_portal_bind_host }}:{{ sso_portal_bind_port }}/internal/subdomain-auth"
    method: GET
    headers:
      X-Real-IP: "8.8.8.8"
      X-Original-Host: "transfer.{{ base_domain }}"
    status_code: [401, 503]
    follow_redirects: none
  register: _subdomain_auth_direct
  failed_when: (_subdomain_auth_direct.status | default(0)) == 500

- name: "SMOKE : assert subdomain-auth non-500"
  ansible.builtin.assert:
    that:
      - (_subdomain_auth.status | default(0)) != 500
      - (_subdomain_auth.status | default(0)) in [200, 401, 302]
      - (_subdomain_auth_direct.status | default(0)) != 500
      - (_subdomain_auth_direct.status | default(0)) in [401, 503]
    fail_msg: >-
      subdomain-auth via nginx={{ _subdomain_auth.status | default('n/a') }}
      (200=bypass RFC1918 LAN OK ; 401/302 OK ; 500 interdit).
      direct FastAPI={{ _subdomain_auth_direct.status | default('n/a') }}
      (attendu 401 sans session depuis IP publique factice).

- name: "SMOKE : détecter locations /proxy/ actives (proxy_pass) hors redirect 301/302"
  ansible.builtin.shell: |
    set -euo pipefail
    {{ sso_portal_venv }}/bin/python - <<'PY'
    import pathlib
    import re
    import sys

    conf_dir = pathlib.Path("{{ nginx_conf_dir }}")
    # location ... /proxy/ ... { ... }  — corps jusqu'à la } de même niveau (simple)
    loc_re = re.compile(
        r"location\s+[^{;\n]*?/proxy/[^{]*\{([^{}]*(?:\{[^{}]*\}[^{}]*)*)\}",
        re.MULTILINE,
    )
    bad = []
    for path in sorted(conf_dir.glob("*.conf")):
        text = path.read_text(encoding="utf-8", errors="replace")
        for match in loc_re.finditer(text):
            header = match.group(0).split("{", 1)[0].strip()
            body = match.group(1)
            line_no = text[: match.start()].count("\n") + 1
            has_redirect = re.search(r"\breturn\s+30[123]\b", body) is not None
            has_proxy_pass = re.search(r"\bproxy_pass\b", body) is not None
            if has_proxy_pass or not has_redirect:
                bad.append(f"{path}:{line_no}:{header} (proxy_pass={has_proxy_pass} redirect={has_redirect})")
    if bad:
        print("\n".join(bad))
        sys.exit(1)
    print("OK: aucune location /proxy/ active (uniquement redirects 301/302 legacy)")
    PY
  args:
    executable: /bin/bash
  register: _proxy_locations
  changed_when: false
  failed_when: false

- name: "SMOKE : assert pas de location /proxy/ active hors legacy 301/302"
  ansible.builtin.assert:
    that:
      - (_proxy_locations.rc | default(1)) == 0
    fail_msg: >-
      Locations /proxy/ actives (proxy_pass ou sans return 301/302) :
      {{ _proxy_locations.stdout | default(_proxy_locations.stderr) }}

- name: "SMOKE : OK"
  ansible.builtin.debug:
    msg: "Smoke test SSO portal vert (phase={{ sso_portal_expected_health_phase }})"
