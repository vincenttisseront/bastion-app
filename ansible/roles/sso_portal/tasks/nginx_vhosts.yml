---
# tasks/nginx_vhosts.yml
# Déploiement des vhosts Nginx et snippets pour le portail SSO + sous-domaines
#
# Les vhosts Jinja font {% include 'snippets/...' %} : Ansible ne résout pas
# nginx/snippets depuis nginx/vhosts. On stage un arbre de rendu sur le contrôleur
# (même pattern que awx-playbook bastion_app_prepare_controller).

- name: Check if portal access log format is defined in nginx.conf
  ansible.builtin.command: grep -q 'log_format portal ' /etc/nginx/nginx.conf
  register: portal_log_format_defined
  changed_when: false
  failed_when: false

- name: Ensure portal access log format in nginx.conf http block
  ansible.builtin.blockinfile:
    path: /etc/nginx/nginx.conf
    marker: "# {mark} ANSIBLE MANAGED — portal access log format"
    insertafter: 'access_log /var/log/nginx/access.log main;'
    block: |2
      log_format portal '$remote_addr - $host [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                        'us=$upstream_status';
    create: false
  when: portal_log_format_defined.rc != 0
  notify: Reload nginx

- name: Check if portal_login rate zone exists in nginx.conf
  ansible.builtin.command: grep -q 'zone=portal_login' /etc/nginx/nginx.conf
  register: portal_login_zone_defined
  changed_when: false
  failed_when: false

- name: Add portal SSO rate limit zones to nginx http block
  ansible.builtin.blockinfile:
    path: /etc/nginx/nginx.conf
    marker: "# {mark} ANSIBLE MANAGED — portal SSO rate zones"
    insertbefore: "include /etc/nginx/includes/waf-maps.conf"
    block: |2
      limit_req_zone $binary_remote_addr zone=portal_login:10m rate=3r/s;
      limit_req_zone $binary_remote_addr zone=portal_api:10m rate=30r/s;
    create: false
  when: portal_login_zone_defined.rc != 0
  notify: Reload nginx

- name: Créer le répertoire exports portail
  ansible.builtin.file:
    path: "{{ sso_portal_exports_path }}"
    state: directory
    mode: "0755"
    owner: "{{ sso_portal_user }}"
    group: "{{ sso_portal_user }}"

- name: Ensure portal break-glass map file exists
  ansible.builtin.copy:
    src: "{{ bastion_app_root }}/nginx/maps/nginx-portal-breakglass.map.conf"
    dest: "{{ sso_portal_exports_path }}/nginx-portal-breakglass.map.conf"
    owner: "{{ sso_portal_user }}"
    group: "{{ sso_portal_user }}"
    mode: "0644"
  notify: Reload nginx

- name: Check if portal break-glass map is included in nginx.conf
  ansible.builtin.command: grep -q 'nginx-portal-breakglass.map.conf' /etc/nginx/nginx.conf
  register: portal_breakglass_map_included
  changed_when: false
  failed_when: false

- name: Include portal break-glass auth_source map in nginx http block
  ansible.builtin.blockinfile:
    path: /etc/nginx/nginx.conf
    marker: "# {mark} ANSIBLE MANAGED — portal break-glass auth map"
    insertafter: 'http {'
    block: |2
      include {{ sso_portal_exports_path }}/nginx-portal-breakglass.map.conf;
    create: false
  when: portal_breakglass_map_included.rc != 0
  notify: Reload nginx

- name: Assurer un fragment nginx-portal-realms.conf valide (include obligatoire)
  ansible.builtin.copy:
    dest: "{{ sso_portal_exports_path }}/nginx-portal-realms.conf"
    content: |
      # Generated by realm_service — do not edit manually

    force: false
    mode: "0644"

- name: Créer le répertoire snippets nginx
  ansible.builtin.file:
    path: "{{ nginx_snippets_dir }}"
    state: directory
    mode: "0755"

- name: Stage nginx Jinja render tree on controller
  vars:
    _nginx_render_dir: "{{ playbook_dir }}/.cache/bastion-nginx-render"
  block:
    - name: Reset nginx render directory on controller
      ansible.builtin.file:
        path: "{{ _nginx_render_dir }}"
        state: absent
      delegate_to: localhost
      become: false
      run_once: true

    - name: Create nginx render snippets directory
      ansible.builtin.file:
        path: "{{ _nginx_render_dir }}/snippets"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Stage bastion-app nginx snippets for Jinja includes
      ansible.builtin.copy:
        src: "{{ bastion_nginx_snippets_src }}/"
        dest: "{{ _nginx_render_dir }}/snippets/"
        mode: "0644"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Stage portal vhost template for renderer
      ansible.builtin.copy:
        src: "{{ bastion_nginx_vhosts_src }}/vhost_sso_portal.conf.j2"
        dest: "{{ _nginx_render_dir }}/vhost_sso_portal.conf.j2"
        mode: "0644"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Stage subdomain vhost template for renderer
      ansible.builtin.copy:
        src: "{{ bastion_nginx_vhosts_src }}/vhost-subdomain-crushftp.conf.j2"
        dest: "{{ _nginx_render_dir }}/vhost-subdomain-crushftp.conf.j2"
        mode: "0644"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Publish staged nginx template paths
      ansible.builtin.set_fact:
        bastion_nginx_staged_portal_vhost: "{{ _nginx_render_dir }}/vhost_sso_portal.conf.j2"
        bastion_nginx_staged_subdomain_vhost: "{{ _nginx_render_dir }}/vhost-subdomain-crushftp.conf.j2"
        bastion_nginx_staged_snippets_dir: "{{ _nginx_render_dir }}/snippets"

- name: Déployer les snippets Nginx (runtime /etc/nginx/snippets)
  ansible.builtin.template:
    src: "{{ bastion_nginx_staged_snippets_dir }}/{{ item }}"
    dest: "{{ nginx_snippets_dir }}/{{ item | regex_replace('\\.j2$', '') }}"
    mode: "0644"
  loop:
    - subdomain_auth_common.conf.j2
    - proxy_portal_forwarded_backend.conf.j2
    - proxy_portal_legacy_redirects.conf.j2
  notify: Reload nginx

- name: Déployer le vhost portail SSO
  ansible.builtin.template:
    src: "{{ bastion_nginx_staged_portal_vhost }}"
    dest: "{{ nginx_conf_dir }}/vhost_sso_portal.conf"
    mode: "0644"
  when: sso_portal_enabled | default(true)
  notify: Reload nginx

- name: Supprimer le vhost portail si désactivé
  ansible.builtin.file:
    path: "{{ nginx_conf_dir }}/vhost_sso_portal.conf"
    state: absent
  when: not (sso_portal_enabled | default(true))
  notify: Reload nginx

- name: Déployer les vhosts subdomain SSO
  ansible.builtin.template:
    src: "{{ bastion_nginx_staged_subdomain_vhost }}"
    dest: "{{ nginx_conf_dir }}/vhost_subdomain_{{ vhost.slug }}.conf"
    mode: "0644"
  loop: "{{ nginx_subdomain_sso_vhosts | default([]) }}"
  loop_control:
    loop_var: vhost
  when: sso_portal_subdomain_sso_enabled | default(false)
  notify: Reload nginx

- name: Repérer les vhosts subdomain existants
  ansible.builtin.find:
    paths: "{{ nginx_conf_dir }}"
    patterns: "vhost_subdomain_*.conf"
  register: _existing_subdomain_vhosts

- name: Purger vhosts subdomain si subdomain SSO désactivé
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _existing_subdomain_vhosts.files }}"
  when: not (sso_portal_subdomain_sso_enabled | default(false))
  notify: Reload nginx

- name: Tester la configuration Nginx
  ansible.builtin.command: nginx -t
  changed_when: false
  register: _nginx_test
  failed_when: _nginx_test.rc != 0
