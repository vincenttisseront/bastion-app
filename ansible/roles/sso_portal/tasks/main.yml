---
# SSO Portal — Phase 1 skeleton (full deploy in Phase 6)
- name: SSO portal deployment
  when: sso_portal_enabled | default(true) | bool
  block:
    - name: Build portal artefact from app source
      ansible.builtin.synchronize:
        src: "{{ bastion_app_root }}/"
        dest: "{{ role_path }}/files/portal/"
        delete: false
        rsync_opts:
          - "--include=/app/***"
          - "--include=/pyproject.toml"
          - "--exclude=*"
      delegate_to: localhost
      run_once: true

    - name: Deploy nginx vhosts
      ansible.builtin.import_tasks: nginx_vhosts.yml
