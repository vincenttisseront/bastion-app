# Traefik file-provider — catch-all → bastion-nginx:8080
#
# Deployed by ansible role bastion_app_docker to:
#   /tools/keycloak/traefik-config/bastion-catchall.yml
# (Traefik --providers.file.directory=/etc/traefik + watch=true)
#
# Companion: docker-compose.yml labels on bastion-nginx (bastion-catchall@docker).
# Both may coexist (namespaced by provider). Priority 1 loses to Host(`…`) routers
# (Keycloak, portal, …). Unknown FQDNs hit bastion-nginx → PendingHost discovery.
#
# No certresolver: reverse01 terminates public TLS; Traefik presents its default
# cert to reverse01 (proxy_ssl_verify off).

http:
  routers:
    bastion-catchall:
      entryPoints:
        - websecure
      rule: "PathPrefix(`/`)"
      priority: 1
      service: bastion-nginx
      tls: {}

  services:
    bastion-nginx:
      loadBalancer:
        servers:
          - url: "http://bastion-nginx:8080"
