---
# SSO Portal Docker — defaults (Phase 7)
# Stack sur vmdmz-docker01 sous /tools/portal (comme Keycloak → /tools/keycloak).
# nginx edge TLS sur vmdmz-reverse01.

bastion_app_docker_enabled: true
# Racine config + compose sur docker01
bastion_app_docker_compose_dir: /tools/portal
# Données persistantes hôte (monté → /var/lib/sso-portal dans les conteneurs)
bastion_app_docker_data_dir: /tools/portal/data
# Blobs fichiers versionnés (monté → /var/lib/sso-portal-files) — cycle de vie / backup séparés
bastion_app_docker_files_data_dir: "{{ bastion_app_docker_data_dir }}-files"

# Host Docker (inventaire AWX : vmdmz-docker01 = 172.24.0.110)
bastion_docker_host: vmdmz-docker01
bastion_docker_host_ip: "172.24.0.110"
# Legacy var — smoke local
bastion_publish_bind: "127.0.0.1"

# Edge nginx (hors scope deploy Docker — doc / smoke distant)
bastion_edge_host: vmdmz-reverse01
bastion_edge_host_ip: "172.24.0.108"
# Upstream public : nginx edge sur docker01 (80/443) — Traefik optionnel / coupé
bastion_upstream_url: "https://{{ bastion_docker_host_ip }}"
bastion_traefik_network: vpcbr
bastion_nginx_listen_port: 8080
# Traefik file provider — désactivé quand nginx publie 80/443 en direct
bastion_traefik_config_dir: /tools/keycloak/traefik-config
bastion_traefik_catchall_deploy: false
bastion_require_traefik: false

# Binds locaux sur docker01 (smoke on-host / debug)
bastion_app_docker_bind_app: "127.0.0.1:8000"
bastion_app_docker_bind_oauth2_core: "127.0.0.1:4180"
bastion_app_docker_bind_nginx: "127.0.0.1:{{ bastion_nginx_listen_port }}"

# Source / Hub deploy mode
# hub (default) = same as deploy/: pull Docker Hub images, no compose build
# source        = legacy: tar full tree + docker compose build (dev / DHI)
bastion_deploy_mode: hub
bastion_hub_namespace: vincenttisseront
bastion_hub_image_tag: latest
bastion_app_image: "{{ bastion_hub_namespace }}/bastion-pro-app:{{ bastion_hub_image_tag }}"
bastion_migrate_image: "{{ bastion_hub_namespace }}/bastion-pro-migrate:{{ bastion_hub_image_tag }}"
bastion_nginx_image: "{{ bastion_hub_namespace }}/bastion-pro-nginx:{{ bastion_hub_image_tag }}"
# Retag Hub → :local only for source VERIFY archaeology (unused on hub fast path)
bastion_retag_local_aliases: false
# Docker Hub login (private repos) — AWX Vault
vault_dockerhub_username: ""
vault_dockerhub_token: ""
bastion_hub_login: true

# Source code for build (mode=source) or packing deploy/ + scripts (mode=hub)
# AWX Project = bastion-app → playbook_dir/.. EST le checkout applicatif.
# bastion_app_docker_fetch_git: true seulement si le JT pointe ailleurs sans sources.
bastion_app_git_repo: "https://github.com/vincenttisseront/bastion-app.git"
bastion_app_git_ref: "master"
bastion_app_docker_fetch_git: false
# Checkout used for the tar (AWX project=bastion-app: playbook_dir/..)
bastion_app_root: "{{ playbook_dir }}/.."
bastion_app_docker_image_tag: "bastion-app:{{ bastion_app_git_ref }}"
bastion_nginx_docker_image_tag: "bastion-nginx:{{ bastion_app_git_ref }}"
oauth2_proxy_image_tag: "v7.7.1"

# Infra Host proxies on bastion-nginx (edge catch-all → Traefik → nginx).
# Keycloak must share vpcbr with a DNS alias matching the upstream host.
bastion_infra_proxy_vhosts:
  - slug: keycloak
    fqdn: "keycloak.{{ base_domain | default('ar-systems.fr') }}"
    upstream_url: "http://keycloak:8080"
    enabled: true
  - slug: grafana
    fqdn: "grafana.{{ base_domain | default('ar-systems.fr') }}"
    upstream_url: "http://grafana:3000"
    enabled: false
  - slug: wikijs
    fqdn: "wikijs.{{ base_domain | default('ar-systems.fr') }}"
    upstream_url: "http://wikijs:3000"
    enabled: false

# Domain / health
base_domain: ar-systems.fr
portal_domain: portal.ar-systems.fr
sso_portal_default_realm_slug: ar-systems
sso_portal_expected_health_phase: "5"
sso_portal_app_version: "0.5.0"
sso_portal_db_path: "{{ bastion_app_docker_data_dir }}/portal.db"
sso_portal_keys_dir: "{{ bastion_app_docker_data_dir }}/keys"
sso_portal_exports_dir: "{{ bastion_app_docker_data_dir }}/exports"
sso_portal_files_data_dir: "{{ bastion_app_docker_files_data_dir }}"
sso_portal_files_storage_dir: "{{ bastion_app_docker_files_data_dir }}/private/files"
sso_portal_env_path: "{{ bastion_app_docker_compose_dir }}/.env"
sso_portal_min_free_disk_mb: 512
sso_portal_backup_retention_days: 14
sso_portal_nginx_logs_dir: "{{ bastion_app_docker_data_dir }}/nginx-logs"
sso_portal_db_backup_keep_count: 5
sso_portal_db_backup_daily_days: 7
# Runbook CRS §0.1 — documented thresholds (enforced manually before CRS re-enable).
sso_portal_tools_disk_max_use_pct: 70
sso_portal_tools_min_free_gb_crs: 3

# Secrets (override via Vault / AWX extra-vars — never commit)
# Bootstrap crypto + nginx Bearer only. HMAC (hop / breakglass JWT) are seeded
# into portal_settings by migrate (`python -m app.runtime_secrets_service`).
vault_portal_internal_token: ""
vault_sso_portal_oidc_client_secret: ""
vault_portal_vault_fernet_key: ""
vault_portal_db_encryption_key: ""
portal_secret_encryption_key: ""
# Optional Postgres hot store (compose service ``postgres``).
# AWX: set Extra Var / Vault ``vault_hot_store_pg_password`` (aliases:
# ``hot_store_pg_password`` or ``HOT_STORE_PG_PASSWORD``). Single source: the
# entrypoint applies it to the role and the app connects with it. Leaving it
# empty falls back to the compose default and breaks authentication.
hot_store_pg_user: bastion_hot
hot_store_pg_db: bastion_hot
vault_hot_store_pg_password: ""
hot_store_pg_password: ""
# Single resolution of the three accepted names, shared by portal.env.j2 and the
# preflight guard. ``default(x, true)`` on every level: the two aliases above are
# declared empty here, so without the boolean flag the chain would stop on the
# first one and never reach ``HOT_STORE_PG_PASSWORD``.
hot_store_pg_password_resolved: >-
  {{ (vault_hot_store_pg_password
      | default(hot_store_pg_password
                | default(HOT_STORE_PG_PASSWORD | default(''), true), true)
     ) | trim }}
# development | production
portal_environment: production

# Docker Hardened Images (dhi.io) — pull requires Docker Hub auth (PAT recommended).
# AWX Vault / Extra Vars:
#   vault_dhi_registry_username  — Docker ID or org name
#   vault_dhi_registry_token     — PAT/OAT read-only (prefer token over password)
# Escape hatch (no dhi.io): bastion_app_use_dhi=false → python:3.12-slim build-args.
bastion_app_use_dhi: true
vault_dhi_registry_username: ""
vault_dhi_registry_token: ""
bastion_app_python_runtime_image: >-
  {{ 'dhi.io/python:3.12-debian13' if (bastion_app_use_dhi | bool)
     else 'python:3.12-slim' }}
bastion_app_python_builder_image: >-
  {{ 'dhi.io/python:3.12-debian13-dev' if (bastion_app_use_dhi | bool)
     else 'python:3.12-slim' }}

# Post-rotation smoke (decrypt check) — activer seulement après rotate_fernet_key
sso_portal_post_rotation_smoke: false
sso_portal_verify_fernet_key_migration: true

# oauth2-core config on host (copied into compose dir)
oauth2_core_config_src: "{{ bastion_app_root }}/docker/oauth2-core"
