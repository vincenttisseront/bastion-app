# Check DNS vpcbr + proxy nginx → app
- name: "Assert nginx resolves bastion-app on vpcbr and proxies /api/health"
  ansible.builtin.shell: |
    set -euo pipefail
    net="{{ bastion_traefik_network }}"
    app_cid="$(docker ps -q -f name=bastion-bastion-app -f status=running | head -1)"
    app_cid="${app_cid:-$(docker ps -q -f label=com.docker.compose.service=bastion-app -f status=running | head -1)}"
    echo "app_cid=${app_cid}"
    [[ -n "${app_cid}" ]]

    echo "=== container IPs on ${net} ==="
    python3 - "$net" bastion-nginx "$app_cid" <<'PY'
    import json, subprocess, sys
    net, *cids = sys.argv[1:]
    for cid in cids:
        data = json.loads(subprocess.check_output(["docker", "inspect", cid], text=True))[0]
        name = data.get("Name", cid).lstrip("/")
        nets = data.get("NetworkSettings", {}).get("Networks") or {}
        ep = nets.get(net) or {}
        print("%s ip=%s aliases=%s" % (name, ep.get("IPAddress"), ep.get("Aliases")))
    PY

    echo "=== direct app health from nginx (DNS + TCP) ==="
    if ! docker exec bastion-nginx wget -qO- --timeout=5 http://bastion-app:8000/api/health | grep -q '"status"'; then
      echo "DNS/TCP miss — reconnect bastion-app alias on ${net}"
      docker network disconnect -f "$net" "$app_cid" || true
      docker network connect --alias bastion-app --alias bastion-bastion-app-1 "$net" "$app_cid"
      sleep 2
      docker exec bastion-nginx wget -qO- --timeout=5 http://bastion-app:8000/api/health | grep -q '"status"'
    fi
    echo "direct app health OK"

    echo "=== nginx -t / listeners ==="
    docker exec bastion-nginx nginx -t
    docker exec bastion-nginx sh -c 'wget -qO- http://127.0.0.1:8080/_portal_nginx_ok || { echo "FAIL _portal_nginx_ok"; wget -SO- http://127.0.0.1:8080/_portal_nginx_ok; exit 1; }'
    echo
    echo "=== /api/health via nginx proxy ==="
    body="$(docker exec bastion-nginx wget -qO- http://127.0.0.1:8080/api/health)"
    echo "$body"
    echo "$body" | grep -q '"status"'
  args:
    executable: /bin/bash
  register: _nginx_listen_check
  retries: 15
  delay: 3
  until: _nginx_listen_check.rc | default(1) == 0
  changed_when: "'DNS/TCP miss' in (_nginx_listen_check.stdout | default(''))"
  failed_when: false

- name: "Fail with nginx proxy diagnostics"
  ansible.builtin.fail:
