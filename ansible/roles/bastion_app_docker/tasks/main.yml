---
# Deploy bastion Docker stack
#
# hub (default)  → deploy_hub.yml   : deploy/ + compose pull/up
# source         → deploy_source.yml: tar + build (legacy)
#
# Discovery / Traefik catch-all smoke is NOT part of deploy — use --tags smoke
# or include traefik_catchall.yml explicitly.

- name: "Deploy via Docker Hub (compose)"
  ansible.builtin.include_tasks: deploy_hub.yml
  when: (bastion_deploy_mode | default('hub')) == 'hub'

- name: "Deploy from source (build)"
  ansible.builtin.include_tasks: deploy_source.yml
  when: (bastion_deploy_mode | default('hub')) == 'source'
