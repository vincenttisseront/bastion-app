      exit 1
    fi
    docker exec bastion-nginx grep -q 'X-Original-Host \$bastion_auth_host' \
      /etc/nginx/snippets/subdomain_auth_common.conf \
      || { echo "live snippet missing X-Original-Host \$bastion_auth_host — rebuild nginx image"; exit 1; }
    docker exec bastion-nginx grep -q 'map \$bastion_vhost_fqdn \$bastion_auth_host' \
      /etc/nginx/includes/nginx-subdomain-auth.map.conf \
      || { echo "live map missing \$bastion_auth_host — rebuild nginx image"; exit 1; }
    docker exec bastion-nginx grep -q 'map \$bastion_pass_cookie \$bastion_session_from_jar' \
      /etc/nginx/includes/nginx-subdomain-auth.map.conf \
      || { echo "live map missing session_from_jar from pass_cookie — rebuild nginx image"; exit 1; }
    docker exec bastion-nginx grep -q 'map \$http_cookie \$bastion_fresh_session' \
      /etc/nginx/includes/nginx-subdomain-auth.map.conf \
      || { echo "live map missing \$bastion_fresh_session — rebuild nginx image"; exit 1; }
    if docker exec bastion-nginx grep -q 'map \$bastion_fresh_session \$bastion_pick_session' \
      /etc/nginx/includes/nginx-subdomain-auth.map.conf; then
      echo "live map still has \$bastion_pick_session (cycle → 500) — rebuild nginx image"
      exit 1
    fi
    if docker exec bastion-nginx grep -q 'map \$bastion_fresh_session \$bastion_pick_cookie' \
      /etc/nginx/includes/nginx-subdomain-auth.map.conf; then
      echo "live map still has \$bastion_pick_cookie (cycle → 500) — rebuild nginx image"
      exit 1
    fi
    if docker exec bastion-nginx grep -q 'map \$bastion_pass_cookie \$bastion_auth_cookie' \
      /etc/nginx/includes/nginx-subdomain-auth.map.conf; then
      echo "live map still maps \$bastion_auth_cookie (must be set in location /) — rebuild nginx image"
      exit 1
    fi
    if docker exec bastion-nginx grep -qE \
      '""[[:space:]]+\$http_cookie;|""[[:space:]]+\$cookie_bastion_session;' \
      /etc/nginx/includes/nginx-subdomain-auth.map.conf; then
      echo "live map still falls back to filtered \$http_cookie — rebuild nginx image"
      exit 1
    fi
    echo "snippet OK"
    if [[ ! -f "$CONF_HOST" ]]; then
      echo "no host export yet — skip export contract"
      exit 0
    fi
    if ! grep -q 'auth_request /internal/subdomain-auth' "$CONF_HOST"; then
      echo "no subdomain_proxy apps in export — skip export contract"
      exit 0
    fi
    echo "=== exports/nginx-subdomain-apps.conf ==="
    grep -q 'bastion_sub=1' "$CONF_HOST" \
      || { echo "export missing bastion_sub=1 loop breaker — rebuild bastion-app + re-apply"; exit 1; }
    grep -q 'ae=\$bastion_auth_err' "$CONF_HOST" \
      || { echo "export missing ae=\$bastion_auth_err diag — rebuild bastion-app + re-apply"; exit 1; }
    grep -q 'auth_request_set \$bastion_auth_err' "$CONF_HOST" \
      || { echo "export missing auth_request_set \$bastion_auth_err — rebuild bastion-app + re-apply"; exit 1; }
    grep -q 'set \$bastion_vhost_fqdn "' "$CONF_HOST" \
      || { echo "export missing set \$bastion_vhost_fqdn literal — rebuild bastion-app + re-apply"; exit 1; }
    grep -q 'set \$bastion_pass_session \$cookie_bastion_session;' "$CONF_HOST" \
      || { echo "export missing Cookie snapshot (\$cookie_bastion_session) — rebuild bastion-app + re-apply"; exit 1; }
    grep -q 'set \$bastion_pass_cookie \$http_cookie;' "$CONF_HOST" \
      || { echo "export missing Cookie jar snapshot — rebuild bastion-app + re-apply"; exit 1; }
    grep -q 'auth_request /internal/subdomain-auth' "$CONF_HOST" \
      || { echo "export missing auth_request in subdomain conf — rebuild bastion-app + re-apply"; exit 1; }
    if grep -q 'error_page 418 = @bastion_auth_gate_' "$CONF_HOST"; then
      echo "export still has 418 auth gate (nested error_page → bare 401) — rebuild bastion-app + re-apply"
      exit 1
    fi
    if grep -q 'if (\$bastion_fresh_session' "$CONF_HOST"; then
      echo "export still has sticky if{} (ifisevil → 404 new-ui) — rebuild bastion-app + re-apply"
      exit 1
    fi
    if grep -q 'set \$bastion_pass_session \$bastion_pick_session;' "$CONF_HOST"; then
      echo "export still has map-pick session (cycle → 500) — rebuild bastion-app + re-apply"
      exit 1
    fi
    grep -q 'set \$bastion_auth_cookie "bastion_session=\$bastion_pass_session; \$bastion_pass_cookie";' "$CONF_HOST" \
      || { echo "export missing auth Cookie rebuild (bastion_session= + pass jar) — rebuild bastion-app + re-apply"; exit 1; }
    if grep -q 'CrushAuth=\$cookie_CrushAuth' "$CONF_HOST"; then
      grep -q 'try_files /nonexistent @app_upstream_' "$CONF_HOST" \
        || { echo "CrushFTP export missing @app_upstream_ handoff — rebuild bastion-app + re-apply"; exit 1; }
      grep -q 'location @app_upstream_' "$CONF_HOST" \
        || { echo "CrushFTP export missing named upstream location — rebuild bastion-app + re-apply"; exit 1; }
      if grep -q 'bastion_session=\$cookie_bastion_session' "$CONF_HOST"; then
        echo "CrushFTP export must NOT forward bastion_session upstream (502 / IP login) — rebuild bastion-app + re-apply"
        exit 1
      fi
      grep -q 'proxy_redirect http://' "$CONF_HOST" \
        || { echo "CrushFTP export missing proxy_redirect for Absolute IP Location — rebuild bastion-app + re-apply"; exit 1; }
      if awk '/server_name[[:space:]]+transfer\./,/location \/ \{/' "$CONF_HOST" \
           | grep -q 'set \$bastion_pass_cookie'; then
        echo "CrushFTP export has server-level Cookie capture (auth rewrite wipe → ck=72) — rebuild bastion-app + re-apply"
        exit 1
      fi
      echo "=== CrushFTP Transfer server block (host export) ==="
      awk '/server_name[[:space:]]+transfer\./,/^}/' "$CONF_HOST" | head -n 120 || true
    fi
    if grep -q 'set \$bastion_auth_cookie \$http_cookie;' "$CONF_HOST"; then
      echo "export still has legacy bastion_auth_cookie=\$http_cookie — rebuild bastion-app + re-apply"
      exit 1
    fi
    echo "host export OK"
    echo "=== live bastion-nginx conf.d copy ==="
    docker exec bastion-nginx test -f "$CONF_NGX"
    docker exec bastion-nginx grep -q 'bastion_sub=1' "$CONF_NGX" \
      || { echo "live nginx conf missing bastion_sub=1 — sync-exports/reload failed"; exit 1; }
    docker exec bastion-nginx grep -q 'auth_request_set \$bastion_auth_err' "$CONF_NGX" \
      || { echo "live nginx conf missing auth_err diag — sync-exports/reload failed"; exit 1; }
    docker exec bastion-nginx grep -q 'set \$bastion_vhost_fqdn "' "$CONF_NGX" \
      || { echo "live nginx conf missing \$bastion_vhost_fqdn literal — sync-exports/reload failed"; exit 1; }
    docker exec bastion-nginx grep -q 'set \$bastion_pass_session \$cookie_bastion_session;' "$CONF_NGX" \
      || { echo "live nginx conf missing Cookie snapshot — sync-exports/reload failed"; exit 1; }
    if docker exec bastion-nginx grep -q 'error_page 418 = @bastion_auth_gate_' "$CONF_NGX"; then
      echo "live nginx conf still has 418 auth gate (bare 401) — re-apply + reload"
      exit 1
    fi
    if docker exec bastion-nginx grep -q 'if (\$bastion_fresh_session' "$CONF_NGX"; then
      echo "live nginx conf still has sticky if{} (ifisevil → 404) — re-apply + reload"
      exit 1
    fi
    if docker exec bastion-nginx grep -q 'set \$bastion_pass_session \$bastion_pick_session;' "$CONF_NGX"; then
      echo "live nginx conf still has map-pick session (cycle → 500) — re-apply + reload"
      exit 1
    fi
    docker exec bastion-nginx grep -q \
      'set \$bastion_auth_cookie "bastion_session=\$bastion_pass_session; \$bastion_pass_cookie";' \
      "$CONF_NGX" \
      || { echo "live nginx conf missing auth Cookie rebuild — sync-exports/reload failed"; exit 1; }
    if docker exec bastion-nginx grep -q 'CrushAuth=\$cookie_CrushAuth' "$CONF_NGX"; then
      docker exec bastion-nginx grep -q 'try_files /nonexistent @app_upstream_' "$CONF_NGX" \
        || { echo "live CrushFTP conf missing @app_upstream_ handoff — re-apply + reload"; exit 1; }
      if docker exec bastion-nginx grep -q 'bastion_session=\$cookie_bastion_session' "$CONF_NGX"; then
        echo "live CrushFTP conf must NOT forward bastion_session upstream — re-apply + reload"
        exit 1
      fi
      docker exec bastion-nginx grep -q 'proxy_redirect http://' "$CONF_NGX" \
        || { echo "live CrushFTP conf missing proxy_redirect — re-apply + reload"; exit 1; }
      if docker exec bastion-nginx sh -c \
           "awk '/server_name[[:space:]]+transfer\./,/location \/ \{/' '$CONF_NGX' | grep -q 'set \\\$bastion_pass_cookie'"; then
        echo "live CrushFTP conf has server-level Cookie capture (auth wipe → ck=72) — re-apply + reload"
        exit 1
      fi
      echo "=== CrushFTP Transfer server block (live nginx) ==="
      docker exec bastion-nginx sh -c "awk '/server_name[[:space:]]+transfer\./,/^}/' '$CONF_NGX' | head -n 120" || true
    fi
    echo "subdomain auth Transfer contract OK"
  args:
    executable: /bin/bash
  register: _subdomain_auth_verify
  changed_when: false

# Traefik catch-all → bastion-nginx (unknown Host → Domaines découverts)
- name: "Install Traefik catch-all for Host discovery"
  ansible.builtin.import_tasks: traefik_catchall.yml
  tags:
    - traefik
    - discovery
