---
# Deploy bastion Docker stack (Phase 7)

- name: "Ensure compose and data directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  loop:
    - "{{ bastion_app_docker_compose_dir }}"
    - "{{ bastion_app_docker_data_dir }}"
    - "{{ sso_portal_exports_dir }}"
    - "{{ bastion_app_docker_compose_dir }}/docker/oauth2-core"

# synchronize/rsync hangs on AWX EE (SSH password) — tar + copy + unarchive (Phase 6 pattern).
- name: "Stage bastion Docker tarball on controller"
  ansible.builtin.shell: |
    set -euo pipefail
    stamp="{{ bastion_app_git_ref | default('phase7') | regex_replace('[^A-Za-z0-9._-]', '_') }}"
    work="{{ playbook_dir }}/.cache/bastion-docker-${stamp}"
    rm -rf "${work}" "${work}.tar.gz"
    mkdir -p "${work}"
    root="{{ bastion_app_root }}"
    for d in app migrations scripts docker nginx; do
      if [ -d "${root}/${d}" ]; then
        cp -a "${root}/${d}" "${work}/"
      fi
    done
    for f in Dockerfile docker-compose.yml docker-compose.publish.yml pyproject.toml alembic.ini README.md; do
      if [ -f "${root}/${f}" ]; then
        cp -a "${root}/${f}" "${work}/"
      fi
    done
    # Ne jamais embarquer secrets / data / caches
    rm -rf "${work}/.git" "${work}/.venv" "${work}/node_modules" "${work}/data" \
      "${work}/docker/oauth2-core/oauth2-proxy.cfg" 2>/dev/null || true
    tar -C "${work}" -czf "${work}.tar.gz" .
    rm -rf "${work}"
    test -s "${work}.tar.gz"
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  run_once: true

- name: "Upload Docker tarball to docker01"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/.cache/bastion-docker-{{ bastion_app_git_ref | default('phase7') | regex_replace('[^A-Za-z0-9._-]', '_') }}.tar.gz"
    dest: "/tmp/bastion-docker-{{ bastion_app_git_ref | default('phase7') | regex_replace('[^A-Za-z0-9._-]', '_') }}.tar.gz"
    mode: "0644"

- name: "Extract Docker stack into /tools/portal"
  ansible.builtin.unarchive:
    src: "/tmp/bastion-docker-{{ bastion_app_git_ref | default('phase7') | regex_replace('[^A-Za-z0-9._-]', '_') }}.tar.gz"
    dest: "{{ bastion_app_docker_compose_dir }}"
    remote_src: true

- name: "Remove temporary Docker tarball on server"
  ansible.builtin.file:
    path: "/tmp/bastion-docker-{{ bastion_app_git_ref | default('phase7') | regex_replace('[^A-Za-z0-9._-]', '_') }}.tar.gz"
    state: absent

- name: "Render portal .env (no_log)"
  ansible.builtin.template:
    src: portal.env.j2
    dest: "{{ sso_portal_env_path }}"
    mode: "0600"
  no_log: true

- name: "Ensure oauth2-core cfg from example if missing"
  ansible.builtin.copy:
    src: "{{ bastion_app_docker_compose_dir }}/docker/oauth2-core/oauth2-proxy.cfg.example"
    dest: "{{ bastion_app_docker_compose_dir }}/docker/oauth2-core/oauth2-proxy.cfg"
    remote_src: true
    mode: "0640"
    force: false

- name: "Ensure empty oauth2-core env file"
  ansible.builtin.copy:
    content: "# oauth2-core env (optional)\n"
    dest: "{{ bastion_app_docker_compose_dir }}/.env.oauth2-core"
    mode: "0600"
    force: false

- name: "Ensure exports stub for nginx realms"
  ansible.builtin.copy:
    content: "# secondary realms — generated by apply-infra\n"
    dest: "{{ sso_portal_exports_dir }}/nginx-portal-realms.conf"
    mode: "0644"
    force: false

- name: "Make apply-infra-docker executable"
  ansible.builtin.file:
    path: "{{ bastion_app_docker_compose_dir }}/scripts/apply-infra-docker.sh"
    mode: "0755"

- name: "Inspect Traefik network vpcbr (CLI — no community.docker required)"
  ansible.builtin.command: docker network inspect {{ bastion_traefik_network }}
  register: _vpcbr
  changed_when: false
  failed_when: false

- name: "Fail if vpcbr missing (must be owned by Keycloak/Traefik stack)"
  ansible.builtin.fail:
    msg: >-
      Réseau Docker {{ bastion_traefik_network }} introuvable.
      Ne pas le créer à la main : il doit déjà exister avec Traefik (stack Keycloak sous /tools/keycloak),
      IPAM 10.5.0.0/16.
  when: _vpcbr.rc | default(1) != 0

- name: "PREFLIGHT : vpcbr subnet is 10.5.0.0/16"
  ansible.builtin.shell: |
    set -o pipefail
    docker network inspect {{ bastion_traefik_network }} \
      --format '{% raw %}{{range .IPAM.Config}}{{.Subnet}}{{end}}{% endraw %}'
  args:
    executable: /bin/bash
  register: _vpcbr_subnet
  changed_when: false
  failed_when: >-
    (_vpcbr_subnet.stdout | trim) != "10.5.0.0/16"

- name: "PREFLIGHT : Traefik container attached to vpcbr"
  ansible.builtin.shell: |
    set -o pipefail
    docker network inspect {{ bastion_traefik_network }} --format '{% raw %}{{json .Containers}}{% endraw %}' \
      | grep -qi traefik
  args:
    executable: /bin/bash
  register: _traefik_on_vpcbr
  changed_when: false
  failed_when: _traefik_on_vpcbr.rc != 0

- name: "Docker compose build"
  ansible.builtin.command:
    cmd: docker compose build --no-cache nginx bastion-app bastion-app-migrate
    chdir: "{{ bastion_app_docker_compose_dir }}"
  register: _compose_build
  changed_when: true

- name: "Docker compose up migrate + stack"
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans --force-recreate
    chdir: "{{ bastion_app_docker_compose_dir }}"
  environment:
    SSO_PORTAL_DATA_DIR: "{{ bastion_app_docker_data_dir }}"
    OAUTH2_PROXY_IMAGE_TAG: "{{ oauth2_proxy_image_tag }}"
    PORTAL_DOMAIN: "{{ portal_domain }}"
  register: _compose_up
  failed_when: false

- name: "Dump migrate logs on compose failure"
  ansible.builtin.command:
    cmd: docker compose logs --no-color bastion-app-migrate
    chdir: "{{ bastion_app_docker_compose_dir }}"
  register: _migrate_logs
  changed_when: false
  failed_when: false
  when: _compose_up.rc | default(0) != 0

- name: "Fail with migrate diagnostics"
  ansible.builtin.fail:
    msg: >-
      docker compose up failed (rc={{ _compose_up.rc }}).
      migrate logs:
      {{ _migrate_logs.stdout | default('') }}
      {{ _migrate_logs.stderr | default('') }}
      compose stderr:
      {{ _compose_up.stderr | default('') }}
  when: _compose_up.rc | default(0) != 0

- name: "Attach all bastion containers to vpcbr (10.5.0.0/16) and drop bastion_net"
  ansible.builtin.shell: |
    set -o pipefail
    net="{{ bastion_traefik_network }}"
    cd "{{ bastion_app_docker_compose_dir }}"
    mapfile -t cids < <(
      docker ps -q \
        --filter "label=com.docker.compose.project=bastion" \
        --filter "status=running" \
        | awk 'NF'
    )
    python3 - "$net" "${cids[@]}" <<'PY'
    import json, subprocess, sys
    net = sys.argv[1]
    cids = [c for c in sys.argv[2:] if c]
    if not cids:
        sys.stderr.write("no running bastion containers (label com.docker.compose.project=bastion)\n")
        sys.exit(1)

    def inspect(cid):
        return json.loads(subprocess.check_output(["docker", "inspect", cid], text=True))[0]

    def networks_of(cid):
        return (inspect(cid).get("NetworkSettings", {}) or {}).get("Networks") or {}

    def ip_on(cid, n):
        return ((networks_of(cid).get(n) or {}).get("IPAddress") or "").strip()

    report = []
    for cid in cids:
        name = inspect(cid).get("Name", cid).lstrip("/")
        # Drop project bridge leftovers (bastion_bastion_net / bastion_default)
        for n in list(networks_of(cid)):
            if n != net and (
                n.startswith("bastion_")
                or n.endswith("_bastion_net")
                or n == "bastion_net"
            ):
                subprocess.call(["docker", "network", "disconnect", "-f", n, cid])
        if not ip_on(cid, net):
            subprocess.call(["docker", "network", "disconnect", "-f", net, cid])
            subprocess.check_call(["docker", "network", "connect", net, cid])
        ip = ip_on(cid, net)
        if not ip.startswith("10.5."):
            sys.stderr.write("%s: expected 10.5.0.0/16 on %s, got %r nets=%s\n" % (
                name, net, ip, sorted(networks_of(cid))))
            sys.exit(1)
        report.append("%s=%s" % (name, ip))
    print(" ".join(report))
    PY
  args:
    executable: /bin/bash
  register: _vpcbr_attach
  retries: 5
  delay: 3
  until: _vpcbr_attach.rc | default(1) == 0
  changed_when: true

- name: "Restart bastion stack after vpcbr attach"
  ansible.builtin.command:
    cmd: docker compose restart bastion-app oauth2-proxy-core nginx
    chdir: "{{ bastion_app_docker_compose_dir }}"
  register: _stack_restart
  changed_when: true

- name: "Wait for bastion-app healthy"
  ansible.builtin.uri:
    url: "http://127.0.0.1:8000/api/health"
    status_code: 200
  register: _wait_health
  retries: 30
  delay: 2
  until: _wait_health.status | default(0) == 200

- name: "Assert nginx /api/health on loopback inside container"
  ansible.builtin.shell: |
    set -o pipefail
    docker exec bastion-nginx wget -qO- http://127.0.0.1:8080/api/health | grep -q '"status"'
  args:
    executable: /bin/bash
  register: _nginx_listen_check
  retries: 20
  delay: 2
  until: _nginx_listen_check.rc | default(1) == 0
  changed_when: false

- name: "Run apply-infra-docker (secondary realms)"
  ansible.builtin.command:
    cmd: >-
      bash {{ bastion_app_docker_compose_dir }}/scripts/apply-infra-docker.sh
      {{ sso_portal_exports_dir }}
      {{ bastion_app_docker_compose_dir }}
  environment:
    OAUTH2_PROXY_IMAGE_TAG: "{{ oauth2_proxy_image_tag }}"
    SSO_PORTAL_DEFAULT_REALM_SLUG: "{{ sso_portal_default_realm_slug }}"
    PORTAL_DOMAIN: "{{ portal_domain }}"
    SSO_PORTAL_DATA_DIR: "{{ bastion_app_docker_data_dir }}"
  register: _apply_docker
  failed_when: false
  changed_when: _apply_docker.rc == 0

- name: "Warn if apply-infra-docker failed"
  ansible.builtin.debug:
    msg: "apply-infra-docker rc={{ _apply_docker.rc }} — {{ _apply_docker.stderr | default(_apply_docker.stdout) }}"
  when: _apply_docker.rc | default(0) != 0
