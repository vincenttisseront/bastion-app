# Host discovery smoke — Traefik catch-all (legacy) OR nginx edge :443/:8080.
#
# When bastion_require_traefik / bastion_traefik_catchall_deploy are false
# (nginx publishes 80/443), skip Traefik probes and validate discovery on nginx.

- name: "Stat Keycloak Traefik config directory"
  ansible.builtin.stat:
    path: "{{ bastion_traefik_config_dir }}"
  register: _traefik_cfg_dir

- name: "Deploy Traefik bastion catch-all (file provider)"
  when:
    - bastion_traefik_catchall_deploy | default(false) | bool
    - _traefik_cfg_dir.stat.exists | default(false)
  ansible.builtin.copy:
    src: bastion-catchall.yml
    dest: "{{ bastion_traefik_config_dir }}/bastion-catchall.yml"
    mode: "0644"
  register: _traefik_catchall_file

- name: "Wait for Traefik file provider to reload catch-all"
  when:
    - bastion_traefik_catchall_deploy | default(false) | bool
    - _traefik_catchall_file is changed
  ansible.builtin.command: sleep 3
  changed_when: false

- name: "Warn when Traefik config dir missing (catch-all not installed)"
  when:
    - bastion_traefik_catchall_deploy | default(false) | bool
    - not (_traefik_cfg_dir.stat.exists | default(false))
  ansible.builtin.debug:
    msg: >-
      {{ bastion_traefik_config_dir }} introuvable — catch-all Traefik file non déployé.

- name: "SMOKE : Traefik catch-all routes unknown Host to bastion-nginx"
  when: bastion_traefik_catchall_deploy | default(false) | bool
  ansible.builtin.shell: |
    set -euo pipefail
    epoch=$(date +%s)
    host="discovery-probe-${epoch}.{{ base_domain | default('ar-systems.fr') }}"
    body=/tmp/bastion_discovery_body.html
    hdrs=/tmp/bastion_discovery_hdrs.txt
    rm -f "$body" "$hdrs"

    probe() {
      local url="$1"
      curl -sk -D "$hdrs" -o "$body" -w '%{http_code}' \
        --connect-timeout 5 --max-time 15 \
        -H "Host: ${host}" \
        "$url" || echo "000"
    }

    code=$(probe "https://127.0.0.1/probe-discovery")
    if [[ "$code" == "000" || "$code" == "404" ]]; then
      tip=$(docker inspect -f '{% raw %}{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}{% endraw %}' traefik 2>/dev/null | awk '{print $1}')
      if [[ -n "${tip:-}" ]]; then
        code2=$(probe "https://${tip}/probe-discovery")
        echo "fallback_traefik_ip=${tip} http=${code2}"
        code=$code2
      fi
    fi
    if [[ "$code" != "403" && "$code" != "503" ]]; then
      nip=$(docker inspect -f '{% raw %}{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}{% endraw %}' bastion-nginx 2>/dev/null | awk '{print $1}')
      if [[ -n "${nip:-}" ]]; then
        code3=$(curl -s -D "$hdrs" -o "$body" -w '%{http_code}' \
          --connect-timeout 5 --max-time 10 \
          -H "Host: ${host}" \
          "http://${nip}:8080/probe-discovery" || echo "000")
        echo "direct_nginx_ip=${nip} http=${code3}"
        if [[ "$code3" == "403" || "$code3" == "503" ]]; then
          echo "FAIL: bastion-nginx discovery OK but Traefik still returns ${code} — catch-all missing/miswired"
          head -c 300 "$body" 2>/dev/null || true
          echo
          exit 1
        fi
      fi
    fi

    echo "discovery_probe host=${host} http=${code}"
    if [[ "$code" == "403" ]] && grep -qiE 'Forbidden|403' "$body" 2>/dev/null; then
      echo "OK: unknown Host reached bastion-nginx neutral 403 stub"
      exit 0
    fi
    if [[ "$code" == "403" ]]; then
      echo "OK: HTTP 403 (discovery stub)"
      exit 0
    fi
    # Legacy pre-403 stub (still counts as discovery path healthy).
    if [[ "$code" == "503" ]]; then
      echo "OK: HTTP 503 (legacy discovery stub)"
      exit 0
    fi
    echo "FAIL: expected HTTP 403 from bastion discovery, got ${code}"
    exit 1
  args:
    executable: /bin/bash
  register: _discovery_smoke
  changed_when: false
  failed_when: false
  retries: 3
  delay: 3
  until: _discovery_smoke.rc | default(1) == 0

- name: "SMOKE : nginx edge discovery (no Traefik)"
  when: not (bastion_traefik_catchall_deploy | default(false) | bool)
  ansible.builtin.shell: |
    set -euo pipefail
    epoch=$(date +%s)
    host="discovery-probe-${epoch}.{{ base_domain | default('ar-systems.fr') }}"
    body=/tmp/bastion_discovery_body.html
    hdrs=/tmp/bastion_discovery_hdrs.txt
    rm -f "$body" "$hdrs"

    # Prefer published HTTPS edge, then loopback :8080, then container IP :8080
    code=$(curl -sk -D "$hdrs" -o "$body" -w '%{http_code}' \
      --connect-timeout 5 --max-time 15 \
      -H "Host: ${host}" \
      "https://127.0.0.1/probe-discovery" || echo "000")
    echo "edge_https http=${code}"

    if [[ "$code" != "403" && "$code" != "503" ]]; then
      code=$(curl -s -D "$hdrs" -o "$body" -w '%{http_code}' \
        --connect-timeout 5 --max-time 10 \
        -H "Host: ${host}" \
        "http://127.0.0.1:8080/probe-discovery" || echo "000")
      echo "loopback_8080 http=${code}"
    fi

    if [[ "$code" != "403" && "$code" != "503" ]]; then
      nip=$(docker inspect -f '{% raw %}{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}{% endraw %}' bastion-nginx 2>/dev/null | awk '{print $1}')
      if [[ -n "${nip:-}" ]]; then
        code=$(curl -s -D "$hdrs" -o "$body" -w '%{http_code}' \
          --connect-timeout 5 --max-time 10 \
          -H "Host: ${host}" \
          "http://${nip}:8080/probe-discovery" || echo "000")
        echo "direct_nginx_ip=${nip} http=${code}"
      fi
    fi

    echo "discovery_probe host=${host} http=${code}"
    if [[ "$code" == "403" ]] && grep -qiE 'Forbidden|403' "$body" 2>/dev/null; then
      echo "OK: unknown Host reached bastion-nginx neutral 403 stub"
      exit 0
    fi
    if [[ "$code" == "403" || "$code" == "503" ]]; then
      echo "OK: HTTP ${code} (discovery stub via nginx edge)"
      exit 0
    fi
    echo "FAIL: expected HTTP 403 from nginx discovery, got ${code}"
    head -c 400 "$body" 2>/dev/null || true
    exit 1
  args:
    executable: /bin/bash
  register: _discovery_smoke_nginx
  changed_when: false
  failed_when: false
  retries: 3
  delay: 3
  until: _discovery_smoke_nginx.rc | default(1) == 0

- name: "Show discovery smoke result"
  when: >
    (_discovery_smoke is defined and not (_discovery_smoke is skipped))
    or (_discovery_smoke_nginx is defined and not (_discovery_smoke_nginx is skipped))
  ansible.builtin.debug:
    msg: >-
      {{ _discovery_smoke.stdout_lines | default([])
         if (_discovery_smoke is defined and not (_discovery_smoke is skipped))
         else (_discovery_smoke_nginx.stdout_lines | default([])) }}

- name: "Fail when Traefik catch-all discovery smoke failed"
  when:
    - bastion_traefik_catchall_deploy | default(false) | bool
    - _discovery_smoke is defined
    - not (_discovery_smoke is skipped)
    - _discovery_smoke.rc | default(1) != 0
  ansible.builtin.fail:
    msg: >-
      Découverte Host KO (Traefik ne route pas vers bastion-nginx).
      {{ _discovery_smoke.stdout | default('') }}
      Correctifs : déployer {{ bastion_traefik_config_dir }}/bastion-catchall.yml ;
      vérifier réseau vpcbr (alias bastion-nginx).

- name: "Fail when nginx edge discovery smoke failed"
  when:
    - not (bastion_traefik_catchall_deploy | default(false) | bool)
    - _discovery_smoke_nginx is defined
    - not (_discovery_smoke_nginx is skipped)
    - _discovery_smoke_nginx.rc | default(1) != 0
  ansible.builtin.fail:
    msg: >-
      Découverte Host KO (nginx edge 80/443 / :8080).
      {{ _discovery_smoke_nginx.stdout | default('') }}
      Vérifier bastion-nginx running, known-hosts map, et publish 80/443.
