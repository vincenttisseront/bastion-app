---
# AWX wrapper around deploy/ — same steps as deploy/README.md
#
#   1. copy deploy/ → compose dir
#   2. write .env from Vault
#   3. docker network vpcbr (if missing)
#   4. docker login + compose pull + up -d
#   5. health check
#
# Optional site glue (Admin → Apply on the host): systemd path watcher.
# Not required for a manual `docker compose` install.

- name: "compose : ensure host directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  loop:
    - "{{ bastion_app_docker_compose_dir }}"
    - "{{ bastion_app_docker_data_dir }}"
    - "{{ bastion_app_docker_files_data_dir }}"
    - "{{ sso_portal_files_storage_dir }}"
    - "{{ sso_portal_exports_dir }}"
    - "{{ bastion_app_docker_data_dir }}/certs"
    - "{{ bastion_app_docker_data_dir }}/acme"
    - "{{ sso_portal_nginx_logs_dir }}"

- name: "compose : assert deploy/ pack on AWX controller"
  ansible.builtin.stat:
    path: "{{ bastion_app_root }}/deploy/docker-compose.yml"
  register: _deploy_pack
  delegate_to: localhost
  become: false
  run_once: true

- name: "compose : fail if deploy/ missing"
  ansible.builtin.assert:
    that:
      - _deploy_pack.stat.exists | default(false)
    fail_msg: >-
      Pack deploy/ introuvable sous bastion_app_root={{ bastion_app_root }}.
      AWX Project = bastion-app (playbook_dir/..).
  run_once: true

# Full pack (compose, docker/, scripts/, examples) — identical to a manual scp of deploy/
- name: "compose : sync deploy/ pack to host"
  ansible.builtin.copy:
    src: "{{ bastion_app_root }}/deploy/"
    dest: "{{ bastion_app_docker_compose_dir }}/"
    mode: preserve

- name: "compose : make deploy/scripts executable"
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0755"
  loop:
    - "{{ bastion_app_docker_compose_dir }}/scripts/apply-infra-docker.sh"
    - "{{ bastion_app_docker_compose_dir }}/scripts/apply-infra-docker-dispatch.sh"
    - "{{ bastion_app_docker_compose_dir }}/scripts/oauth2-cookie-secret.sh"

- name: "compose : write .env from Vault (portal.env.j2)"
  ansible.builtin.template:
    src: portal.env.j2
    dest: "{{ sso_portal_env_path }}"
    mode: "0600"
  no_log: true

- name: "compose : ensure oauth2-core cfg from example if missing"
  ansible.builtin.copy:
    src: "{{ bastion_app_docker_compose_dir }}/docker/oauth2-core/oauth2-proxy.cfg.example"
    dest: "{{ bastion_app_docker_compose_dir }}/docker/oauth2-core/oauth2-proxy.cfg"
    remote_src: true
    mode: "0644"
    force: false

- name: "compose : ensure oauth2 PKCE"
  ansible.builtin.lineinfile:
    path: "{{ bastion_app_docker_compose_dir }}/docker/oauth2-core/oauth2-proxy.cfg"
    regexp: '^\s*code_challenge_method\s*='
    line: 'code_challenge_method = "S256"'
    insertafter: '^\s*cookie_secret\s*='
    mode: "0644"

- name: "compose : ensure oauth2 cookie_secret"
  ansible.builtin.command:
    cmd: >-
      bash {{ bastion_app_docker_compose_dir }}/scripts/oauth2-cookie-secret.sh
      ensure-cfg
      {{ bastion_app_docker_compose_dir }}/docker/oauth2-core/oauth2-proxy.cfg
  register: _oauth2_cookie
  changed_when: "'regenerated' in (_oauth2_cookie.stdout | default(''))"

- name: "compose : ensure .env.oauth2-core / .env.acme stubs"
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ item.dest }}"
    mode: "0600"
    force: false
  loop:
    - dest: "{{ bastion_app_docker_compose_dir }}/.env.oauth2-core"
      content: "# oauth2-core env (optional)\n"
    - dest: "{{ bastion_app_docker_compose_dir }}/.env.acme"
      content: "# Cloudflare DNS-01 — see .env.acme.example\n"

- name: "compose : nginx export stubs (first boot before Admin Apply)"
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ item.dest }}"
    mode: "0644"
    force: "{{ item.force | default(false) }}"
  loop:
    - dest: "{{ sso_portal_exports_dir }}/nginx-portal-realms.conf"
      content: "# secondary realms — generated by apply-infra\n"
      force: false
    - dest: "{{ sso_portal_exports_dir }}/nginx-known-hosts.map"
      content: |
        127.0.0.1 0;
        localhost 0;
        {{ portal_domain }} 0;
      force: true

- name: "compose : optional infra proxy exports (Keycloak / …)"
  when: (bastion_infra_proxy_vhosts | default([]) | length) > 0
  block:
    - name: "compose : render nginx-infra-proxy-apps.conf"
      ansible.builtin.template:
        src: nginx-infra-proxy-apps.conf.j2
        dest: "{{ sso_portal_exports_dir }}/nginx-infra-proxy-apps.conf"
        mode: "0644"

    - name: "compose : infra ACME domains JSON"
      ansible.builtin.copy:
        dest: "{{ sso_portal_exports_dir }}/infra-acme-domains.json"
        mode: "0644"
        content: "{{ _infra_acme | to_nice_json }}\n"
      vars:
        _infra_acme: >-
          {{
            bastion_infra_proxy_vhosts
            | rejectattr('enabled', 'equalto', false)
            | map('combine', {'family': 'infra'})
            | list
          }}

# Host watcher so Admin → Apply can touch apply-infra.request (same as bare-metal ops).
- name: "compose : install apply-infra systemd watcher"
  when: bastion_hub_install_host_watcher | default(true) | bool
  block:
    - name: "compose : touch apply-infra.request"
      ansible.builtin.file:
        path: "{{ bastion_app_docker_data_dir }}/apply-infra.request"
        state: touch
        mode: "0644"
        modification_time: preserve
        access_time: preserve

    - name: "compose : systemd units"
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "/etc/systemd/system/{{ item.dest }}"
        mode: "0644"
      loop:
        - src: bastion-apply-infra.service.j2
          dest: bastion-apply-infra.service
        - src: bastion-apply-infra.path.j2
          dest: bastion-apply-infra.path

    - name: "compose : enable path watcher"
      ansible.builtin.systemd:
        name: bastion-apply-infra.path
        enabled: true
        state: started
        daemon_reload: true

- name: "compose : ensure vpcbr (10.5.0.0/16)"
  ansible.builtin.shell: |
    set -euo pipefail
    if docker network inspect {{ bastion_traefik_network }} >/dev/null 2>&1; then
      subnet=$(docker network inspect {{ bastion_traefik_network }} \
        --format '{% raw %}{{range .IPAM.Config}}{{.Subnet}}{{end}}{% endraw %}')
      test "$subnet" = "10.5.0.0/16"
      echo "vpcbr exists ($subnet)"
      exit 0
    fi
    docker network create --subnet=10.5.0.0/16 {{ bastion_traefik_network }}
    echo "vpcbr created"
  args:
    executable: /bin/bash
  register: _vpcbr
  changed_when: "'created' in (_vpcbr.stdout | default(''))"

- name: "compose : Docker Hub login"
  ansible.builtin.shell: |
    set -euo pipefail
    printf '%s' "{{ vault_dockerhub_token }}" | docker login \
      --username "{{ vault_dockerhub_username }}" \
      --password-stdin
  args:
    executable: /bin/bash
  no_log: true
  when:
    - bastion_hub_login | default(true) | bool
    - (vault_dockerhub_token | default('') | length) > 0
    - (vault_dockerhub_username | default('') | length) > 0
  changed_when: true

- name: "compose : pull && up -d"
  ansible.builtin.shell: |
    set -euo pipefail
    docker compose pull bastion-app bastion-app-migrate nginx
    docker compose up -d --remove-orphans
  args:
    executable: /bin/bash
    chdir: "{{ bastion_app_docker_compose_dir }}"
  environment:
    SSO_PORTAL_DATA_DIR: "{{ bastion_app_docker_data_dir }}"
    SSO_PORTAL_FILES_DATA_DIR: "{{ bastion_app_docker_files_data_dir }}"
    OAUTH2_PROXY_IMAGE_TAG: "{{ oauth2_proxy_image_tag }}"
    PORTAL_DOMAIN: "{{ portal_domain }}"
    BASTION_APP_IMAGE: "{{ bastion_app_image }}"
    BASTION_MIGRATE_IMAGE: "{{ bastion_migrate_image }}"
    BASTION_NGINX_IMAGE: "{{ bastion_nginx_image }}"
  register: _compose
  failed_when: false
  changed_when: true

- name: "compose : dump logs on failure"
  when: _compose.rc | default(0) != 0
  ansible.builtin.command:
    cmd: docker compose logs --no-color --tail=100 bastion-app-migrate bastion-app nginx
    chdir: "{{ bastion_app_docker_compose_dir }}"
  register: _compose_logs
  changed_when: false
  failed_when: false

- name: "compose : fail with diagnostics"
  ansible.builtin.fail:
    msg: |
      docker compose failed (rc={{ _compose.rc }}).
      {{ _compose.stderr | default('') }}
      --- logs ---
      {{ _compose_logs.stdout | default('') }}
  when: _compose.rc | default(0) != 0

- name: "compose : wait /api/health"
  ansible.builtin.command:
    cmd: >-
      docker compose exec -T bastion-app
      python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"
    chdir: "{{ bastion_app_docker_compose_dir }}"
  register: _health
  retries: 30
  delay: 3
  until: _health.rc | default(1) == 0
  changed_when: false

- name: "compose : done"
  ansible.builtin.debug:
    msg: >-
      Stack up — {{ bastion_app_image }} / {{ bastion_nginx_image }}.
      Suite : Admin → Setup / Realms → Apply (comme deploy/README.md).
