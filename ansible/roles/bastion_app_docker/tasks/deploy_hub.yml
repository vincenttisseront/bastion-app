---
# Optional AWX wrapper — same as: cd deploy && docker compose pull && up -d
# Images Hub are public: no docker login.

- name: "dirs"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  loop:
    - "{{ bastion_app_docker_compose_dir }}"
    - "{{ bastion_app_docker_data_dir }}"
    - "{{ bastion_app_docker_files_data_dir }}"
    - "{{ sso_portal_files_storage_dir }}"
    - "{{ sso_portal_exports_dir }}"
    - "{{ bastion_app_docker_data_dir }}/certs"
    - "{{ bastion_app_docker_data_dir }}/acme"
    - "{{ sso_portal_nginx_logs_dir }}"

- name: "sync deploy/ pack"
  ansible.builtin.copy:
    src: "{{ bastion_app_root }}/deploy/"
    dest: "{{ bastion_app_docker_compose_dir }}/"
    mode: preserve

- name: "scripts executable"
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0755"
  loop:
    - "{{ bastion_app_docker_compose_dir }}/scripts/apply-infra-docker.sh"
    - "{{ bastion_app_docker_compose_dir }}/scripts/apply-infra-docker-dispatch.sh"
    - "{{ bastion_app_docker_compose_dir }}/scripts/oauth2-cookie-secret.sh"
  failed_when: false

- name: "write .env (Vault → portal.env.j2)"
  ansible.builtin.template:
    src: portal.env.j2
    dest: "{{ sso_portal_env_path }}"
    mode: "0600"
  no_log: true

- name: "oauth2.cfg from example if missing"
  ansible.builtin.copy:
    src: "{{ bastion_app_docker_compose_dir }}/docker/oauth2-core/oauth2-proxy.cfg.example"
    dest: "{{ bastion_app_docker_compose_dir }}/docker/oauth2-core/oauth2-proxy.cfg"
    remote_src: true
    mode: "0644"
    force: false

- name: "oauth2 PKCE + cookie_secret"
  ansible.builtin.shell: |
    set -euo pipefail
    cfg="{{ bastion_app_docker_compose_dir }}/docker/oauth2-core/oauth2-proxy.cfg"
    grep -qE '^\s*code_challenge_method\s*=' "$cfg" || \
      printf '\ncode_challenge_method = "S256"\n' >> "$cfg"
    bash "{{ bastion_app_docker_compose_dir }}/scripts/oauth2-cookie-secret.sh" ensure-cfg "$cfg"
  args:
    executable: /bin/bash
  changed_when: false

- name: "stub env + nginx maps"
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode | default('0644') }}"
    force: "{{ item.force | default(false) }}"
  loop:
    - dest: "{{ bastion_app_docker_compose_dir }}/.env.oauth2-core"
      content: "# optional\n"
      mode: "0600"
    - dest: "{{ bastion_app_docker_compose_dir }}/.env.acme"
      content: "# see .env.acme.example\n"
      mode: "0600"
    - dest: "{{ sso_portal_exports_dir }}/nginx-portal-realms.conf"
      content: "# generated by Admin → Apply\n"
    - dest: "{{ sso_portal_exports_dir }}/nginx-known-hosts.map"
      content: |
        127.0.0.1 0;
        localhost 0;
        {{ portal_domain }} 0;
      force: true

- name: "vpcbr 10.5.0.0/16"
  ansible.builtin.shell: |
    set -euo pipefail
    net="{{ bastion_traefik_network }}"
    if docker network inspect "$net" >/dev/null 2>&1; then
      subnet=$(docker network inspect "$net" --format '{% raw %}{{range .IPAM.Config}}{{.Subnet}}{{end}}{% endraw %}')
      test "$subnet" = "10.5.0.0/16"
      echo "exists"
      exit 0
    fi
    docker network create --subnet=10.5.0.0/16 "$net"
    echo "created"
  args:
    executable: /bin/bash
  register: _vpcbr
  changed_when: "'created' in (_vpcbr.stdout | default(''))"

- name: "docker compose pull && up -d"
  ansible.builtin.shell: |
    set -euo pipefail
    docker compose pull
    docker compose up -d --remove-orphans
  args:
    executable: /bin/bash
    chdir: "{{ bastion_app_docker_compose_dir }}"
  environment:
    SSO_PORTAL_DATA_DIR: "{{ bastion_app_docker_data_dir }}"
    SSO_PORTAL_FILES_DATA_DIR: "{{ bastion_app_docker_files_data_dir }}"
    OAUTH2_PROXY_IMAGE_TAG: "{{ oauth2_proxy_image_tag }}"
    PORTAL_DOMAIN: "{{ portal_domain }}"
    BASTION_APP_IMAGE: "{{ bastion_app_image }}"
    BASTION_MIGRATE_IMAGE: "{{ bastion_migrate_image }}"
    BASTION_NGINX_IMAGE: "{{ bastion_nginx_image }}"
  register: _up
  changed_when: true

- name: "fail on compose error"
  ansible.builtin.fail:
    msg: "{{ _up.stderr | default(_up.stdout) }}"
  when: _up.rc | default(0) != 0

- name: "wait /api/health"
  ansible.builtin.command:
    cmd: >-
      docker compose exec -T bastion-app
      python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"
    chdir: "{{ bastion_app_docker_compose_dir }}"
  register: _health
  retries: 30
  delay: 3
  until: _health.rc | default(1) == 0
  changed_when: false
