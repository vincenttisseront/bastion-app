---
# Preflight Docker stack — fail-fast before mutation

- name: "PREFLIGHT : docker disponible"
  ansible.builtin.command: docker info
  register: _docker_ver
  changed_when: false
  failed_when: _docker_ver.rc != 0

- name: "PREFLIGHT : docker compose disponible"
  ansible.builtin.command: docker compose version
  register: _compose_ver
  changed_when: false
  failed_when: _compose_ver.rc != 0

- name: "PREFLIGHT : espace disque data dir"
  ansible.builtin.shell: |
    set -o pipefail
    target="{{ bastion_app_docker_data_dir | dirname }}"
    df -Pm "$target" 2>/dev/null | awk 'NR==2 {print $4, $5, $3}'
  args:
    executable: /bin/bash
  register: _disk_mb
  changed_when: false

- name: "PREFLIGHT : assert disque"
  ansible.builtin.assert:
    that:
      - (_disk_free_mb | int) >= (sso_portal_min_free_disk_mb | int)
    fail_msg: >-
      Espace disque insuffisant sur {{ bastion_app_docker_data_dir | dirname }} :
      {{ _disk_free_mb }} Mo libres ({{ _disk_use_pct }} utilisés, total {{ _disk_total_mb }} Mo),
      seuil requis {{ sso_portal_min_free_disk_mb }} Mo.
      Voir docs/ops-retention-donnees-froides-tools.md
  vars:
    _disk_parts: "{{ (_disk_mb.stdout | trim).split() }}"
    _disk_free_mb: "{{ _disk_parts[0] | default('0') }}"
    _disk_use_pct: "{{ _disk_parts[1] | default('?') }}"
    _disk_total_mb: "{{ _disk_parts[2] | default('?') }}"

- name: "PREFLIGHT : credentials dhi.io (Hardened Images)"
  ansible.builtin.assert:
    that:
      - (vault_dhi_registry_username | default('') | length) > 0
      - (vault_dhi_registry_token | default('') | length) > 0
    fail_msg: >-
      Pull dhi.io/python exige une auth (401 anonyme). Renseigner en AWX Vault /
      Extra Vars : vault_dhi_registry_username (Docker ID) et
      vault_dhi_registry_token (PAT Docker Hub lecture seule).
      Créer un PAT : https://hub.docker.com/settings/security
      Puis sur l'hôte : docker login dhi.io -u <id> --password-stdin
      Contournement temporaire : bastion_app_use_dhi=false (bases python:3.12-slim).
  when: bastion_app_use_dhi | default(true) | bool

- name: "PREFLIGHT : secrets non vides"
  ansible.builtin.assert:
    that:
      - vault_portal_internal_token | length > 0
      - (portal_secret_encryption_key | length > 0) or (vault_portal_vault_fernet_key | length > 0)
      - vault_portal_db_encryption_key | default('') | length == 64
    fail_msg: >-
      Secrets manquants : vault_portal_internal_token,
      portal_secret_encryption_key / vault_portal_vault_fernet_key, et
      vault_portal_db_encryption_key (64 hex chars, openssl rand -hex 32) requis.
      Les HMAC (session hop, breakglass JWT) sont initialisés en base
      (portal_settings) par le job migrate — pas via .env.

- name: "PREFLIGHT : stat pgdata (stockage chaud provisionné ?)"
  ansible.builtin.stat:
    path: "{{ bastion_app_docker_data_dir }}/pgdata"
  register: _pgdata_stat

- name: "PREFLIGHT : assert mot de passe hot-store"
  ansible.builtin.assert:
    that:
      - hot_store_pg_password_resolved | trim | length > 0
    fail_msg: >-
      Le stockage chaud est provisionné ({{ bastion_app_docker_data_dir }}/pgdata
      existe) mais aucun mot de passe n'est fourni. Sans lui, .env sort sans
      HOT_STORE_PG_PASSWORD, compose retombe sur bastion_hot_change_me pour le rôle
      postgres, et l'application se connecte avec la valeur enregistrée en base :
      l'authentification échoue. Renseigner vault_hot_store_pg_password (alias
      hot_store_pg_password ou HOT_STORE_PG_PASSWORD) en Extra Var / Vault AWX.
      Si le stockage chaud est abandonné, supprimer le répertoire pgdata.
  when: _pgdata_stat.stat.exists | default(false)

- name: "PREFLIGHT : stat portal.db"
  ansible.builtin.stat:
    path: "{{ sso_portal_db_path }}"
  register: _db_stat

- name: "PREFLIGHT : backup portal.db (si existe)"
  ansible.builtin.copy:
    src: "{{ sso_portal_db_path }}"
    dest: "{{ sso_portal_db_path }}.bak.{{ ansible_date_time.iso8601_basic_short }}"
    remote_src: true
    mode: "0600"
  when: _db_stat.stat.exists | default(false)

- name: "PREFLIGHT : purge anciennes sauvegardes portal.db"
  ansible.builtin.script: purge-portal-db-backups.py
  environment:
    DATA_DIR: "{{ bastion_app_docker_data_dir }}"
    KEEP_COUNT: "{{ sso_portal_db_backup_keep_count }}"
    DAILY_DAYS: "{{ sso_portal_db_backup_daily_days }}"
  register: _db_purge
  changed_when: "'removed=' in (_db_purge.stdout | default('')) and 'removed=0' not in (_db_purge.stdout | default(''))"
  failed_when: false

- ansible.builtin.import_tasks: host_log_retention.yml

- name: "PREFLIGHT : stat files data dir"
  ansible.builtin.stat:
    path: "{{ sso_portal_files_data_dir }}"
  register: _files_stat

- name: "PREFLIGHT : backup files data dir (tar) si présent"
  ansible.builtin.command:
    cmd: >-
      tar -czf
      {{ sso_portal_files_data_dir }}.bak.{{ ansible_date_time.iso8601_basic_short }}.tgz
      -C {{ sso_portal_files_data_dir | dirname }}
      {{ sso_portal_files_data_dir | basename }}
  when: _files_stat.stat.exists | default(false)

- name: "PREFLIGHT : chmod backup files tar"
  ansible.builtin.file:
    path: "{{ sso_portal_files_data_dir }}.bak.{{ ansible_date_time.iso8601_basic_short }}.tgz"
    mode: "0600"
  when: _files_stat.stat.exists | default(false)

- name: "PREFLIGHT : stat keys dir"
  ansible.builtin.stat:
    path: "{{ sso_portal_keys_dir }}"
  register: _keys_stat

- name: "PREFLIGHT : backup keys dir (tar) si présent"
  ansible.builtin.command:
    cmd: >-
      tar -czf
      {{ sso_portal_keys_dir }}.bak.{{ ansible_date_time.iso8601_basic_short }}.tgz
      -C {{ sso_portal_keys_dir | dirname }}
      {{ sso_portal_keys_dir | basename }}
  when: _keys_stat.stat.exists | default(false)

- name: "PREFLIGHT : chmod backup keys tar"
  ansible.builtin.file:
    path: "{{ sso_portal_keys_dir }}.bak.{{ ansible_date_time.iso8601_basic_short }}.tgz"
    mode: "0600"
  when: _keys_stat.stat.exists | default(false)
