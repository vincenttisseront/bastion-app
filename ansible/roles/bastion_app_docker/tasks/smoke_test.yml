---
# Smoke on docker01 : loopback app/oauth2 + Traefik (Host portal) comme Keycloak

- name: "SMOKE : GET /api/health (app bind loopback)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:8000/api/health"
    return_content: true
    status_code: 200
  register: _health
  retries: 15
  delay: 2
  until: _health.status | default(0) == 200

- name: "SMOKE : assert health phase"
  ansible.builtin.assert:
    that:
      - _health.json is defined
      - _health.json.status == 'ok'
      - _health.json.phase | string == (sso_portal_expected_health_phase | string)
    fail_msg: >-
      /api/health inattendu : {{ _health.content | default('n/a') }}.
      Attendu status=ok phase={{ sso_portal_expected_health_phase }}.

- name: "SMOKE : locate nginx container"
  ansible.builtin.shell: |
    set -o pipefail
    if docker inspect bastion-nginx >/dev/null 2>&1; then
      echo bastion-nginx
      exit 0
    fi
    cid="$(docker compose ps -q nginx 2>/dev/null | head -1)"
    if [[ -n "${cid}" ]]; then
      echo "${cid}"
      exit 0
    fi
    exit 1
  args:
    executable: /bin/bash
    chdir: "{{ bastion_app_docker_compose_dir }}"
  register: _nginx_cid
  changed_when: false
  failed_when: false

- name: "SMOKE : diagnose missing nginx container"
  when: _nginx_cid.rc | default(1) != 0 or (_nginx_cid.stdout | trim | length) == 0
  block:
    - name: "compose ps -a"
      ansible.builtin.command:
        cmd: docker compose ps -a
        chdir: "{{ bastion_app_docker_compose_dir }}"
      register: _compose_ps_missing
      changed_when: false
      failed_when: false

    - name: "nginx logs (missing container)"
      ansible.builtin.command:
        cmd: docker compose logs --no-color --tail 100 nginx
        chdir: "{{ bastion_app_docker_compose_dir }}"
      register: _nginx_logs_missing
      changed_when: false
      failed_when: false

    - name: "Fail ? nginx container introuvable"
      ansible.builtin.fail:
        msg: |
          Conteneur nginx introuvable (attendu: bastion-nginx).
          --- compose ps -a ---
          {{ _compose_ps_missing.stdout | default('') }}
          --- nginx logs ---
          {{ _nginx_logs_missing.stdout | default('') }}
          {{ _nginx_logs_missing.stderr | default('') }}

- name: "SMOKE : nginx running?"
  ansible.builtin.command: >
    docker inspect {{ _nginx_cid.stdout | trim }}
    --format '{% raw %}{{.State.Status}}{% endraw %}'
  register: _nginx_state
  changed_when: false
  failed_when: false

- name: "SMOKE : diagnose nginx not running"
  when: _nginx_state.stdout | trim != "running"
  block:
    - name: "nginx logs (not running)"
      ansible.builtin.command:
        cmd: docker logs --tail 100 {{ _nginx_cid.stdout | trim }}
      register: _nginx_logs_down
      changed_when: false
      failed_when: false

    - name: "compose ps -a (not running)"
      ansible.builtin.command:
        cmd: docker compose ps -a
        chdir: "{{ bastion_app_docker_compose_dir }}"
      register: _compose_ps_down
      changed_when: false
      failed_when: false

    - name: "Fail ? nginx not running"
      ansible.builtin.fail:
        msg: |
          nginx state={{ _nginx_state.stdout | default('n/a') }} (attendu: running)
          --- compose ps ---
          {{ _compose_ps_down.stdout | default('') }}
          --- logs ---
          {{ _nginx_logs_down.stdout | default('') }}
          {{ _nginx_logs_down.stderr | default('') }}

- name: "SMOKE : nginx /api/health via docker exec"
  ansible.builtin.shell: |
    set -o pipefail
    cid="{{ _nginx_cid.stdout | trim }}"
    body="$(docker exec "$cid" wget -qO- http://127.0.0.1:8080/api/health)"
    echo "$body" | grep -q '"status"'
    echo "$body"
  args:
    executable: /bin/bash
  register: _nginx_exec_health
  retries: 15
  delay: 2
  until: _nginx_exec_health.rc | default(1) == 0
  changed_when: false
  failed_when: false

- name: "SMOKE : diagnose nginx listen sockets on failure"
  when: _nginx_exec_health.rc | default(1) != 0
  ansible.builtin.shell: |
    cid="{{ _nginx_cid.stdout | trim }}"
    echo "=== conf.d ==="
    docker exec "$cid" ls -la /etc/nginx/conf.d/ || true
    echo "=== vhost head ==="
    docker exec "$cid" head -40 /etc/nginx/conf.d/vhost_sso_portal.conf || true
    echo "=== listeners ==="
    docker exec "$cid" sh -c 'ss -lntp || netstat -lntp' || true
    echo "=== logs ==="
    docker logs --tail 50 "$cid" || true
  args:
    executable: /bin/bash
  register: _nginx_listen_diag
  changed_when: false
  failed_when: false

- name: "SMOKE : fail with nginx listen diagnostics"
  ansible.builtin.fail:
    msg: |
      nginx /api/health via exec failed.
      {{ _nginx_exec_health.stderr | default('') }}
      {{ _nginx_listen_diag.stdout | default('') }}
  when: _nginx_exec_health.rc | default(1) != 0

- name: "SMOKE : resolve nginx IPv4 on {{ bastion_traefik_network }}"
  ansible.builtin.shell: |
    set -o pipefail
    python3 - {{ _nginx_cid.stdout | trim }} {{ bastion_traefik_network }} <<'PY'
    import json, subprocess, sys
    cid, net = sys.argv[1], sys.argv[2]
    data = json.loads(subprocess.check_output(["docker", "inspect", cid], text=True))
    networks = data[0].get("NetworkSettings", {}).get("Networks") or {}
    print("NETWORKS=" + json.dumps({k: (v or {}).get("IPAddress") for k, v in networks.items()}, sort_keys=True))
    ep = networks.get(net) or {}
    ip = (ep.get("IPAddress") or "").strip()
    if not ip:
        # endpoint present but empty IP ? reconnect
        subprocess.call(["docker", "network", "disconnect", "-f", net, cid])
        subprocess.check_call(["docker", "network", "connect", net, cid])
        data = json.loads(subprocess.check_output(["docker", "inspect", cid], text=True))
        networks = data[0].get("NetworkSettings", {}).get("Networks") or {}
        print("NETWORKS_AFTER_RECONNECT=" + json.dumps({k: (v or {}).get("IPAddress") for k, v in networks.items()}, sort_keys=True))
        ip = ((networks.get(net) or {}).get("IPAddress") or "").strip()
    if not ip:
        sys.stderr.write("no IPv4 on network %r for %s\n" % (net, cid))
        sys.exit(1)
    print(ip)
    PY
  args:
    executable: /bin/bash
  register: _nginx_ip_lookup
  retries: 5
  delay: 2
  until: _nginx_ip_lookup.rc | default(1) == 0
  changed_when: "'NETWORKS_AFTER_RECONNECT=' in (_nginx_ip_lookup.stdout | default(''))"

- name: "SMOKE : set bastion_nginx_vpcbr_ip"
  ansible.builtin.set_fact:
    bastion_nginx_vpcbr_ip: "{{ _nginx_ip_lookup.stdout_lines | last | trim }}"

- name: "SMOKE : fail if nginx IP still invalid"
  ansible.builtin.assert:
    that:
      - bastion_nginx_vpcbr_ip is match('^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$')
    fail_msg: >-
      IP vpcbr invalide: {{ bastion_nginx_vpcbr_ip | default('n/a') }}
      raw={{ _nginx_ip_lookup.stdout | default('') }}
      err={{ _nginx_ip_lookup.stderr | default('') }}

- name: "SMOKE : nginx healthy on vpcbr by IP (bypass Traefik / DNS)"
  ansible.builtin.shell: |
    set -o pipefail
    docker run --rm --network {{ bastion_traefik_network }} curlimages/curl:8.5.0 \
      -fsS -H "Host: {{ portal_domain }}" \
      "http://{{ bastion_nginx_vpcbr_ip }}:8080/api/health"
  args:
    executable: /bin/bash
  register: _nginx_vpcbr
  retries: 10
  delay: 2
  until: _nginx_vpcbr.rc | default(1) == 0
  changed_when: false

- name: "SMOKE : via Traefik https://{{ bastion_docker_host_ip }} Host={{ portal_domain }}"
  ansible.builtin.uri:
    url: "{{ bastion_upstream_url }}/api/health"
    headers:
      Host: "{{ portal_domain }}"
    validate_certs: false
    return_content: true
    status_code: 200
  register: _traefik_health
  retries: 20
  delay: 3
  until: _traefik_health.status | default(0) == 200
  failed_when: false

- name: "SMOKE : diagnose Traefik failure"
  when: _traefik_health.status | default(0) != 200
  block:
    - name: "compose ps"
      ansible.builtin.command:
        cmd: docker compose ps -a
        chdir: "{{ bastion_app_docker_compose_dir }}"
      register: _compose_ps
      changed_when: false
      failed_when: false

    - name: "nginx logs"
      ansible.builtin.command:
        cmd: docker logs --tail 80 {{ _nginx_cid.stdout | trim }}
      register: _nginx_logs
      changed_when: false
      failed_when: false

    - name: "nginx labels"
      ansible.builtin.command: >
        docker inspect {{ _nginx_cid.stdout | trim }}
        --format '{% raw %}{{json .Config.Labels}}{% endraw %}'
      register: _nginx_labels
      changed_when: false
      failed_when: false

    - name: "Fail with Traefik diagnostics"
      ansible.builtin.fail:
        msg: |
          Traefik /api/health ? HTTP {{ _traefik_health.status | default('n/a') }}
          body={{ _traefik_health.content | default('') }}
          nginx_vpcbr_ip={{ bastion_nginx_vpcbr_ip | default('') }}
          nginx-via-vpcbr rc={{ _nginx_vpcbr.rc | default('n/a') }} out={{ _nginx_vpcbr.stdout | default('') }}
          --- compose ps ---
          {{ _compose_ps.stdout | default('') }}
          --- nginx logs ---
          {{ _nginx_logs.stdout | default('') }}
          {{ _nginx_logs.stderr | default('') }}
          --- labels ---
          {{ _nginx_labels.stdout | default('') }}

- name: "SMOKE : docker compose ps"
  ansible.builtin.command:
    cmd: docker compose ps
    chdir: "{{ bastion_app_docker_compose_dir }}"
  register: _compose_ps_ok
  changed_when: false

- name: "SMOKE : oauth2-proxy-core /oauth2/start (302 attendu si cfg valide)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:4180/oauth2/start"
    method: GET
    follow_redirects: none
    status_code: [302, 303, 400, 500]
  register: _oauth2_start
  failed_when: false

- name: "SMOKE : log oauth2 start status"
  ansible.builtin.debug:
    msg: "oauth2/start status={{ _oauth2_start.status | default('n/a') }} (302/303 = OK)"

- name: "SMOKE : RFC1918 bypass disabled + auth SSO fixes in image"
  ansible.builtin.shell: |
    set -euo pipefail
    cd "{{ bastion_app_docker_compose_dir }}"
    val="$(docker compose exec -T bastion-app python -c 'from app.sso_settings import get_settings; print(get_settings().rfc1918_bypass_enabled)')"
    echo "rfc1918_bypass_enabled=${val}"
    test "${val}" = "False" || test "${val}" = "false"
    docker compose exec -T bastion-app python -c \
      "import app.admin.infrastructure as i; assert hasattr(i,'get_core_realm_for_oauth2_export')"
    docker compose exec -T bastion-app python -c \
      "import pathlib, app.auth as a; t=pathlib.Path(a.__file__).read_text(); assert ('Do NOT apply RFC1918 bypass' in t) or ('Prefer SSO session' in t)"
  args:
    executable: /bin/bash
  register: _auth_image_smoke
  changed_when: false

- name: "SMOKE : nginx subdomain auth snippet uses portal-parity Cookie/Host"
  ansible.builtin.shell: |
    set -euo pipefail
    docker exec bastion-nginx grep -q 'proxy_set_header Cookie          \$http_cookie;' \
      /etc/nginx/snippets/subdomain_auth_common.conf
    docker exec bastion-nginx grep -q 'X-Bastion-Session-Cookie \$cookie_bastion_session' \
      /etc/nginx/snippets/subdomain_auth_common.conf
    docker exec bastion-nginx grep -q 'proxy_set_header Host            \$host;' \
      /etc/nginx/snippets/subdomain_auth_common.conf
    echo "nginx subdomain auth portal-parity OK"
  args:
    executable: /bin/bash
  register: _nginx_subdomain_auth_smoke
  changed_when: false

- name: "SMOKE : subdomain export has bastion_sub=1 and auth_err diag"
  ansible.builtin.shell: |
    set -euo pipefail
    conf=/etc/nginx/conf.d/nginx-subdomain-apps.conf
    docker exec bastion-nginx test -f "$conf"
    if ! docker exec bastion-nginx grep -q 'auth_request /internal/subdomain-auth' "$conf"; then
      echo "no subdomain_proxy apps — skip"
      exit 0
    fi
    docker exec bastion-nginx grep -q 'bastion_sub=1' "$conf"
    docker exec bastion-nginx grep -q 'auth_request_set \$bastion_auth_err' "$conf"
    echo "subdomain export bastion_sub + auth_err OK"
  args:
    executable: /bin/bash
  register: _nginx_subdomain_export_smoke
  changed_when: false
  failed_when: false

- name: "SMOKE : warn if subdomain export missing Transfer loop fixes"
  ansible.builtin.debug:
    msg: >-
      nginx-subdomain-apps.conf sans bastion_sub=1 / auth_err diag ?
      Relancer infrastructure apply après rebuild bastion-app + nginx.
      rc={{ _nginx_subdomain_export_smoke.rc }}
      {{ _nginx_subdomain_export_smoke.stdout | default('') }}
      {{ _nginx_subdomain_export_smoke.stderr | default('') }}
  when: _nginx_subdomain_export_smoke.rc | default(1) != 0

- name: "SMOKE : nginx signin defaults rd to /apps"
  ansible.builtin.shell: |
    set -euo pipefail
    docker exec bastion-nginx grep -E 'portal_login_rd|/auth/login\?rd=' \
      /etc/nginx/conf.d/vhost_sso_portal.conf | head -20
    docker exec bastion-nginx grep -q 'set \$portal_login_rd /apps' \
      /etc/nginx/conf.d/vhost_sso_portal.conf
  args:
    executable: /bin/bash
  register: _nginx_rd_smoke
  changed_when: false
  failed_when: false

- name: "SMOKE : warn if nginx rd=/apps missing (rebuild nginx image)"
  ansible.builtin.debug:
    msg: >-
      nginx vhost sans 'set $portal_login_rd /apps' ?
      {{ _nginx_rd_smoke.stdout | default('') }} rc={{ _nginx_rd_smoke.rc }}
  when: _nginx_rd_smoke.rc | default(1) != 0

- name: "SMOKE : nginx forwards Keycloak sub as X-User-Id"
  ansible.builtin.shell: |
    set -euo pipefail
    docker exec bastion-nginx grep -q 'proxy_set_header X-User-Id' \
      /etc/nginx/conf.d/vhost_sso_portal.conf
    docker exec bastion-nginx grep -q 'proxy_set_header X-User \$auth_preferred' \
      /etc/nginx/conf.d/vhost_sso_portal.conf
    echo "nginx X-User-Id + X-User=\$auth_preferred OK"
  args:
    executable: /bin/bash
  register: _nginx_userid_smoke
  changed_when: false

- name: "SMOKE : oauth2-proxy-core cfg has user_id_claim=sub"
  ansible.builtin.shell: |
    set -euo pipefail
    cfg="{{ bastion_app_docker_compose_dir }}/docker/oauth2-core/oauth2-proxy.cfg"
    test -f "$cfg"
    grep -E 'user_id_claim\s*=\s*"sub"' "$cfg"
    echo "oauth2 user_id_claim=sub OK ($cfg)"
  args:
    executable: /bin/bash
  register: _oauth2_sub_smoke
  changed_when: false
  failed_when: false

- name: "SMOKE : oauth2-proxy-core cfg has cookie_expire=12h and cookie_refresh=1h"
  ansible.builtin.shell: |
    set -euo pipefail
    cfg="{{ bastion_app_docker_compose_dir }}/docker/oauth2-core/oauth2-proxy.cfg"
    test -f "$cfg"
    grep -E 'cookie_expire\s*=\s*"12h"' "$cfg"
    grep -E 'cookie_refresh\s*=\s*"1h"' "$cfg"
    echo "oauth2 cookie_expire=12h cookie_refresh=1h OK ($cfg)"
  args:
    executable: /bin/bash
  register: _oauth2_ttl_smoke
  changed_when: false
  failed_when: false

- name: "SMOKE : oauth2-proxy-core cfg has cookie_secure/httponly/samesite"
  ansible.builtin.shell: |
    set -euo pipefail
    cfg="{{ bastion_app_docker_compose_dir }}/docker/oauth2-core/oauth2-proxy.cfg"
    test -f "$cfg"
    grep -E 'cookie_secure\s*=\s*true' "$cfg"
    grep -E 'cookie_httponly\s*=\s*true' "$cfg"
    grep -E 'cookie_samesite\s*=\s*"lax"' "$cfg"
    echo "oauth2 cookie_secure/httponly/samesite=lax OK ($cfg)"
  args:
    executable: /bin/bash
  register: _oauth2_flags_smoke
  changed_when: false
  failed_when: false

- name: "SMOKE : fail if cookie TTL missing after apply-infra"
  ansible.builtin.fail:
    msg: >-
      oauth2-proxy.cfg sans cookie_expire="12h" / cookie_refresh="1h" ?
      Relancer infrastructure apply + apply-infra-docker apres deploiement bastion-app.
      stdout={{ _oauth2_ttl_smoke.stdout | default('') }}
      stderr={{ _oauth2_ttl_smoke.stderr | default('') }}
  when: _oauth2_ttl_smoke.rc | default(1) != 0

- name: "SMOKE : fail if cookie flags missing after apply-infra"
  ansible.builtin.fail:
    msg: >-
      oauth2-proxy.cfg sans cookie_secure=true / cookie_httponly=true / cookie_samesite="lax" ?
      Relancer infrastructure apply + apply-infra-docker apres deploiement bastion-app.
      stdout={{ _oauth2_flags_smoke.stdout | default('') }}
      stderr={{ _oauth2_flags_smoke.stderr | default('') }}
  when: _oauth2_flags_smoke.rc | default(1) != 0

- name: "SMOKE : fail if user_id_claim=sub missing after apply-infra"
  ansible.builtin.fail:
    msg: >-
      oauth2-proxy.cfg sans user_id_claim="sub" ? relancer infrastructure apply
      + apply-infra-docker apres deploiement bastion-app (AccessGrant portal_admin
      ne matchera pas sans subject Keycloak).
      stdout={{ _oauth2_sub_smoke.stdout | default('') }}
      stderr={{ _oauth2_sub_smoke.stderr | default('') }}
  when: _oauth2_sub_smoke.rc | default(1) != 0

- name: "SMOKE : subdomain-auth via FastAPI (expect 401 without cookie, not 500)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:8000/internal/subdomain-auth"
    headers:
      X-Original-Host: "transfer.{{ base_domain }}"
      X-Real-IP: "8.8.8.8"
    status_code: [200, 401, 403]
  register: _subdomain_auth
  failed_when: _subdomain_auth.status | default(500) == 500

- name: "SMOKE : rappel upstream pour reverse01"
  ansible.builtin.debug:
    msg: >-
      Edge (vmdmz-reverse01) : proxy_pass {{ bastion_upstream_url }}
      avec Host {{ portal_domain }} (meme schema que Keycloak / Traefik).

- name: "SMOKE : SQLCipher — portal.db illisible sans clé"
  ansible.builtin.shell: |
    set -euo pipefail
    python3 - <<'PY'
    import sqlite3
    import sys
    path = "{{ sso_portal_db_path }}"
    try:
        conn = sqlite3.connect(path)
        conn.execute("SELECT count(*) FROM sqlite_master").fetchone()
        conn.close()
        print("FAIL: portal.db readable without SQLCipher key", file=sys.stderr)
        sys.exit(1)
    except Exception as exc:
        print(f"OK: plaintext open failed as expected ({type(exc).__name__})")
    PY
  args:
    executable: /bin/bash
  register: _sqlcipher_smoke
  changed_when: false
  failed_when: _sqlcipher_smoke.rc != 0

- name: "SMOKE : post-rotation - dechiffrement credential de test (optionnel)"
  when: sso_portal_post_rotation_smoke | default(false) | bool
  block:
    - name: "SMOKE : decrypt sample ciphertext via bastion-app container"
      ansible.builtin.shell: |
        set -euo pipefail
        docker compose exec -T \
          -e DATABASE_URL="${DATABASE_URL}" \
          -e PORTAL_SECRET_ENCRYPTION_KEY="${PORTAL_SECRET_ENCRYPTION_KEY}" \
          -e VAULT_PORTAL_VAULT_FERNET_KEY="${VAULT_PORTAL_VAULT_FERNET_KEY}" \
          -e VAULT_PORTAL_DB_ENCRYPTION_KEY="${VAULT_PORTAL_DB_ENCRYPTION_KEY}" \
          -e VAULT_KEYS_DIR="${VAULT_KEYS_DIR}" \
          -e PORTAL_DATA_DIR="${PORTAL_DATA_DIR}" \
          bastion-app python - <<'PY'
        import sys
        from app.db_cipher import create_portal_engine
        from sqlalchemy.orm import sessionmaker
        from app.models import AppCredential, RealmConfig
        from app.secret_crypto import decrypt_secret
        from app.sso_settings import Settings

        settings = Settings()
        engine = create_portal_engine(settings.database_url, settings)
        Session = sessionmaker(bind=engine)
        db = Session()
        try:
            ok = 0
            cred = db.query(AppCredential).filter_by(is_active=True).first()
            if cred is not None:
                decrypt_secret(cred.encrypted_password, settings)
                ok += 1
            realm = (
                db.query(RealmConfig)
                .filter(RealmConfig.client_secret_encrypted.isnot(None))
                .filter(RealmConfig.client_secret_encrypted != "")
                .first()
            )
            if realm is not None:
                decrypt_secret(realm.client_secret_encrypted, settings)
                ok += 1
            if ok == 0:
                print("WARN: no AppCredential/RealmConfig ciphertext to verify", file=sys.stderr)
                sys.exit(0)
            print(f"OK: decrypted {ok} sample ciphertext(s) with current key")
        finally:
            db.close()
        PY
      args:
        executable: /bin/bash
        chdir: "{{ bastion_app_docker_compose_dir }}"
      environment:
        DATABASE_URL: "sqlite:////var/lib/sso-portal/portal.db"
        PORTAL_SECRET_ENCRYPTION_KEY: "{{ portal_secret_encryption_key | default(vault_portal_vault_fernet_key) }}"
        VAULT_PORTAL_VAULT_FERNET_KEY: "{{ vault_portal_vault_fernet_key }}"
        VAULT_PORTAL_DB_ENCRYPTION_KEY: "{{ vault_portal_db_encryption_key }}"
        VAULT_KEYS_DIR: /var/lib/sso-portal/keys
        PORTAL_DATA_DIR: /var/lib/sso-portal
      no_log: true
      register: _post_rotation_decrypt

    - name: "SMOKE : assert post-rotation decrypt OK"
      ansible.builtin.assert:
        that:
          - _post_rotation_decrypt.rc | default(1) == 0
        fail_msg: >-
          Post-rotation decrypt failed ? cle Fernet ou re-chiffrement incoherent.
          Pas de rollback automatique ; restaurer bak-pre-rotation-* manuellement si besoin.

- name: "SMOKE : verify local Fernet key migration (data volume)"
  ansible.builtin.include_tasks: verify_fernet_key_migration.yml
  when: sso_portal_verify_fernet_key_migration | default(true) | bool

- name: "SMOKE : capture key version before down/up cycle"
  when: sso_portal_verify_fernet_key_migration | default(true) | bool
  ansible.builtin.slurp:
    src: "{{ sso_portal_keys_dir }}/current"
  register: _key_ver_before

- name: "SMOKE : compose stop/start bastion-app (key persistence)"
  when: sso_portal_verify_fernet_key_migration | default(true) | bool
  ansible.builtin.shell: |
    set -euo pipefail
    docker compose stop bastion-app
    docker compose start bastion-app
  args:
    executable: /bin/bash
    chdir: "{{ bastion_app_docker_compose_dir }}"
  environment:
    SSO_PORTAL_DATA_DIR: "{{ bastion_app_docker_data_dir }}"
    SSO_PORTAL_FILES_DATA_DIR: "{{ bastion_app_docker_files_data_dir }}"

- name: "SMOKE : wait health after restart"
  when: sso_portal_verify_fernet_key_migration | default(true) | bool
  ansible.builtin.uri:
    url: "http://127.0.0.1:8000/api/health"
    status_code: 200
  register: _health_after_key
  retries: 20
  delay: 2
  until: _health_after_key.status | default(0) == 200

- name: "SMOKE : assert key version unchanged after restart"
  when: sso_portal_verify_fernet_key_migration | default(true) | bool
  ansible.builtin.slurp:
    src: "{{ sso_portal_keys_dir }}/current"
  register: _key_ver_after

- name: "SMOKE : fail if key version changed (undesired regeneration)"
  when: sso_portal_verify_fernet_key_migration | default(true) | bool
  ansible.builtin.assert:
    that:
      - (_key_ver_before.content | b64decode | trim) == (_key_ver_after.content | b64decode | trim)
    fail_msg: >-
      Fernet key version changed after container restart
      (before={{ _key_ver_before.content | b64decode | trim }}
      after={{ _key_ver_after.content | b64decode | trim }}).
      Check persistent volume {{ sso_portal_keys_dir }}.

- name: "SMOKE : write probe into FILES_STORAGE_DIR (files volume)"
  ansible.builtin.shell: |
    set -euo pipefail
    docker compose exec -T bastion-app python - <<'PY'
    from app.files.service import ensure_files_storage_dir
    root = ensure_files_storage_dir()
    probe = root / ".volume_smoke_probe"
    probe.write_text("persist-ok", encoding="utf-8")
    print(probe)
    PY
  args:
    executable: /bin/bash
    chdir: "{{ bastion_app_docker_compose_dir }}"
  environment:
    SSO_PORTAL_DATA_DIR: "{{ bastion_app_docker_data_dir }}"
    SSO_PORTAL_FILES_DATA_DIR: "{{ bastion_app_docker_files_data_dir }}"

- name: "SMOKE : compose stop/start bastion-app (files volume persistence)"
  ansible.builtin.shell: |
    set -euo pipefail
    docker compose stop bastion-app
    docker compose start bastion-app
  args:
    executable: /bin/bash
    chdir: "{{ bastion_app_docker_compose_dir }}"
  environment:
    SSO_PORTAL_DATA_DIR: "{{ bastion_app_docker_data_dir }}"
    SSO_PORTAL_FILES_DATA_DIR: "{{ bastion_app_docker_files_data_dir }}"

- name: "SMOKE : wait health after files volume restart"
  ansible.builtin.uri:
    url: "http://127.0.0.1:8000/api/health"
    status_code: 200
  register: _health_after_files
  retries: 20
  delay: 2
  until: _health_after_files.status | default(0) == 200

- name: "SMOKE : assert files volume probe survived restart"
  ansible.builtin.shell: |
    set -euo pipefail
    docker compose exec -T bastion-app python - <<'PY'
    from app.files.service import get_files_storage_root
    probe = get_files_storage_root() / ".volume_smoke_probe"
    assert probe.is_file(), f"missing {probe}"
    assert probe.read_text(encoding="utf-8") == "persist-ok"
    print("ok", probe)
    PY
  args:
    executable: /bin/bash
    chdir: "{{ bastion_app_docker_compose_dir }}"
  environment:
    SSO_PORTAL_DATA_DIR: "{{ bastion_app_docker_data_dir }}"
    SSO_PORTAL_FILES_DATA_DIR: "{{ bastion_app_docker_files_data_dir }}"
