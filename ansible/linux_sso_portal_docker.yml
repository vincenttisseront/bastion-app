---
# DEPRECATED — ne pas utiliser comme Job Template AWX.
#
# Entry point UNIQUE : awx-playbook / linux_sso_portal_docker.yml
# (Project AWX = awx-playbook ; ce fichier n'est PAS visible depuis AWX).
#
# Le rôle ansible/roles/bastion_app_docker est consommé via symlink
# bastion_app_docker_phase7 depuis le playbook awx-playbook après clone
# de ce dépôt @ bastion_app_git_version.

- name: "Refuse local/obsolete entry point"
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Fail — use awx-playbook linux_sso_portal_docker.yml
      ansible.builtin.fail:
        msg: >-
          Déploiement Docker bastion : utiliser uniquement le playbook
          awx-playbook/linux_sso_portal_docker.yml (Job Template AWX).
          Ne pas lancer ansible/linux_sso_portal_docker.yml depuis bastion-app.
