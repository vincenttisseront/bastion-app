---
# Portail SSO AR Systems — bastion-app Phase 7 (Docker)
#
# Topologie (comme Keycloak) :
#   - [sso_portal_docker] vmdmz-docker01 : Traefik + stack sous /tools/portal
#   - vmdmz-reverse01 : nginx edge TLS → https://172.24.0.110 (Host: portal.*)
#
# Usage:
#   ansible-playbook ansible/linux_sso_portal_docker.yml \
#     -i ansible/inventory/inventory_sso_portal.ini \
#     -e vault_portal_internal_token=... \
#     -e portal_secret_encryption_key=...
#
# Ne remplace PAS linux_sso_portal.yml (bare-metal) — bascule séparée.
# Edge reverse01 : awx-playbook linux_nginx_dmz.yml (portal_bastion_edge_enabled).

- name: "PRE-FLIGHT : validation Docker avant mutation"
  hosts: "{{ sso_portal_docker_hosts | default('sso_portal_docker:vmdmz-docker01') }}"
  become: true
  gather_facts: true
  tags:
    - preflight
  tasks:
    - name: Run Docker bastion preflight
      ansible.builtin.include_role:
        name: bastion_app_docker
        tasks_from: preflight.yml
      when: bastion_app_docker_enabled | default(true) | bool

- name: "DEPLOY : stack Docker bastion"
  hosts: "{{ sso_portal_docker_hosts | default('sso_portal_docker:vmdmz-docker01') }}"
  become: true
  gather_facts: true
  tags:
    - deploy
  tasks:
    - name: Deploy bastion Docker compose stack
      ansible.builtin.include_role:
        name: bastion_app_docker
        tasks_from: main.yml
      when: bastion_app_docker_enabled | default(true) | bool

- name: "SMOKE : validation post-déploiement Docker"
  hosts: "{{ sso_portal_docker_hosts | default('sso_portal_docker:vmdmz-docker01') }}"
  become: true
  gather_facts: false
  tags:
    - smoke
  tasks:
    - name: Run Docker bastion smoke tests
      ansible.builtin.include_role:
        name: bastion_app_docker
        tasks_from: smoke_test.yml
      when: bastion_app_docker_enabled | default(true) | bool
