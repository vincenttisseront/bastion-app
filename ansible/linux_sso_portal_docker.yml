---
# Bastion Docker + edge DMZ — entry point AWX Project = bastion-app
#
# Job Template AWX :
#   Project    = bastion-app
#   Playbook   = ansible/linux_sso_portal_docker.yml
#   Inventaire = inventaire AWX (groupes ci-dessous — PAS le .ini.example du repo)
#   Limit      = hôte(s) choisis dans AWX (ex. vmdmz-docker01 et/ou vmdmz-reverse01)
#
# Groupes inventaire attendus (noms stables ; les hosts sont dans AWX) :
#   sso_portal_docker  → stack Compose (docker01)
#   nginx_dmz | sso_portal_edge → catch-all TLS (reverse01)
#
# Tags : docker | edge | smoke | preflight | validate_purge
#
# Extra-vars utiles :
#   bastion_edge_catchall_enabled: true   # cutover edge
#   bastion_docker_play_hosts / bastion_edge_play_hosts  # override patterns si besoin

- name: "PREFLIGHT Docker stack"
  hosts: "{{ bastion_docker_play_hosts | default('sso_portal_docker') }}"
  become: true
  gather_facts: true
  tags:
    - preflight
    - docker
  tasks:
    - name: Run bastion Docker preflight
      ansible.builtin.include_role:
        name: bastion_app_docker
        tasks_from: preflight.yml
      when: bastion_app_docker_enabled | default(true) | bool

- name: "Deploy bastion Docker stack"
  hosts: "{{ bastion_docker_play_hosts | default('sso_portal_docker') }}"
  become: true
  gather_facts: true
  tags:
    - docker
    - deploy
  roles:
    - role: bastion_app_docker
      when: bastion_app_docker_enabled | default(true) | bool

- name: "SMOKE Docker stack"
  hosts: "{{ bastion_docker_play_hosts | default('sso_portal_docker') }}"
  become: true
  gather_facts: false
  tags:
    - smoke
    - smoke_test
    - docker
  tasks:
    - name: Run bastion Docker smoke
      ansible.builtin.include_role:
        name: bastion_app_docker
        tasks_from: smoke_test.yml
      when: bastion_app_docker_enabled | default(true) | bool

- name: "VALIDATE_PURGE oauth2 units list"
  hosts: "{{ bastion_docker_play_hosts | default('sso_portal_docker') }}"
  become: true
  gather_facts: false
  tags:
    - validate_purge
    - smoke
  tasks:
    - name: Run validate_purge_units
      ansible.builtin.include_role:
        name: bastion_app_docker
        tasks_from: validate_purge_units.yml
      when: bastion_app_docker_enabled | default(true) | bool

- name: "Deploy edge DMZ catch-all"
  hosts: "{{ bastion_edge_play_hosts | default('nginx_dmz:sso_portal_edge') }}"
  become: true
  gather_facts: true
  tags:
    - edge
    - deploy
  roles:
    - role: bastion_edge_dmz
      when: bastion_edge_catchall_enabled | default(false) | bool

- name: "SMOKE edge DMZ"
  hosts: "{{ bastion_edge_play_hosts | default('nginx_dmz:sso_portal_edge') }}"
  become: true
  gather_facts: false
  tags:
    - smoke
    - smoke_test
    - edge
  tasks:
    - name: Run edge catch-all smoke
      ansible.builtin.include_role:
        name: bastion_edge_dmz
        tasks_from: smoke.yml
      when: bastion_edge_catchall_enabled | default(false) | bool
