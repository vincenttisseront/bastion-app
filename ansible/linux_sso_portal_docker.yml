---
# Référence locale / CI — le Job Template AWX DOIT utiliser
# awx-playbook/linux_sso_portal_docker.yml (seul repo visible d'AWX).
#
# Ce fichier conserve le même contrat de rôles pour tests hors AWX :
#   ansible-playbook ansible/linux_sso_portal_docker.yml \
#     -i ansible/inventory/inventory_sso_portal.ini
#
# Prod AWX : Project=awx-playbook, Playbook=linux_sso_portal_docker.yml
# Extra-vars recommandés : bastion_app_git_ref=master (ou tag),
# bastion_app_docker_fetch_git=true (défaut) — clone bastion-app avant docker build.

- name: "PRE-FLIGHT : validation Docker avant mutation"
  hosts: "{{ sso_portal_docker_hosts | default('sso_portal_docker:vmdmz-docker01') }}"
  become: true
  gather_facts: true
  tags:
    - preflight
  tasks:
    - name: Run Docker bastion preflight
      ansible.builtin.include_role:
        name: bastion_app_docker
        tasks_from: preflight.yml
      when: bastion_app_docker_enabled | default(true) | bool

- name: "DEPLOY : stack Docker bastion"
  hosts: "{{ sso_portal_docker_hosts | default('sso_portal_docker:vmdmz-docker01') }}"
  become: true
  gather_facts: true
  tags:
    - deploy
  tasks:
    - name: Deploy bastion Docker compose stack
      ansible.builtin.include_role:
        name: bastion_app_docker
        tasks_from: main.yml
      when: bastion_app_docker_enabled | default(true) | bool

- name: "SMOKE : validation post-déploiement Docker"
  hosts: "{{ sso_portal_docker_hosts | default('sso_portal_docker:vmdmz-docker01') }}"
  become: true
  gather_facts: false
  tags:
    - smoke
  tasks:
    - name: Run Docker bastion smoke tests
      ansible.builtin.include_role:
        name: bastion_app_docker
        tasks_from: smoke_test.yml
      when: bastion_app_docker_enabled | default(true) | bool
