---
# Déploiement Docker bastion (Phase 7) — AWX + local.
#
# AWX :
#   Project  = awx-playbook (doit contenir ce playbook + roles/bastion_app_docker*
#              synchronisés depuis bastion-app/ansible/)
#   Playbook = linux_sso_portal_docker.yml
#   Inventaire = sso_portal_docker / vmdmz-docker01
#
# Flux :
#   1) clone Git bastion-app @ bastion_app_git_ref (controller)
#   2) tar → /tools/portal + docker compose build/up
#   3) VERIFY image SSO (RFC1918=false, rd=/apps) sinon fail
#   4) vpcbr aliases + smoke
#
# Extra-vars AWX (override) :
#   bastion_app_git_ref: master
#   vault_portal_internal_token / vault_sso_portal_oidc_client_secret / …

- name: "PRE-FLIGHT : validation Docker avant mutation"
  hosts: "{{ sso_portal_docker_hosts | default('sso_portal_docker:vmdmz-docker01') }}"
  become: true
  gather_facts: true
  tags:
    - preflight
  vars:
    bastion_app_docker_enabled: true
    bastion_app_docker_fetch_git: true
    bastion_app_git_repo: "https://github.com/vincenttisseront/bastion-app.git"
    bastion_app_git_ref: master
    bastion_app_docker_role_name: bastion_app_docker_phase7
  tasks:
    - name: Run Docker bastion preflight
      ansible.builtin.include_role:
        name: "{{ bastion_app_docker_role_name }}"
        tasks_from: preflight.yml
      when: bastion_app_docker_enabled | bool

- name: "DEPLOY : stack Docker bastion"
  hosts: "{{ sso_portal_docker_hosts | default('sso_portal_docker:vmdmz-docker01') }}"
  become: true
  gather_facts: true
  tags:
    - deploy
  vars:
    bastion_app_docker_enabled: true
    bastion_app_docker_fetch_git: true
    bastion_app_git_repo: "https://github.com/vincenttisseront/bastion-app.git"
    bastion_app_git_ref: master
    bastion_app_docker_role_name: bastion_app_docker_phase7
  tasks:
    - name: Deploy bastion Docker compose stack
      ansible.builtin.include_role:
        name: "{{ bastion_app_docker_role_name }}"
        tasks_from: main.yml
      when: bastion_app_docker_enabled | bool

- name: "SMOKE : validation post-déploiement Docker"
  hosts: "{{ sso_portal_docker_hosts | default('sso_portal_docker:vmdmz-docker01') }}"
  become: true
  gather_facts: false
  tags:
    - smoke
  vars:
    bastion_app_docker_enabled: true
    bastion_app_docker_role_name: bastion_app_docker_phase7
  tasks:
    - name: Run Docker bastion smoke tests
      ansible.builtin.include_role:
        name: "{{ bastion_app_docker_role_name }}"
        tasks_from: smoke_test.yml
      when: bastion_app_docker_enabled | bool
