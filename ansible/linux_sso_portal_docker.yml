---
# Optional AWX entry — production deploy is deploy/docker-compose.yml (public images).
# Tags: docker | edge | smoke | preflight | validate_purge | modsec_wazuh

- name: "Deploy bastion (docker compose)"
  hosts: "{{ bastion_docker_play_hosts | default('all') }}"
  become: true
  gather_facts: true
  tags:
    - docker
    - deploy
  roles:
    - role: bastion_app_docker
      when: bastion_app_docker_enabled | default(true) | bool

- name: "PREFLIGHT Docker stack"
  hosts: "{{ bastion_docker_play_hosts | default('all') }}"
  become: true
  gather_facts: true
  tags:
    - preflight
  tasks:
    - name: Run bastion Docker preflight
      ansible.builtin.include_role:
        name: bastion_app_docker
        tasks_from: preflight.yml
      when: bastion_app_docker_enabled | default(true) | bool

- name: "SMOKE Docker stack"
  hosts: "{{ bastion_docker_play_hosts | default('all') }}"
  become: true
  gather_facts: false
  tags:
    - smoke
    - smoke_test
  tasks:
    - name: Run bastion Docker smoke
      ansible.builtin.include_role:
        name: bastion_app_docker
        tasks_from: smoke_test.yml
      when: bastion_app_docker_enabled | default(true) | bool

- name: "VALIDATE_PURGE oauth2 units list"
  hosts: "{{ bastion_docker_play_hosts | default('all') }}"
  become: true
  gather_facts: false
  tags:
    - validate_purge
  tasks:
    - name: Run validate_purge_units
      ansible.builtin.include_role:
        name: bastion_app_docker
        tasks_from: validate_purge_units.yml
      when: bastion_app_docker_enabled | default(true) | bool

- name: "Deploy edge DMZ catch-all"
  hosts: "{{ bastion_edge_play_hosts | default('all') }}"
  become: true
  gather_facts: true
  tags:
    - edge
  roles:
    - role: bastion_edge_dmz
      when: bastion_edge_catchall_enabled | default(false) | bool

- name: "SMOKE edge DMZ"
  hosts: "{{ bastion_edge_play_hosts | default('all') }}"
  become: true
  gather_facts: false
  tags:
    - smoke
    - edge
  tasks:
    - name: Run edge catch-all smoke
      ansible.builtin.include_role:
        name: bastion_edge_dmz
        tasks_from: smoke.yml
      when: bastion_edge_catchall_enabled | default(false) | bool

- name: "Deploy ModSecurity → Wazuh host normalizer"
  hosts: "{{ bastion_docker_play_hosts | default('all') }}"
  become: true
  gather_facts: true
  tags:
    - modsec_wazuh
    - wazuh
  roles:
    - role: modsec_wazuh_normalizer
      when: modsec_wazuh_normalizer_enabled | default(false) | bool
