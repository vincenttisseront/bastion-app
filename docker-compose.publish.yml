# Override local / smoke — republie nginx HTTP loopback (déjà dans compose principal).
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.publish.yml up -d
#
# En prod docker01 : compose principal publie déjà 80/443 (edge nginx).

services:
  nginx:
    ports:
      - "127.0.0.1:8080:8080"
