[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bastion-app"
version = "0.1.0"
description = "SSO portal and application bastion for AR-Systems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.137.1",
    "uvicorn[standard]>=0.49.0",
    "httpx>=0.28.1",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.14.1",
    "PyJWT>=2.13.0",
    "cryptography>=49.0.0",
    "sqlalchemy>=2.0.51",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "bcrypt>=5.0.0",
    "pyyaml>=6.0.3",
    "email-validator>=2.3.0",
    "pandas>=2.2",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "playwright>=1.49",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
