[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bastion-app"
version = "0.11.5"
description = "SSO portal and application bastion (FastAPI, nginx, oauth2-proxy, ACME)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.12.0",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.15.0",
    "PyJWT>=2.13.0",
    "cryptography>=50.0.0",
    # Admin MFA TOTP (Phase A) — secrets Fernet-wrapped via app.secret_crypto.
    "pyotp>=2.9.0",
    "qrcode>=8.0",
    # Admin MFA WebAuthn / Passkeys (Phase B).
    "webauthn>=2.0",
    "sqlalchemy>=2.0.51",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "bcrypt>=5.0.0",
    "pyyaml>=6.0.3",
    "email-validator>=2.3.0",
    "reportlab>=4.2",
    "Pillow>=13.0",
    "alembic>=1.19.0",
    "apscheduler>=3.10.4",
    "packaging>=26.3",
    # Linear-time regex engine (ReDoS hardening) — see app/re_safe.py.
    "google-re2>=1.1",
    # Self-hosted ALTCHA proof-of-work captcha (access-request form).
    "altcha>=1.0.0",
    # Postgres driver for optional hot store (sessions/audit).
    "psycopg[binary]>=3.2.0",
    # Linux only (Docker/prod). Windows/macOS stay on stdlib sqlite for tests.
    # sqlcipher3 (not -binary, frozen at 0.6.0 / SQLite 3.51.1): self-contained
    # wheels since 0.6.2; >=0.6.4 bundles SQLite 3.53+, which fixes the unix-VFS
    # open/close deadlock (SQLite f65aa46796) behind the 2026-11-06 freeze, and
    # 0.6.3 fixes a Py_DECREF without the GIL in UDF destructors (coleifer/sqlcipher3#33).
    "sqlcipher3>=0.6.5; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.16.2",
    "playwright>=1.62.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/**/*", "static/**/*", "i18n/locales/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Keep select broad for local `ruff check --fix`; Jenkins Soft-fails (see Jenkinsfile).
# FastAPI Depends()/Form()/File() in defaults is intentional (B008 false positive).
ignore = [
  "B008",
]

[tool.ruff.lint.per-file-ignores]
"app/audit/event_catalog.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Repo root on sys.path so `from tests...` imports work in CI (Docker cwd-only).
pythonpath = ["."]
markers = [
    "security_active: light non-destructive probes against staging (needs confirmed IP)",
]

[tool.coverage.run]
branch = true
source = ["app"]
relative_files = true
omit = [
    "*/migrations/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
