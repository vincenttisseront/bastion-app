[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bastion-app"
version = "0.1.0"
description = "SSO portal and application bastion (FastAPI, nginx, oauth2-proxy, ACME)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.137.1",
    "uvicorn[standard]>=0.49.0",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.12.0",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.14.2",
    "PyJWT>=2.13.0",
    "cryptography>=49.0.0",
    "sqlalchemy>=2.0.51",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "bcrypt>=5.0.0",
    "pyyaml>=6.0.3",
    "email-validator>=2.3.0",
    "pandas>=2.2",
    "reportlab>=4.2",
    "Pillow>=10.0",
    "alembic>=1.14.0",
    "apscheduler>=3.10.4",
    "packaging>=24.0",
    # Self-hosted ALTCHA proof-of-work captcha (access-request form).
    "altcha>=1.0.0",
    # Postgres driver for optional hot store (sessions/audit).
    "psycopg[binary]>=3.2.0",
    # Linux wheels only (Docker/prod). Windows/macOS stay on stdlib sqlite for tests.
    "sqlcipher3-binary>=0.6.0; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
    "playwright>=1.49",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/**/*", "static/**/*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "security_active: light non-destructive probes against staging (needs confirmed IP)",
]
