# SonarCloud Automatic Analysis reads this file. sonar-project.properties is
# only used by the Jenkins scanner (sonar.sources=app), which never sees
# docker/.
#
# docker/nginx/errors/* are generated by scripts/generate_nginx_error_pages.py
# from a single template (app/templates/errors/static_page.html) and are
# identical by construction: they must not count as duplicated code. They are
# still analysed for every other rule.
sonar.cpd.exclusions=docker/nginx/errors/**
