# Portal family — rules file referenced by vhost_sso_portal
Include /etc/nginx/modsecurity/engine-portal.conf
Include /etc/nginx/modsecurity/modsecurity.conf
# Optional override when nginx-logs volume not writable (written by fix-nginx-logs.sh).
Include /etc/nginx/modsecurity/generated/audit-log-path.conf
Include /etc/nginx/modsecurity/crs-setup.conf
# IHM overlay (id 1000900110, hors plage CRS) — seuil WafProfile après defaults statiques.
Include /etc/nginx/modsecurity/generated/crs-setup-generated.conf
# Virtual-patch packs (pre-CRS) — overlay toggles Include of bastion-virtual-patches.conf.
Include /etc/nginx/modsecurity/generated/bastion-virtual-patches-enabled.conf
Include /etc/modsecurity.d/owasp-crs/rules/*.conf
Include /etc/nginx/includes/waf-basic.conf
Include /etc/nginx/modsecurity/generated/bastion-exclusions-generated.conf
# Last: profile mode. Sync writes Off until Admin → WAF → Réactiver.
Include /etc/nginx/modsecurity/generated/engine-mode-generated.conf
