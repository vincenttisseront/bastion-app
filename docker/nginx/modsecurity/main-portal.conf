# Portal family — per-server overlay referenced by vhost_sso_portal.
# Engine mode ONLY: the CRS + shared settings come from main-common.conf, parsed
# once in nginx.conf http{}. Never Include main-common.conf / CRS rules here
# (duplicate rule ids → nginx -t emerg, and one more CRS copy per server{}).
Include /etc/nginx/modsecurity/engine-portal.conf
# Last: profile mode. Sync writes Off until Admin → WAF → Réactiver.
Include /etc/nginx/modsecurity/generated/engine-mode-generated.conf
