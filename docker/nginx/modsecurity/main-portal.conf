# Portal family — rules file referenced by vhost_sso_portal
Include /etc/nginx/modsecurity/engine-portal.conf
Include /etc/nginx/modsecurity/modsecurity.conf
Include /etc/nginx/modsecurity/crs-setup.conf
# Thresholds live in crs-setup.conf (900110). Do NOT Include crs-setup-generated.conf:
# a stale export with id:901110 collides with CRS REQUEST-901 → HTTP 500 on every
# ModSec-enabled request while /api/health (modsecurity off) stayed 200.
Include /etc/modsecurity.d/owasp-crs/rules/*.conf
Include /etc/nginx/includes/waf-basic.conf
Include /etc/nginx/modsecurity/generated/bastion-exclusions-generated.conf
# engine-mode-generated.conf NOT Included (DB WafProfile mode=on forced SecRuleEngine On
# and contributed to request-time 500 — 2026-08-06 emergency).
