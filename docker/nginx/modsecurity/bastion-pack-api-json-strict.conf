# Bastion ModSecurity virtual pack — API & JSON Strict.
#
# IDs 100096300–100096349. Pre-CRS via bastion-virtual-patches-enabled.conf.
# Single-line SecRules; deny,status:403; no bare "%" macros.

# 100096300 — Mongo-like / NoSQL operator injection in args or body.
SecRule ARGS|ARGS_NAMES|REQUEST_BODY "@rx (?i)\$(?:ne|gt|gte|lt|lte|in|nin|where|regex|exists)\b" "id:100096300,phase:2,deny,status:403,log,msg:'api_json_strict: NoSQL operator in request',tag:'api_json_strict',tag:'attack-injection',severity:2,t:none,t:urlDecodeUni"

# 100096301 — Content-Type application/json with multipart boundary (type confusion).
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^\s*application/json\b" "id:100096301,phase:1,deny,status:403,log,msg:'api_json_strict: JSON Content-Type with multipart boundary',tag:'api_json_strict',tag:'attack-protocol',severity:2,t:none,chain"
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)boundary=" "t:none"

# 100096302 — prototype pollution keys in JSON-ish payloads.
SecRule ARGS|REQUEST_BODY "@rx (?i)(?:__proto__|constructor\s*\[|\"constructor\"\s*:)" "id:100096302,phase:2,deny,status:403,log,msg:'api_json_strict: prototype pollution key',tag:'api_json_strict',tag:'attack-injection',severity:2,t:none,t:urlDecodeUni"
