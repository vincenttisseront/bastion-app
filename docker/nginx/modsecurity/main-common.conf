# Shared ModSecurity rule set — parsed ONCE, from nginx.conf http{}
# (modsecurity_rules_file). Every server{} / location{} inherits the compiled
# rules from http{} (ModSecurity-nginx merges by reference, no re-parse).
#
# Why: the connector parses a rules file for EACH server{} that declares it.
# With the CRS here in every vhost, ~25 vhosts meant ~25 CRS copies (~800 MB
# RSS) and nginx -t / reload added a full copy each → memcg OOM on reload.
#
# Never Include this file from a server{} / location{} (main-<family>.conf,
# snippets, vhosts): ModSecurity rejects the duplicate rule ids at merge time
# and nginx -t fails. Families only set SecRuleEngine in main-<family>.conf.
#
# Safe default for any server{} that turns the connector on without a family
# overlay. A child SecRuleEngine (main-<family>.conf, modsecurity_rules) wins
# over this one at merge time (libmodsecurity 3.0.16 / connector 1.0.4).
SecRuleEngine Off
Include /etc/nginx/modsecurity/modsecurity.conf
# Optional override when nginx-logs volume not writable (written by fix-nginx-logs.sh).
Include /etc/nginx/modsecurity/generated/audit-log-path.conf
Include /etc/nginx/modsecurity/crs-setup.conf
# IHM overlay (id 1000900110, hors plage CRS) — seuil WafProfile après defaults statiques.
Include /etc/nginx/modsecurity/generated/crs-setup-generated.conf
# Virtual-patch packs (pre-CRS) — overlay toggles Include of bastion-virtual-patches.conf.
Include /etc/nginx/modsecurity/generated/bastion-virtual-patches-enabled.conf
Include /etc/modsecurity.d/owasp-crs/rules/*.conf
Include /etc/nginx/includes/waf-basic.conf
Include /etc/nginx/modsecurity/generated/bastion-exclusions-generated.conf
