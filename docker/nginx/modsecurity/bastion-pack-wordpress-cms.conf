# Bastion ModSecurity virtual pack — WordPress / CMS Shield.
#
# Attack-surface detection only (no WYSIWYG / admin FP exclusions).
# IDs 100096200–100096249. Load via bastion-virtual-patches-enabled.conf (pre-CRS).
#
# Conventions: single-line SecRules; deny,status:403; no bare "%" macros;
# REQUEST_URI (pretty permalinks) rather than REQUEST_FILENAME.

# 100096200 — automated POST to wp-login.php / xmlrpc.php without Referer.
SecRule REQUEST_METHOD "@streq POST" "id:100096200,phase:2,deny,status:403,log,msg:'wordpress_cms: POST wp-login/xmlrpc without Referer',tag:'wordpress_cms',tag:'attack-brute',severity:2,t:none,chain"
SecRule REQUEST_URI "@rx (?i)/(wp-login\.php|xmlrpc\.php)([?/]|$)" "t:none,chain"
SecRule &REQUEST_HEADERS:Referer "@eq 0" "t:none"

# 100096201 — WP REST user enumeration / brute surface.
SecRule REQUEST_URI "@rx (?i)/wp-json/wp/v2/users(/|\?|$)" "id:100096201,phase:2,deny,status:403,log,msg:'wordpress_cms: WP REST user enumeration',tag:'wordpress_cms',tag:'attack-recon',severity:2,t:none"

# 100096202 — direct PHP execution under themes/plugins (mass scanners).
SecRule REQUEST_URI "@rx (?i)/wp-content/(themes|plugins)/[^/]+/.*\.php(\?|$)" "id:100096202,phase:2,deny,status:403,log,msg:'wordpress_cms: direct PHP under wp-content themes/plugins',tag:'wordpress_cms',tag:'attack-rce',severity:2,t:none"
