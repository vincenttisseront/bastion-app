# public_proxy family
Include /etc/nginx/modsecurity/engine-public.conf
Include /etc/nginx/modsecurity/modsecurity.conf
Include /etc/nginx/modsecurity/crs-setup.conf
Include /etc/nginx/modsecurity/generated/crs-setup-generated.conf
# PHP2Shell virtual patches (pre-CRS deny) — ids 100096180–100096199.
Include /etc/nginx/modsecurity/bastion-virtual-patches.conf
# INTENTIONAL: no engine-*-mode-generated overlay for public.
# Portal/subdomain arm via waf-engine-arm.json + generated overlays (Off until Réactiver).
# public_proxy has no public_armed path yet — SecRuleEngine stays Off from engine-public.conf
# even if modsecurity-public-switch turns the connector on. Do not enable CRS by default.
Include /etc/modsecurity.d/owasp-crs/rules/*.conf
Include /etc/nginx/includes/waf-basic.conf
Include /etc/nginx/modsecurity/generated/bastion-exclusions-generated.conf
