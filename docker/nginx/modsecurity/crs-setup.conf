# Bastion OWASP CRS setup — CRS 4.28 / paranoia 1 / anomaly thresholds 5/4.
# REQUEST-901 rule 901001 denies with HTTP 500 when tx.crs_setup_version is unset.
# DetectionOnly logs that deny without blocking; SecRuleEngine On enforced it on
# every ModSec-enabled request (2026-08-06 incident). See ops-modsecurity-crs.md.

SecDefaultAction "phase:1,log,auditlog,pass"
SecDefaultAction "phase:2,log,auditlog,pass"
SecDefaultAction "phase:3,log,auditlog,pass"
SecDefaultAction "phase:4,log,auditlog,pass"
SecDefaultAction "phase:5,log,auditlog,pass"

SecAction \
    "id:900000,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.blocking_paranoia_level=1"

SecAction \
    "id:900110,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.inbound_anomaly_score_threshold=5,\
    setvar:tx.outbound_anomaly_score_threshold=4"

SecAction \
    "id:900990,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    tag:'OWASP_CRS',\
    ver:'OWASP_CRS/4.28.0',\
    setvar:tx.crs_setup_version=4280"
