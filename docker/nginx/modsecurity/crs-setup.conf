# Bastion OWASP CRS setup — Phase A defaults (paranoia 1, anomaly thresholds 5/4).
# Full crs-setup defaults for allowed methods / content-types come from CRS rule 901
# when unset; we only pin the values required by the Phase A design.

SecAction \
    "id:900000,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.blocking_paranoia_level=1"

SecAction \
    "id:900110,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.inbound_anomaly_score_threshold=5,\
    setvar:tx.outbound_anomaly_score_threshold=4"
