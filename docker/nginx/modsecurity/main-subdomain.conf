# subdomain_proxy family — per-server overlay (snippets/modsecurity-subdomain.conf).
# Engine mode ONLY: the CRS + shared settings come from main-common.conf, parsed
# once in nginx.conf http{}. Never Include main-common.conf / CRS rules here
# (duplicate rule ids → nginx -t emerg, and one more CRS copy per vhost).
Include /etc/nginx/modsecurity/engine-subdomain.conf
# Last: subdomain overlay. Sync writes Off until Admin → WAF → Réactiver subdomain.
Include /etc/nginx/modsecurity/generated/engine-subdomain-mode-generated.conf
