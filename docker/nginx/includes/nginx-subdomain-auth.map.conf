# Prefer parent-location capture (set in location / before auth_request).
# Fall back to request-native vars when capture is missing/empty on the
# auth_request subrequest. Never `set $bastion_auth_* $http_cookie` at
# server{} — that rewrite re-runs on the subrequest and clears the values.
map $bastion_auth_host $bastion_x_original_host {
    default $bastion_auth_host;
    ""      $host;
}
map $bastion_auth_cookie $bastion_x_cookie {
    default $bastion_auth_cookie;
    ""      $http_cookie;
}
map $bastion_session_ck $bastion_x_session {
    default $bastion_session_ck;
    ""      $cookie_bastion_session;
}
