# Prefer literal per-vhost FQDN (set in generated server{} as $bastion_vhost_fqdn).
# That literal survives auth_request rewrite re-runs. Bare $host on the auth
# subrequest can yield an empty/wrong Host → FastAPI sees the docker upstream
# name → 401 no-app-for-host while portal still accepts bastion_session.
# Empty $bastion_vhost_fqdn (portal include) falls back to $host.
map $bastion_vhost_fqdn $bastion_auth_host {
    default $bastion_vhost_fqdn;
    ""      $host;
}

# Cookie for auth_request → FastAPI.
#
# Prefer request-native $http_cookie / $cookie_bastion_session. Optional
# $bastion_pass_* captures remain as overrides when set by generated vhosts.
#
# Do NOT rely on server-level `set $bastion_pass_cookie $http_cookie` alone:
# that set re-runs on the auth subrequest rewrite and can wipe a good capture
# (HAR ae=no-session:ck=72:x=0).
map $bastion_pass_cookie $bastion_auth_cookie {
    default $bastion_pass_cookie;
    ""      $http_cookie;
}
map $bastion_pass_session $bastion_auth_session {
    default $bastion_pass_session;
    ""      $cookie_bastion_session;
}

# Extract bastion_session even if Cookie was partially filtered (CrushAuth-only
# jar still loses this — then upstream filter must keep bastion_session).
map $http_cookie $bastion_session_from_jar {
    default "";
    "~*(?:^|;\\s*)bastion_session=([^;]+)" $1;
}
