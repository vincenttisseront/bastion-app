# Prefer literal per-vhost FQDN (set in generated server{} as $bastion_vhost_fqdn).
# That literal survives auth_request rewrite re-runs. Bare $host on the auth
# subrequest can yield an empty/wrong Host → FastAPI sees the docker upstream
# name → 401 no-app-for-host while portal still accepts bastion_session.
# Empty $bastion_vhost_fqdn (portal include) falls back to $host.
map $bastion_vhost_fqdn $bastion_auth_host {
    default $bastion_vhost_fqdn;
    ""      $host;
}

# Cookie for auth_request → FastAPI.
#
# Prefer $bastion_pass_* captured in location / before auth_request. That
# capture must NOT be re-assigned at server{} (server rewrite re-runs on the
# auth subrequest and wipes a good jar → HAR ae=no-session:ck=72:x=0).
# Fall back to request-native $http_cookie / $cookie_bastion_session when
# the parent capture was never set.
map $bastion_pass_cookie $bastion_auth_cookie {
    default $bastion_pass_cookie;
    ""      $http_cookie;
}
map $bastion_pass_session $bastion_auth_session {
    default $bastion_pass_session;
    ""      $cookie_bastion_session;
}

# Extract bastion_session from the PARENT capture first (survives filtered
# $http_cookie on the auth subrequest). Fall back to raw $http_cookie.
map $bastion_pass_cookie $bastion_session_from_pass {
    default "";
    "~*(?:^|;\\s*)bastion_session=([^;]+)" $1;
}
map $http_cookie $bastion_session_from_http {
    default "";
    "~*(?:^|;\\s*)bastion_session=([^;]+)" $1;
}
map $bastion_session_from_pass $bastion_session_from_jar {
    default $bastion_session_from_pass;
    ""      $bastion_session_from_http;
}
