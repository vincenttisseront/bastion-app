# Prefer literal per-vhost FQDN (set in generated server{} as $bastion_vhost_fqdn).
# That literal survives auth_request rewrite re-runs. Bare $host on the auth
# subrequest can yield an empty/wrong Host → FastAPI sees the docker upstream
# name → 401 no-app-for-host while portal still accepts bastion_session.
# Empty $bastion_vhost_fqdn (portal include) falls back to $host.
map $bastion_vhost_fqdn $bastion_auth_host {
    default $bastion_vhost_fqdn;
    ""      $host;
}

# Optional JWT extract from $http_cookie (diagnostics / future use).
# Do NOT map-pick into $bastion_pass_* — a map that reads $bastion_pass_* while
# location / does `set $bastion_pass_* $pick` is a circular dependency → nginx 500
# (HAR 2026-08-03 Transfer new-ui after #37).
map $http_cookie $bastion_fresh_session {
    default "";
    "~*(?:^|;\\s*)bastion_session=([^;]+)" $1;
}

# Session JWT extract from PARENT sticky capture ($bastion_pass_cookie).
# Do NOT fall back to $http_cookie — on the auth subrequest that value can be
# the CrushFTP-filtered jar (CrushAuth+currentAuth) after proxy_set_header
# Cookie inheritance → HAR ae=no-session:ck=72/90:x=0.
#
# Cookie + X-Bastion-Session-Cookie are set from $bastion_pass_* / rebuilt
# $bastion_auth_cookie captured in location / then handed to @bastion_auth_gate_*
# (see nginx_subdomain_export.py + subdomain_auth_common.conf).
map $bastion_pass_cookie $bastion_session_from_jar {
    default "";
    "~*(?:^|;\\s*)bastion_session=([^;]+)" $1;
}
