# Prefer literal per-vhost FQDN (set in generated server{} as $bastion_vhost_fqdn).
# That literal survives auth_request rewrite re-runs. Bare $host on the auth
# subrequest can yield an empty/wrong Host → FastAPI sees the docker upstream
# name → 401 no-app-for-host while portal still accepts bastion_session.
# Empty $bastion_vhost_fqdn (portal include) falls back to $host.
map $bastion_vhost_fqdn $bastion_auth_host {
    default $bastion_vhost_fqdn;
    ""      $host;
}

# Session JWT extract from PARENT capture ONLY ($bastion_pass_cookie).
# Do NOT fall back to $http_cookie — on the auth subrequest that value can be
# the CrushFTP-filtered jar (CrushAuth+currentAuth ≈ ck=72) after
# proxy_set_header Cookie inheritance, which also empties $cookie_bastion_session
# → HAR ae=no-session:ck=72:x=0.
#
# Cookie + X-Bastion-Session-Cookie are set from $bastion_pass_* / rebuilt
# $bastion_auth_cookie captured in location / (see nginx_subdomain_export.py +
# subdomain_auth_common.conf) — never via maps that re-read filtered headers.
map $bastion_pass_cookie $bastion_session_from_jar {
    default "";
    "~*(?:^|;\\s*)bastion_session=([^;]+)" $1;
}
