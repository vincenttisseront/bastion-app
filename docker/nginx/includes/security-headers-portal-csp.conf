# Portal-only CSP (included from sync-acme-tls.sh when family=portal).
# Not applied to subdomain/public_proxy FQDNs — upstream apps need their own policies.
#
# Pragmatic PL1: 'unsafe-inline' for script/style until admin templates use nonces.
# Fonts/CSS are local (/static) — no Google Fonts CDN.

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;
