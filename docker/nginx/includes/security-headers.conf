# Security headers for public edge (bastion-nginx :443 only — sync-acme-tls.sh).
# Do NOT also include on :8080 vhosts (F-09 duplicate add_header).
#
# Values: reverse01 passthrough (HSTS + nosniff) + historical portal AWX j2
# (XFO / Referrer / Permissions).
# Portal CSP: includes/security-headers-portal-csp.conf (family=portal only).

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
