# HTTP-01 challenge — included conceptually via sync-acme-tls.sh :80 server.
# Webroot default: /var/www/acme-challenge (shared volume with bastion-app).
# Keep this file as documentation + optional include target for custom vhosts.
location ^~ /.well-known/acme-challenge/ {
    root /var/www/acme-challenge;
    allow all;
    default_type text/plain;
}
