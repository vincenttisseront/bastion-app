# Prefer $remote_addr AFTER ngx_http_realip_module (see docker/nginx/nginx.conf).
# NEVER prefer $http_x_real_ip — a client can spoof X-Real-IP and the previous map
# would forward that spoof to FastAPI, defeating F-01 / F-04 LAN checks.
# Ops (awx-playbook / nginx host DMZ on vmdmz-reverse01) MUST set:
#   proxy_set_header X-Real-IP $remote_addr;
#   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# so the true client reaches this hop in XFF; this container then rewrites
# $remote_addr via real_ip and passes that single value as X-Real-IP to FastAPI.
map $remote_addr $portal_client_real_ip {
    default $remote_addr;
}
