# Resolve the end-user IP for FastAPI (F-01 / F-04 / anti-abuse).
#
# Prefer $remote_addr AFTER ngx_http_realip_module (see docker/nginx/nginx.conf).
# NEVER prefer $http_x_real_ip — clients can spoof X-Real-IP.
#
# Fallback: X-Portal-Client-IP is set by reverse01 (overwrite, not pass-through)
# and survives Traefik when entrypoint forwardedHeaders.trustedIPs is missing.
# Only used when real_ip left us on an infra hop (reverse01 / docker).
#
# Ops checklist (awx-playbook):
#   1. reverse01 vhost_portal_bastion:
#        proxy_set_header X-Real-IP $remote_addr;
#        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#        proxy_set_header X-Portal-Client-IP $remote_addr;
#   2. Traefik (docker_keycloak compose on docker01):
#        --entrypoints.websecure.forwardedHeaders.trustedIPs=172.24.0.108/32

map $remote_addr $portal_remote_is_infra {
    default                 0;
    172.24.0.108            1;
    ~^10\.5\.               1;
    ~^172\.17\.             1;
    ~^127\.                 1;
}

map "$portal_remote_is_infra:$http_x_portal_client_ip" $portal_client_real_ip {
    # real_ip already found a non-infra client
    default                      $remote_addr;
    # infra-only chain → prefer edge-overwritten portal header when present
    ~^1:(?<portal_ip>[0-9a-fA-F:.]+)$  $portal_ip;
}
