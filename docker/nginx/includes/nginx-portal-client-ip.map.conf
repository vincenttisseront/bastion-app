# Resolve the end-user IP for FastAPI (F-01 / F-04 / anti-abuse).
#
# Prefer $remote_addr AFTER ngx_http_realip_module (CF-Connecting-IP — see
# docker/nginx/nginx.conf + includes/cloudflare-ips.conf).
# NEVER prefer $http_x_real_ip — clients can spoof X-Real-IP.
#
# Fallback X-Portal-Client-IP: kept behind $bastion_portal_client_ip_fallback
# (default 1 = on) for rollback during reverse01→CF cutover. Set the map
# default to 0 after recette proves CF real_ip alone is enough.
# Do NOT delete this path yet — past break-glass resolved:null incidents.
#
# Traefik trustedIPs: not required for public bastion ingress
# (bastion_require_traefik=false; nginx:443 is the edge).

# Ops toggle: change default to 0 to disable X-Portal-Client-IP fallback.
map $host $bastion_portal_client_ip_fallback {
    default 1;
}

map $remote_addr $portal_remote_is_infra {
    default                 0;
    # docker / loopback only — reverse01 (172.24.0.108) no longer an edge hop
    ~^10\.5\.               1;
    ~^172\.17\.             1;
    ~^127\.                 1;
}

map "$bastion_portal_client_ip_fallback:$portal_remote_is_infra:$http_x_portal_client_ip" $portal_client_real_ip {
    # real_ip already found a non-infra client, or fallback disabled
    default                      $remote_addr;
    # fallback on + infra-only chain → prefer edge-overwritten portal header
    ~^1:1:(?<portal_ip>[0-9a-fA-F:.]+)$  $portal_ip;
}
