# Static branded error pages (docker/nginx/errors → /var/www/nginx-errors).
# Served by nginx itself, so they still work while bastion-app or an app
# upstream is down. Internal only: reached through error_page, never by URL.
# Files: <code>.html (browsers) / .json (API) / .txt (EAS, M2M) — regenerate
# with scripts/generate_nginx_error_pages.py.
location ^~ /__bastion_errors/ {
    internal;
    alias /var/www/nginx-errors/;
    auth_request off;
    modsecurity off;
    recursive_error_pages off;
    charset utf-8;
    charset_types text/html text/plain application/json;
    add_header Cache-Control "no-store" always;
}
