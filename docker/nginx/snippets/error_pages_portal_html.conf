# Portal HTML error pages (server{} and locations with their own error_page).
# 403/404/429/503 → FastAPI /errors/* (user locale, Admin → Branding), with a
# static fallback in /__portal_err/* when bastion-app is down. Gateway and
# request-level errors → static pages served by nginx itself: a 500 here is
# mostly auth_request failing because bastion-app is down, so retrying FastAPI
# for the page would only add a second DNS / connect timeout.
# 494–496 are listed one by one: nginx rewrites them to 400 before $status.
error_page 400 405 408 413 414 500 502 504 /__bastion_errors/$status.html;
error_page 494 /__bastion_errors/494.html;
error_page 495 /__bastion_errors/495.html;
error_page 496 /__bastion_errors/496.html;
error_page 403 = /__portal_err/403;
error_page 404 = /__portal_err/404;
error_page 429 = /__portal_err/429;
error_page 503 = /__portal_err/503;
