# Subdomain auth common — FastAPI via docker DNS
#
# Host: $bastion_auth_host (literal $bastion_vhost_fqdn from generated server{}).
#
# Cookie / session (HAR 2026-08-03 ae=no-session:ck=72:x=0):
# - proxy_pass_request_headers off so parent CrushFTP Cookie filters cannot win.
# - Rebuild Cookie with an explicit bastion_session= prefix so a leaked
#   CrushAuth-only parent Cookie still authenticates when $cookie_bastion_session
#   is visible on the subrequest.
# - X-Bastion-Session-Cookie: prefer $cookie_*, then regex extract from jar.
# CrushFTP apps must also keep upstream Cookie filter in @app_upstream_* and
# keep bastion_session inside that filter (auth inheritance safety net).
location = /internal/subdomain-auth {
    internal;
    auth_request off;

    proxy_pass http://$bastion_app_upstream/internal/subdomain-auth;
    proxy_pass_request_body off;
    proxy_pass_request_headers off;
    proxy_set_header Content-Length  "";
    proxy_set_header Host            $bastion_auth_host;
    proxy_set_header X-Original-URI  $request_uri;
    proxy_set_header X-Original-Host $bastion_auth_host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $bastion_forwarded_proto;
    # Prefix session so CrushAuth-only inherited Cookie still carries JWT.
    proxy_set_header Cookie          "bastion_session=$cookie_bastion_session; $bastion_auth_cookie";
    proxy_set_header X-Bastion-Session-Cookie $cookie_bastion_session;
    proxy_set_header X-Bastion-Session-From-Jar $bastion_session_from_jar;
    proxy_intercept_errors off;
}

include /etc/nginx/snippets/activesync_auth_common.conf;
