# Subdomain auth common — FastAPI via docker DNS
#
# Parent location / MUST set $bastion_auth_host / $bastion_auth_cookie /
# $bastion_session_ck before auth_request (see nginx_subdomain_export).
# Maps in nginx-subdomain-auth.map.conf fall back to $host / $http_cookie /
# $cookie_bastion_session when those customs are empty.
location = /internal/subdomain-auth {
    internal;
    auth_request off;

    proxy_pass http://$bastion_app_upstream/internal/subdomain-auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length  "";
    proxy_set_header Host            $bastion_x_original_host;
    proxy_set_header X-Original-URI  $request_uri;
    proxy_set_header X-Original-Host $bastion_x_original_host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $bastion_forwarded_proto;
    # Full jar for oauth2/break-glass + explicit native session (CrushFTP
    # upstream Cookie filter is only on location / proxy_pass, not here).
    proxy_set_header Cookie          $bastion_x_cookie;
    proxy_set_header X-Bastion-Session-Cookie $bastion_x_session;
    proxy_intercept_errors off;
}

include /etc/nginx/snippets/activesync_auth_common.conf;
