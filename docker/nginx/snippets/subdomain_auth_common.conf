# Subdomain auth common — FastAPI via docker DNS
location = /internal/subdomain-auth {
    internal;
    auth_request off;

    proxy_pass http://$bastion_app_upstream/internal/subdomain-auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length  "";
    proxy_set_header X-Original-URI  $request_uri;
    proxy_set_header X-Original-Host $host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $bastion_forwarded_proto;
    # Full jar for oauth2-proxy / break-glass; plus explicit native session so
    # CrushFTP location / Cookie filtering (CrushAuth-only upstream) cannot be
    # mistaken for auth_request losing bastion_session.
    proxy_set_header Cookie          $http_cookie;
    proxy_set_header X-Bastion-Session-Cookie $cookie_bastion_session;
    proxy_intercept_errors off;
}

include /etc/nginx/snippets/activesync_auth_common.conf;
