# Subdomain auth common — FastAPI via docker DNS
#
# Host: $bastion_auth_host (literal $bastion_vhost_fqdn from generated server{}).
#
# Cookie / session (HAR ck=72 → ck=90 → 404 → 500 → bare 401):
# - proxy_pass_request_headers off so parent CrushFTP Cookie filters cannot win.
# - Parent location / snapshots $bastion_pass_* then runs auth_request in the
#   SAME location (error_page 401 = @portal_redirect). Never return 418 → named
#   gate (nested error_page → bare nginx 401 HTML). No if{} / map pick cycle.
# - Use those vars DIRECTLY — never map-fallback to $http_cookie on the auth
#   subrequest (filtered CrushAuth jar → empty session headers).
# - Never re-set $bastion_pass_* at server{} (auth rewrite wipe).
# - CrushFTP Cookie filter stays in @app_upstream_* only (not with auth_request).
location = /internal/subdomain-auth {
    internal;
    auth_request off;
    modsecurity off;

    proxy_pass http://$bastion_app_upstream/internal/subdomain-auth;
    proxy_pass_request_body off;
    proxy_pass_request_headers off;
    # auth_request defaults to HTTP/1.0; force 1.1 so FastAPI/uvicorn identity
    # response headers (X-Auth-Request-Email, …) are reliably visible to
    # auth_request_set → proxy_set_header X-Forwarded-Email.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Content-Length  "";
    proxy_set_header Host            $bastion_auth_host;
    proxy_set_header X-Original-URI  $request_uri;
    proxy_set_header X-Original-Host $bastion_auth_host;
    # Same resolved client as portal (CF real_ip + X-Portal-Client-IP fallback).
    proxy_set_header X-Real-IP       $portal_client_real_ip;
    proxy_set_header X-Forwarded-For $portal_client_real_ip;
    proxy_set_header X-Portal-Client-IP $portal_client_real_ip;
    proxy_set_header X-Forwarded-Proto $bastion_forwarded_proto;
    proxy_set_header Cookie          $bastion_auth_cookie;
    proxy_set_header X-Bastion-Session-Cookie $bastion_pass_session;
    proxy_set_header X-Bastion-Session-From-Jar $bastion_session_from_jar;
    proxy_intercept_errors off;
}

include /etc/nginx/snippets/activesync_auth_common.conf;
