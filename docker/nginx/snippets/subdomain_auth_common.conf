# Subdomain auth common — FastAPI via docker DNS
# $bastion_auth_host / $bastion_auth_cookie / $bastion_session_ck MUST be set in
# the *parent* location (before auth_request), not at server{} level.
# server-level `set $x $http_cookie` is re-run on the auth subrequest and
# overwrites with empty values → 401 → portal login loop (HAR transfer).
location = /internal/subdomain-auth {
    internal;
    auth_request off;

    proxy_pass http://$bastion_app_upstream/internal/subdomain-auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length  "";
    proxy_set_header X-Original-URI  $request_uri;
    proxy_set_header X-Original-Host $bastion_auth_host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $bastion_forwarded_proto;
    # Parent-captured jar + explicit native session (CrushFTP filters Cookie
    # toward upstream only; auth_request must not use that rewrite).
    proxy_set_header Cookie          $bastion_auth_cookie;
    proxy_set_header X-Bastion-Session-Cookie $bastion_session_ck;
    proxy_intercept_errors off;
}

include /etc/nginx/snippets/activesync_auth_common.conf;
