# Subdomain auth common — FastAPI via docker DNS
#
# CRITICAL: use request-native vars ($host / $http_cookie / $cookie_*) here.
# Do NOT rely on custom $bastion_auth_* captured in the parent location.
# auth_request subrequests re-run server{} rewrite; parent-captured customs
# are often empty → empty X-Original-Host → Host falls back to docker upstream
# → FastAPI "no-app-for-host" 401 → portal login bounce loop (HAR transfer).
# Named $cookie_bastion_session is parsed from the original client Cookie.
location = /internal/subdomain-auth {
    internal;
    auth_request off;

    proxy_pass http://$bastion_app_upstream/internal/subdomain-auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length  "";
    proxy_set_header Host            $host;
    proxy_set_header X-Original-URI  $request_uri;
    proxy_set_header X-Original-Host $host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $bastion_forwarded_proto;
    # Full jar for oauth2/break-glass + explicit native session (CrushFTP
    # upstream Cookie filter is only on location / proxy_pass, not here).
    proxy_set_header Cookie          $http_cookie;
    proxy_set_header X-Bastion-Session-Cookie $cookie_bastion_session;
    proxy_intercept_errors off;
}

include /etc/nginx/snippets/activesync_auth_common.conf;
