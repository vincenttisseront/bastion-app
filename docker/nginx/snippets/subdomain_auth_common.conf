# Subdomain auth common — FastAPI via docker DNS
#
# Portal-parity: use request-native vars ($host / $http_cookie /
# $cookie_bastion_session) like portal_auth_check. Do NOT re-set these from
# $http_* in the parent location before auth_request — rewrite can re-run on
# the subrequest and clear Cookie/Host (HAR: transfer 401 → bastion_sub=/apps
# while the same bastion_session is valid on portal).
location = /internal/subdomain-auth {
    internal;
    auth_request off;

    proxy_pass http://$bastion_app_upstream/internal/subdomain-auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length  "";
    proxy_set_header Host            $host;
    proxy_set_header X-Original-URI  $request_uri;
    proxy_set_header X-Original-Host $host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $bastion_forwarded_proto;
    # Full jar for oauth2/break-glass + explicit native session (CrushFTP
    # upstream Cookie filter is only on location / proxy_pass, not here).
    proxy_set_header Cookie          $http_cookie;
    proxy_set_header X-Bastion-Session-Cookie $cookie_bastion_session;
    proxy_intercept_errors off;
}

include /etc/nginx/snippets/activesync_auth_common.conf;
