# Subdomain auth common — FastAPI via docker DNS
#
# Host: $bastion_auth_host (literal $bastion_vhost_fqdn from generated server{}).
# Cookie: $bastion_auth_cookie / $bastion_auth_session — parent location / MUST
# set $bastion_pass_* from $http_cookie BEFORE auth_request (subrequest $http_cookie
# is often empty → ae=no-session while portal accepts the same bastion_session).
location = /internal/subdomain-auth {
    internal;
    auth_request off;

    proxy_pass http://$bastion_app_upstream/internal/subdomain-auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length  "";
    proxy_set_header Host            $bastion_auth_host;
    proxy_set_header X-Original-URI  $request_uri;
    proxy_set_header X-Original-Host $bastion_auth_host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $bastion_forwarded_proto;
    # Captured in parent location / (CrushFTP upstream Cookie filter is only on
    # location / proxy_pass after auth succeeds — not here).
    proxy_set_header Cookie          $bastion_auth_cookie;
    proxy_set_header X-Bastion-Session-Cookie $bastion_auth_session;
    proxy_intercept_errors off;
}

include /etc/nginx/snippets/activesync_auth_common.conf;
