# Subdomain auth common — FastAPI via docker DNS
#
# Host / X-Original-Host MUST be the public vhost FQDN (transfer.ar-systems.fr),
# not the docker upstream. Use $bastion_auth_host (map → literal $bastion_vhost_fqdn
# set in generated server{}, else $host). Cookie stays request-native.
location = /internal/subdomain-auth {
    internal;
    auth_request off;

    proxy_pass http://$bastion_app_upstream/internal/subdomain-auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length  "";
    proxy_set_header Host            $bastion_auth_host;
    proxy_set_header X-Original-URI  $request_uri;
    proxy_set_header X-Original-Host $bastion_auth_host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $bastion_forwarded_proto;
    # Full jar for oauth2/break-glass + explicit native session (CrushFTP
    # upstream Cookie filter is only on location / proxy_pass, not here).
    proxy_set_header Cookie          $http_cookie;
    proxy_set_header X-Bastion-Session-Cookie $cookie_bastion_session;
    proxy_intercept_errors off;
}

include /etc/nginx/snippets/activesync_auth_common.conf;
