# Subdomain auth common — FastAPI via docker DNS
# Capture client Cookie/Host at server rewrite time (see nginx_subdomain_export /
# vhost templates: set $bastion_auth_*). Auth subrequest must not depend on
# location / proxy_set_header Cookie (CrushFTP CrushAuth-only rewrite).
location = /internal/subdomain-auth {
    internal;
    auth_request off;

    proxy_pass http://$bastion_app_upstream/internal/subdomain-auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length  "";
    proxy_set_header X-Original-URI  $request_uri;
    proxy_set_header X-Original-Host $bastion_auth_host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $bastion_forwarded_proto;
    # Full jar for oauth2-proxy / break-glass; plus explicit native session so
    # CrushFTP location / Cookie filtering cannot starve auth_request.
    proxy_set_header Cookie          $bastion_auth_cookie;
    proxy_set_header X-Bastion-Session-Cookie $bastion_session_ck;
    proxy_intercept_errors off;
}

include /etc/nginx/snippets/activesync_auth_common.conf;
