# Subdomain auth common — FastAPI via docker DNS
#
# Host: $bastion_auth_host (literal $bastion_vhost_fqdn from generated server{}).
# Cookie: $bastion_auth_cookie / $bastion_auth_session — server{} / location MUST
# set $bastion_pass_* from client $http_cookie BEFORE auth_request.
#
# CRITICAL: proxy_pass_request_headers off — defense in depth. CrushFTP apps must
# also keep the Cookie filter in @app_upstream_* (not the same location / as
# auth_request); otherwise parent proxy_set_header Cookie "CrushAuth=…" is
# inherited → FastAPI sees ck=72 / x=0 while the browser still sends bastion_session
# (HAR 2026-08-03).
location = /internal/subdomain-auth {
    internal;
    auth_request off;

    proxy_pass http://$bastion_app_upstream/internal/subdomain-auth;
    proxy_pass_request_body off;
    proxy_pass_request_headers off;
    proxy_set_header Content-Length  "";
    proxy_set_header Host            $bastion_auth_host;
    proxy_set_header X-Original-URI  $request_uri;
    proxy_set_header X-Original-Host $bastion_auth_host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $bastion_forwarded_proto;
    proxy_set_header Cookie          $bastion_auth_cookie;
    proxy_set_header X-Bastion-Session-Cookie $bastion_auth_session;
    proxy_intercept_errors off;
}

include /etc/nginx/snippets/activesync_auth_common.conf;
