# Placeholder — overwritten at container start by envsubst from
# templates/nginx-portal-core-realm-oauth2.conf.template
# (SSO_PORTAL_DEFAULT_REALM_SLUG). Keep this file so image builds that
# COPY snippets/ still have a path for include before first render.
location ~ ^/oauth2/default/(.*)$ {
    proxy_pass http://$oauth2_core_upstream/oauth2/$1$is_args$args;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_buffer_size 128k;
    proxy_buffers 8 128k;
    proxy_busy_buffers_size 256k;
    proxy_read_timeout 120s;
    # oauth2-proxy error pages (callback CSRF / state 403, 500…) → portal pages.
    proxy_intercept_errors on;
}
