# Terminaison TLS côté nginx host DMZ — le conteneur reçoit HTTP (via Traefik) mais propage HTTPS.
# Both headers must carry the SAME resolved client IP (after real_ip / X-Portal-Client-IP map).
# Never $http_x_real_ip (spoofable). Never $proxy_add_x_forwarded_for here — that would
# re-append untrusted client-supplied hops; pass the single resolved value only.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $portal_client_real_ip;
proxy_set_header X-Forwarded-For $portal_client_real_ip;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Ssl on;
proxy_set_header X-Forwarded-Port 443;
proxy_set_header X-Forwarded-Host $host;
# Preserve browser UA for sessions diagnostics (some middlewares strip it)
proxy_set_header User-Agent $http_user_agent;
proxy_set_header X-Original-User-Agent $http_user_agent;
