# Terminaison TLS côté nginx host DMZ — le conteneur reçoit HTTP mais propage HTTPS.
# X-Real-IP: conserver la valeur edge (reverse01) si présente ; sinon peer Traefik.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $portal_client_real_ip;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Ssl on;
proxy_set_header X-Forwarded-Port 443;
proxy_set_header X-Forwarded-Host $host;
