# Terminaison TLS côté nginx host DMZ — le conteneur reçoit HTTP mais propage HTTPS.
# X-Real-IP = $remote_addr AFTER real_ip (true client). Never $http_x_real_ip (spoofable).
proxy_set_header Host $host;
proxy_set_header X-Real-IP $portal_client_real_ip;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Ssl on;
proxy_set_header X-Forwarded-Port 443;
proxy_set_header X-Forwarded-Host $host;
# Preserve browser UA for sessions diagnostics (some middlewares strip it)
proxy_set_header User-Agent $http_user_agent;
proxy_set_header X-Original-User-Agent $http_user_agent;
