# Simplified error pages for bastion container (no public branded gateway).
proxy_intercept_errors on;
error_page 502 503 504 /50x.html;

location = /50x.html {
    root /var/www/nginx-errors;
    internal;
}

location ^~ /nginx-errors/ {
    alias /var/www/nginx-errors/;
    expires 1h;
    access_log off;
}
