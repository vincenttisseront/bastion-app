# Portal (:8080) error pages — included once at server{} level of the portal vhost.
#
# - nginx-generated errors only: upstream answers (FastAPI branded pages, JSON
#   API errors, oauth2-proxy is the exception — see its locations) pass through
#   untouched. Intercepting FastAPI's own 403/404/429/500/503 re-entered
#   error_page with recursive_error_pages off → bare "nginx" pages.
# - recursive_error_pages on: /__portal_err/* (FastAPI, locale + branding) can
#   still fall back to the static page when bastion-app itself is down.
# - Locations that set their own error_page (401 → sign-in) do not inherit this
#   list: they include error_pages_portal_html.conf / bastion_error_pages_json.conf.
proxy_intercept_errors off;
recursive_error_pages on;
include /etc/nginx/snippets/error_pages_portal_html.conf;
include /etc/nginx/snippets/bastion_error_pages_location.conf;
