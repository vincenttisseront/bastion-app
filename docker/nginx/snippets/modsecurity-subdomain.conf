# subdomain_proxy — ModSecurity wiring (connector switch + family engine mode).
# Connector: includes/modsecurity-subdomain-switch.conf (default off; export may set on).
# main-subdomain.conf only sets SecRuleEngine: the CRS is parsed once in nginx.conf
# http{} (modsecurity/main-common.conf) and inherited by every vhost.
include /etc/nginx/includes/modsecurity-subdomain-switch.conf;
modsecurity_rules_file /etc/nginx/modsecurity/main-subdomain.conf;
