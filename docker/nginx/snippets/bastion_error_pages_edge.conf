# TLS edge (:80 / :443 servers from sync-acme-tls.sh) — errors nginx raises
# before :8080 (header / body too large, plain HTTP on :443, :8080 unreachable).
# Responses proxied from :8080 pass through untouched.
proxy_intercept_errors off;
include /etc/nginx/snippets/bastion_error_pages_html.conf;
# Plain HTTP sent to the HTTPS port → same URL over HTTPS (like :80).
error_page 497 =301 https://$host$request_uri;
include /etc/nginx/snippets/bastion_error_pages_location.conf;
