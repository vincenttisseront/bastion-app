# TLS edge (:80 / :443 servers from sync-acme-tls.sh) — errors nginx raises
# before :8080 (header / body too large, plain HTTP on :443, :8080 unreachable).
# Responses proxied from :8080 pass through untouched.
proxy_intercept_errors off;
include /etc/nginx/snippets/bastion_error_pages_html.conf;
# Plain HTTP sent to the HTTPS port → same URL over HTTPS (like :80).
error_page 497 =301 https://$host$request_uri;

# Own copy of bastion_error_pages_location.conf: an add_header in a location
# drops every server-level one, so the edge security headers are re-included.
location ^~ /__bastion_errors/ {
    internal;
    alias /var/www/nginx-errors/;
    auth_request off;
    modsecurity off;
    recursive_error_pages off;
    charset utf-8;
    charset_types text/html text/plain application/json;
    include /etc/nginx/includes/security-headers.conf;
    add_header Cache-Control "no-store" always;
}
