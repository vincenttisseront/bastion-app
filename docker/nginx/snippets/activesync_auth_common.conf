# ActiveSync / Autodiscover auth_request — Basic or SSO cookie, never oauth2 HTML redirect.
# Same Host/Cookie contract as subdomain_auth_common.conf (no header inheritance).
# Cookie/$bastion_pass_session captured in parent location BEFORE auth_request.
location = /internal/activesync-auth {
    internal;
    auth_request off;
    modsecurity off;

    proxy_pass http://$bastion_app_upstream/internal/activesync-auth;
    proxy_pass_request_body off;
    proxy_pass_request_headers off;
    proxy_set_header Content-Length  "";
    proxy_set_header Host            $bastion_auth_host;
    proxy_set_header X-Original-URI  $request_uri;
    # auth_request is always a GET: without this the handler cannot tell an
    # OPTIONS protocol negotiation (no DeviceId) from a real sync command.
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-Host $bastion_auth_host;
    # Same resolved client as portal (CF real_ip + X-Portal-Client-IP fallback).
    # Raw $remote_addr on :8080 is often 127.0.0.1 → FastAPI fail-closed → empty audit IP.
    proxy_set_header X-Real-IP       $portal_client_real_ip;
    proxy_set_header X-Forwarded-For $portal_client_real_ip;
    proxy_set_header X-Portal-Client-IP $portal_client_real_ip;
    proxy_set_header X-Forwarded-Proto $bastion_forwarded_proto;
    proxy_set_header Cookie          $bastion_auth_cookie;
    proxy_set_header X-Bastion-Session-Cookie $bastion_pass_session;
    proxy_set_header X-Bastion-Session-From-Jar $bastion_session_from_jar;
    proxy_set_header Authorization   $http_authorization;
    proxy_set_header User-Agent      $http_user_agent;
    proxy_intercept_errors off;
}
