worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Docker embedded DNS — résolution dynamique des alias vpcbr (bastion-app, …)
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format portal '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'rt=$request_time';

    # Rate zones (required by portal vhost)
    limit_req_zone $binary_remote_addr zone=portal_login:10m rate=3r/s;
    limit_req_zone $binary_remote_addr zone=portal_api:10m rate=30r/s;

    # Restore original client IP from X-Forwarded-For (reverse01 → Traefik → us).
    # Without this, $remote_addr is always Traefik (172.24.0.x) and sessions show that.
    set_real_ip_from 10.5.0.0/16;
    set_real_ip_from 172.24.0.0/16;
    set_real_ip_from 172.17.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Break-glass auth source map
    include /etc/nginx/includes/nginx-portal-breakglass.map.conf;

    # Preserve edge client IP across Traefik → nginx → FastAPI
    include /etc/nginx/includes/nginx-portal-client-ip.map.conf;

    # Stub for error_pages (no WAF maps in container)
    map $remote_addr $gateway_error_page {
        default /50x.html;
    }

    include /etc/nginx/conf.d/*.conf;
}
