worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Docker embedded DNS — résolution dynamique des alias vpcbr (bastion-app, …)
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format portal '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'rt=$request_time';

    # Per-app vhosts (subdomain_proxy / public_proxy) — one file per slug under apps/
    log_format app '$remote_addr - $remote_user [$time_local] '
                   'host=$host '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" '
                   'rt=$request_time '
                   'upstream=$upstream_addr us=$upstream_status ut=$upstream_response_time';

    # Rate zones (required by portal vhost)
    limit_req_zone $binary_remote_addr zone=portal_login:10m rate=3r/s;
    limit_req_zone $binary_remote_addr zone=portal_api:10m rate=30r/s;

    # Restore original client IP from X-Forwarded-For set by the DMZ edge.
    # Trust only known upstream hops (not the whole Internet).
    #
    # Topology (Phase 7) — NOT reverse01 → 127.0.0.1:nginx-bastion:
    #   client → reverse01:443 (172.24.0.108)
    #         → Traefik docker01:443 (vpcbr, peer seen here ≈ 10.5.0.x)
    #         → nginx-bastion:8080
    #         → bastion-app (peer 10.5.0.8 in app logs = this hop, correct)
    #
    # real_ip only rewrites when the TCP peer is in set_real_ip_from. The peer
    # of THIS nginx is Traefik (10.5/16), not reverse01 — so 10.5.0.0/16 is
    # required. reverse01/32 is kept so a direct edge path still works.
    # Do NOT use 0.0.0.0/0 or the whole corp 172.24.0.0/16.
    #
    # Both hops MUST preserve the client (neither alone is enough):
    #   1. reverse01 vhost_portal_bastion (awx-playbook):
    #        proxy_set_header X-Real-IP $remote_addr;
    #        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #        proxy_set_header X-Portal-Client-IP $remote_addr;
    #   2. Traefik (docker_keycloak on docker01):
    #        --entrypoints.websecure.forwardedHeaders.trustedIPs=172.24.0.108/32
    # Without (2), XFF arrives as only 172.24.0.108 → $remote_addr stays reverse01
    # → FastAPI fail-closes with resolved=null (break-glass denied for everyone).
    set_real_ip_from 172.24.0.108;
    set_real_ip_from 10.5.0.0/16;
    set_real_ip_from 172.17.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Break-glass auth source map
    include /etc/nginx/includes/nginx-portal-breakglass.map.conf;

    # X-Real-IP to FastAPI = $remote_addr after real_ip (never client-spoofable header)
    include /etc/nginx/includes/nginx-portal-client-ip.map.conf;

    # Stub for error_pages (no WAF maps in container)
    map $remote_addr $gateway_error_page {
        default /50x.html;
    }

    include /etc/nginx/conf.d/*.conf;
}
