worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    # Many proxy_set_header across portal + apps → avoid hash warnings / emerg noise
    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;

    # Docker embedded DNS — résolution dynamique des alias vpcbr (bastion-app, …)
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format portal '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'rt=$request_time';

    # Per-app vhosts (subdomain_proxy / public_proxy) — one file per slug under apps/
    log_format app '$remote_addr - $remote_user [$time_local] '
                   'host=$host '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" '
                   'rt=$request_time '
                   'upstream=$upstream_addr us=$upstream_status ut=$upstream_response_time '
                   'auth_err=$bastion_auth_err';

    # Edge nginx terminates TLS on :443 then proxies to :8080. Preserve client scheme
    # for upstreams (Keycloak issuer URL, redirects). Default https when header absent.
    map $http_x_forwarded_proto $bastion_forwarded_proto {
        default $http_x_forwarded_proto;
        ""      https;
    }
    map $http_x_forwarded_port $bastion_forwarded_port {
        default $http_x_forwarded_port;
        ""      443;
    }
    # WebSocket upgrade (Teleport terminal, etc.) — never forward raw $http_connection.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # Rate zones (required by portal vhost)
    limit_req_zone $binary_remote_addr zone=portal_login:10m rate=3r/s;
    limit_req_zone $binary_remote_addr zone=portal_api:10m rate=30r/s;

    # Restore original client IP from X-Forwarded-For set by the DMZ edge.
    # Trust only known upstream hops (not the whole Internet).
    #
    # Topology (Phase 7) — nginx edge TLS (Traefik optionnel / coupé) :
    #   client → [reverse01?] → bastion-nginx:443 (ACME)
    #         → :8080 (portal / apps)
    #         → bastion-app
    #
    # real_ip only rewrites when the TCP peer is in set_real_ip_from.
    # reverse01/32 kept when edge DMZ still proxies; 10.5/16 for vpcbr peers.
    # Do NOT use 0.0.0.0/0 or the whole corp 172.24.0.0/16.
    #
    # When clients hit nginx:443 directly, $remote_addr is already the client
    # (no XFF rewrite needed). When reverse01 still fronts HTTPS:
    #   reverse01 must set X-Forwarded-For / X-Real-IP.
    set_real_ip_from 172.24.0.108;
    set_real_ip_from 10.5.0.0/16;
    set_real_ip_from 172.17.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Break-glass auth source map
    include /etc/nginx/includes/nginx-portal-breakglass.map.conf;

    # X-Real-IP to FastAPI = $remote_addr after real_ip (never client-spoofable header)
    include /etc/nginx/includes/nginx-portal-client-ip.map.conf;

    # Subdomain auth_request maps (legacy stub — snippets use $host/$http_cookie)
    include /etc/nginx/includes/nginx-subdomain-auth.map.conf;

    # Stub for error_pages (no WAF maps in container)
    map $remote_addr $gateway_error_page {
        default /50x.html;
    }

    include /etc/nginx/conf.d/*.conf;
}
