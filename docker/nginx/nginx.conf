# ModSecurity nginx connector (provided by owasp/modsecurity-crs base image).
load_module /usr/lib/nginx/modules/ngx_http_modsecurity_module.so;

# Cap workers (compose cpus: 1.0). Workers share the master's parsed config
# (copy-on-write); the CRS itself is parsed once in http{} below.
worker_processes 2;
# After a reload, old workers serving long connections (WebSocket, proxy_read_timeout
# 3600s) keep their whole config generation alive. Without a bound, two reloads
# close together stacked 3+ generations and hit mem_limit (memcg OOM → container
# restart → every vhost down). Long transfers are cut 30s after a reload.
worker_shutdown_timeout 30s;
# Portal + auth_request + many app vhosts need far more than the default 1024 FDs.
# Without this, accept4() fails with errno 24 and clients see bare nginx 403/502.
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    # Many proxy_set_header across portal + apps → avoid hash warnings / emerg noise
    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;
    # Portal + ModSec + auth_request maps — avoid variables_hash warnings under load
    variables_hash_max_size 2048;
    variables_hash_bucket_size 128;

    # Docker embedded DNS — résolution dynamique des alias vpcbr (bastion-app, …)
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format portal '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'rt=$request_time';

    # Per-app vhosts (subdomain_proxy / public_proxy) — one file per slug under apps/
    # Keep trailing kv in sync with app/web/nginx_app_logs.py (_KV_ALIASES / parser).
    # auth_* vars are set empty at server{} then overwritten by auth_request_set.
    # $bastion_log_user = SSO email (or preferred) when gated; else nginx $remote_user.
    log_format app '$remote_addr - $bastion_log_user [$time_local] '
                   'host=$host '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" '
                   'rt=$request_time '
                   'uct=$upstream_connect_time uht=$upstream_header_time '
                   'ut=$upstream_response_time '
                   'upstream=$upstream_addr us=$upstream_status '
                   'req_len=$request_length '
                   'xff="$http_x_forwarded_for" '
                   'xpci=$http_x_portal_client_ip '
                   'proto=$bastion_forwarded_proto '
                   'rid=$http_x_request_id '
                   'auth_err=$bastion_auth_err '
                   'auth_email=$auth_email '
                   'auth_user=$auth_user '
                   'auth_app=$auth_app '
                   'auth_src=$auth_source '
                   'auth_pref=$auth_preferred';

    # Edge nginx terminates TLS on :443 then proxies to :8080. Preserve client scheme
    # for upstreams (Keycloak issuer URL, redirects). Default https when header absent.
    map $http_x_forwarded_proto $bastion_forwarded_proto {
        default $http_x_forwarded_proto;
        ""      https;
    }
    map $http_x_forwarded_port $bastion_forwarded_port {
        default $http_x_forwarded_port;
        ""      443;
    }

    # Backend identity for trusted-header apps (Zabbix HTTP auth, Authelia-style, …).
    # Prefer SSO email; fall back to preferred_username when the IdP omits email.
    # Evaluated after auth_request_set on subdomain_proxy vhosts.
    map $auth_email $bastion_remote_user {
        default $auth_email;
        ""      $auth_preferred;
    }
    # Access-log user column: SSO identity instead of nginx $remote_user ("-" for cookie SSO).
    map $bastion_remote_user $bastion_log_user {
        default $bastion_remote_user;
        ""      $remote_user;
    }
    # WebSocket upgrade (Teleport terminal, etc.) — never forward raw $http_connection.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # Rate zones — defaults in includes/; WAF export may overwrite via sync
    include /etc/nginx/includes/nginx-portal-rate-limits.conf;

    # Client IP after Cloudflare (orange cloud) → bastion-nginx:443.
    # Former host-edge IPs must not be trusted as real_ip (spoof risk).
    # Traefik is out of the public bastion ingress path (bastion_require_traefik=false).
    #
    # Topology:
    #   client → Cloudflare → bastion-nginx:443 (ACME) → :8080 → bastion-app
    #
    # The :443 → :8080 hop comes from 127.0.0.1 (trusted below), so every :443
    # server in sync-acme-tls.sh MUST overwrite CF-Connecting-IP with its own
    # $remote_addr — otherwise a client reaching the origin directly chooses
    # $remote_addr on :8080 (allow 10/8 on /breakglass, limit_req, bans).
    #
    include /etc/nginx/includes/cloudflare-ips.conf;
    set_real_ip_from 10.5.0.0/16;
    set_real_ip_from 172.17.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Network ACLs (WAF export) — allow trust perimeter before deny bans.
    # Evaluated in http{} before per-server ModSecurity (early reject / save CPU).
    include /etc/nginx/includes/waf-ip-allow.conf;
    include /etc/nginx/includes/waf-ip-deny.conf;

    # Portal realm: auth_request X-Auth-Request-Realm, else legacy portal_realm_slug cookie
    include /etc/nginx/includes/nginx-portal-realm.map.conf;

    # X-Real-IP to FastAPI = $remote_addr after real_ip (+ optional portal fallback)
    include /etc/nginx/includes/nginx-portal-client-ip.map.conf;

    # Subdomain auth_request maps (legacy stub — snippets use $host/$http_cookie)
    include /etc/nginx/includes/nginx-subdomain-auth.map.conf;

    # error_pages map.
    map $remote_addr $gateway_error_page {
        default /50x.html;
    }

    # ModSecurity rules (CRS + shared settings + virtual patches + exclusions) are
    # parsed ONCE here and inherited by every server{} / location{}. The connector
    # stays off in http{}: it is switched per server in conf.d (includes/
    # modsecurity-*-switch.conf), and each family only sets SecRuleEngine through
    # a tiny modsecurity/main-<family>.conf. Never re-declare main-common.conf (or
    # the CRS) in a server{}: duplicate rule ids fail nginx -t, and every extra
    # declaration is one more full CRS copy (~35 MB each; ×26 server{} was
    # ~900 MB per config generation → memcg OOM on reload).
    modsecurity_rules_file /etc/nginx/modsecurity/main-common.conf;

    include /etc/nginx/conf.d/*.conf;
}
