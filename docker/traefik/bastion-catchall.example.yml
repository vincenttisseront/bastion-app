# Traefik file-provider example — catch-all → bastion-nginx:8080
#
# After bastion-nginx owns Host routing (portal + infra proxies + App DB exports),
# point Traefik at this file (or equivalent). reverse01 may stay a TLS passthrough
# until removed; discovery + approval live on bastion-nginx, not on the edge.
#
# Example (docker01 Traefik static config):
#   providers:
#     file:
#       filename: /etc/traefik/dynamic/bastion-catchall.yml
#
# Cutover checklist:
#   1. Deploy bastion with bastion_infra_proxy_vhosts (Keycloak, …)
#   2. Load this dynamic config / recreate Traefik (required for unknown Host discovery)
#   3. Disable legacy Keycloak Traefik labels (Host rules)
#   4. Smoke: portal, keycloak, one subdomain_proxy, one public_proxy
#   5. Hit an unknown FQDN → Admin → Domaines découverts → Approuver

http:
  routers:
    bastion-catchall:
      entryPoints:
        - websecure
      rule: "PathPrefix(`/`)"
      priority: 1
      service: bastion-nginx
      tls: {}
    # Higher-priority Host routers for non-bastion services can still exist
    # until migrated; once migrated, delete them so priority 1 catch-all wins.

  services:
    bastion-nginx:
      loadBalancer:
        servers:
          - url: "http://bastion-nginx:8080"
