<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Modal password open harness</title>
  <meta name="csrf-token" content="test-csrf">
  <link rel="stylesheet" href="/static/css/bastion.css">
</head>
<body>
  <button
    type="button"
    class="admin-card app-tile"
    id="tile-grommunio"
    data-app-id="1"
    data-app-slug="grommunio"
    data-credential-mode="identite_utilisateur"
    data-app-label="Grommunio"
    data-open-with-identity
    data-open-identity-url="/api/apps/grommunio/open-with-identity"
  >
    Grommunio
  </button>

  <div id="bastion-modal" class="bastion-modal" hidden aria-hidden="true">
    <div class="bastion-modal-backdrop" data-bastion-modal-dismiss></div>
    <div class="bastion-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="bastion-modal-title" tabindex="-1">
      <div class="bastion-modal-header">
        <h2 id="bastion-modal-title" class="bastion-modal-title">Confirmation</h2>
      </div>
      <div class="bastion-modal-body">
        <div id="bastion-modal-message" class="bastion-modal-message"></div>
        <div id="bastion-modal-extra" class="bastion-modal-extra" hidden></div>
      </div>
      <div class="bastion-modal-footer">
        <button type="button" class="btn btn-ghost" id="bastion-modal-cancel" data-bastion-modal-dismiss>Annuler</button>
        <button type="button" class="btn btn-secondary" id="bastion-modal-confirm">Confirmer</button>
      </div>
    </div>
  </div>

  <script src="/static/js/bastion-modal.js?v=20260721-identity-open"></script>
  <script>
  (function () {
    var identityUsername = 'vincent.tisseront@ar-systems.fr';

    function csrfToken() {
      var meta = document.querySelector('meta[name="csrf-token"]');
      return (meta && meta.content) || '';
    }

    async function postOpenWithIdentity(endpoint, password) {
      var resp = await fetch(endpoint, {
        method: 'POST',
        credentials: 'same-origin',
        headers: {
          'Content-Type': 'application/json',
          Accept: 'application/json',
          'X-CSRF-Token': csrfToken(),
        },
        body: JSON.stringify({ password: password }),
      });
      if (resp.ok) {
        var data = await resp.json();
        if (data && data.ok && data.target_url) {
          return { ok: true, targetUrl: data.target_url };
        }
        return { ok: false, error: 'Réponse serveur invalide.' };
      }
      var payload = {};
      try { payload = await resp.json(); } catch (_) {}
      return { ok: false, error: payload.message || 'fail' };
    }

    async function openWithIdentity(tile) {
      var endpoint = tile.getAttribute('data-open-identity-url');
      var lastError = '';
      while (true) {
        var prompt = await window.bastionPasswordPrompt({
          title: 'Ouvrir Grommunio',
          message: 'Saisissez votre mot de passe pour établir la session applicative.',
          username: identityUsername,
          confirmLabel: 'Ouvrir',
          error: lastError,
        });
        if (!prompt || !prompt.ok) return;
        var password = prompt.password || '';
        if (!password) {
          lastError = 'Mot de passe requis.';
          continue;
        }
        var outcome = await postOpenWithIdentity(endpoint, password);
        password = '';
        if (outcome.ok && outcome.targetUrl) {
          window.__lastTargetUrl = outcome.targetUrl;
          return;
        }
        lastError = outcome.error || 'fail';
      }
    }

    document.addEventListener('click', function (e) {
      var tile = e.target && e.target.closest
        ? e.target.closest('.app-tile[data-open-with-identity]')
        : null;
      if (!tile) return;
      e.preventDefault();
      openWithIdentity(tile);
    });
  })();
  </script>
</body>
</html>
