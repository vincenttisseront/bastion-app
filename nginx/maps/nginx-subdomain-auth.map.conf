# Subdomain auth maps for DMZ / ansible nginx (http{} include).
# Prefer docker/nginx/includes/nginx-subdomain-auth.map.conf inside bastion-nginx.
#
# Optional fresh JWT extract — never map-pick into $bastion_pass_* (cycle → 500).
map $http_cookie $bastion_fresh_session {
    default "";
    "~*(?:^|;\\s*)bastion_session=([^;]+)" $1;
}

# Prefer literal per-vhost FQDN when set by the server block.
map $bastion_vhost_fqdn $bastion_auth_host {
    default $bastion_vhost_fqdn;
    ""      $host;
}

# From parent jar only — never fall back to filtered $http_cookie.
map $bastion_pass_cookie $bastion_session_from_jar {
    default "";
    "~*(?:^|;\\s*)bastion_session=([^;]+)" $1;
}

# S4: Cookie header forwarded to *application* upstreams — portal session
# tokens removed (bastion_session, break-glass, hop, MFA, oauth2-proxy). A
# compromised app must not receive replayable portal credentials. /.bastion/*
# locations and auth_request subrequests keep the full $http_cookie.
# One occurrence removed per pass (duplicates exist: host-only + parent domain).
map $http_cookie $bastion_upck1 {
    default $http_cookie;
    "~^(?<bupc1p>.*?)(?:^|;\s*)(?:bastion_session|bastion_session_hop|bastion_crush_hop|bg_session|bastion_mfa_ok|_oauth2_proxy[A-Za-z0-9_-]*)=[^;]*(?<bupc1s>.*)$" "$bupc1p$bupc1s";
}
map $bastion_upck1 $bastion_upck2 {
    default $bastion_upck1;
    "~^(?<bupc2p>.*?)(?:^|;\s*)(?:bastion_session|bastion_session_hop|bastion_crush_hop|bg_session|bastion_mfa_ok|_oauth2_proxy[A-Za-z0-9_-]*)=[^;]*(?<bupc2s>.*)$" "$bupc2p$bupc2s";
}
map $bastion_upck2 $bastion_upck3 {
    default $bastion_upck2;
    "~^(?<bupc3p>.*?)(?:^|;\s*)(?:bastion_session|bastion_session_hop|bastion_crush_hop|bg_session|bastion_mfa_ok|_oauth2_proxy[A-Za-z0-9_-]*)=[^;]*(?<bupc3s>.*)$" "$bupc3p$bupc3s";
}
map $bastion_upck3 $bastion_upck4 {
    default $bastion_upck3;
    "~^(?<bupc4p>.*?)(?:^|;\s*)(?:bastion_session|bastion_session_hop|bastion_crush_hop|bg_session|bastion_mfa_ok|_oauth2_proxy[A-Za-z0-9_-]*)=[^;]*(?<bupc4s>.*)$" "$bupc4p$bupc4s";
}
map $bastion_upck4 $bastion_upck5 {
    default $bastion_upck4;
    "~^(?<bupc5p>.*?)(?:^|;\s*)(?:bastion_session|bastion_session_hop|bastion_crush_hop|bg_session|bastion_mfa_ok|_oauth2_proxy[A-Za-z0-9_-]*)=[^;]*(?<bupc5s>.*)$" "$bupc5p$bupc5s";
}
map $bastion_upck5 $bastion_upck6 {
    default $bastion_upck5;
    "~^(?<bupc6p>.*?)(?:^|;\s*)(?:bastion_session|bastion_session_hop|bastion_crush_hop|bg_session|bastion_mfa_ok|_oauth2_proxy[A-Za-z0-9_-]*)=[^;]*(?<bupc6s>.*)$" "$bupc6p$bupc6s";
}
map $bastion_upck6 $bastion_upstream_app_cookie {
    default $bastion_upck6;
    "~^;\s*(?<bupct>.*)$" "$bupct";
}
