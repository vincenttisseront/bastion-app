# Ansible managed — source: awx-playbook/roles/nginx_reverse_proxy_dmz/files/transfer-crushftp.map.conf
# CrushFTP transfer — filtrage cookies vers backend (bloc http)
#
# Sans jetons SSO (_kc_*, oauth2*) : transmettre $http_cookie tel quel
# (tous les currentAuth*, currentAuth-H-*, requis pour c2f / session).
# Avec jetons SSO : CrushAuth + un currentAuth* uniquement (évite overflow Java).

map $http_cookie $transfer_crush_auth_part {
    default "";
    "~*CrushAuth=([^;]+)"  "CrushAuth=$1";
}

map $http_cookie $transfer_crush_current_part {
    default "";
    "~*(?:^|;\s*)(currentAuth[^=;]*)=([^;]*)"  "$1=$2";
}

map "$transfer_crush_auth_part#$transfer_crush_current_part" $transfer_crush_cookie_safe {
    default "";
    "~^([^#]+)#([^#]+)$"  "$1; $2";
    "~^([^#]+)#$"          "$1";
    "~^#([^#]+)$"           "$1";
    "~^#$"                  "";
}

map $http_cookie $transfer_crushftp_backend_cookie {
    default $http_cookie;
    "~*(?:^|;\s*)(_kc_|_oauth2)"  $transfer_crush_cookie_safe;
}
