# Ansible managed — source: awx-playbook/roles/nginx_reverse_proxy_dmz/templates/vhost_transfer_crushftp.conf.j2
# transfer.ar-systems.fr — CrushFTP proxy infra (login natif, sans auth_request bastion)

server {
    listen 80;
    server_name transfer.ar-systems.fr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name transfer.ar-systems.fr;

    ssl_certificate /etc/letsencrypt/live/ar-systems.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ar-systems.fr/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    access_log /var/log/nginx/transfer.access.log main;
    error_log  /var/log/nginx/transfer.error.log warn;

    client_max_body_size 2G;
    large_client_header_buffers 8 32k;
    rewrite ^//+ / permanent;

    # Ne pas doubler SameSite/Secure (CrushFTP les envoie déjà).
    # proxy_cookie_path / "/; SameSite=None; Secure";

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    include /etc/nginx/snippets/error_pages.conf;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_hide_header WWW-Authenticate;

    location = / {
        return 302 /WebInterface/new-ui/index.html;
    }

    location /webfs/ {
        proxy_pass https://172.24.0.106;
        proxy_http_version 1.1;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Cookie $transfer_crushftp_backend_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /WebInterface/new-ui {
        return 302 /WebInterface/new-ui/index.html;
    }
    location = /WebInterface/new-ui/ {
        return 302 /WebInterface/new-ui/index.html;
    }

    location /WebInterface/new-ui/upload/ {
        proxy_pass https://172.24.0.106;
        proxy_http_version 1.1;
        proxy_ssl_verify off;
        proxy_ssl_session_reuse off;
        proxy_ssl_protocols TLSv1.2;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header Cookie $transfer_crushftp_backend_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location / {
        proxy_pass https://172.24.0.106;
        proxy_http_version 1.1;
        proxy_ssl_verify off;
        proxy_ssl_session_reuse off;
        proxy_ssl_protocols TLSv1.2;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header Cookie $transfer_crushftp_backend_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 120s;
        proxy_read_timeout 299s;
        proxy_send_timeout 300s;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
