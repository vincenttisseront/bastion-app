# SonarQube — bastion-app (Python / FastAPI)
# Project key/name can be overridden by Jenkins (-Dsonar.projectKey=…).

sonar.projectKey=bastion-app
sonar.projectName=Bastion Pro
sonar.projectVersion=0.1.0

sonar.sources=app
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Coverage from: pytest --cov=app --cov-report=xml:coverage.xml
sonar.python.coverage.reportPaths=coverage.xml

sonar.exclusions=\
  **/migrations/**,\
  **/__pycache__/**,\
  **/static/uploads/**,\
  tmp/**,\
  deploy/data/**

sonar.test.inclusions=tests/**/*.py

sonar.coverage.exclusions=\
  **/migrations/**,\
  app/static/**,\
  **/__init__.py
