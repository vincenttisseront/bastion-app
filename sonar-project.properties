# SonarQube — bastion-app (Python / FastAPI)
# Project key/name can be overridden by Jenkins (-Dsonar.projectKey=…).
#
# Backends (Jenkins SONAR_BACKEND):
#   server (default) — self-hosted Community Build
#   cloud            — SonarQube Cloud (https://sonarcloud.io)
#                      requires SONAR_ORGANIZATION + Jenkins server "SonarQube Cloud"
#
# GitHub repo is PUBLIC → SonarQube Cloud Free is fine (unlimited public LOC;
# the 50k cap applies only to private projects). Keep the SonarCloud project Public.
# Existing Cloud project key (GitHub import): vincenttisseront_bastion-app
# (Jenkins passes -Dsonar.projectKey=… when SONAR_BACKEND=cloud).
#
# Disable SonarCloud Automatic Analysis for this project (UI): AA scans the
# whole GitHub tree and ignores sonar.sources. Until AA is off, keep broad
# exclusions so ops/ansible/scripts/Docker noise cannot fail Security rating.
# CI (Jenkins) uses sonar.sources=app below (product surface only).

sonar.projectKey=bastion-app
sonar.projectName=Bastion Pro
sonar.projectVersion=0.9.1

# SonarQube Cloud only (also passed by Jenkins -Dsonar.organization=…):
sonar.organization=vincenttisseront

sonar.sources=app
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Coverage from: pytest --cov=app --cov-report=xml:coverage.xml
sonar.python.coverage.reportPaths=coverage.xml

sonar.exclusions=\
  **/migrations/**,\
  **/__pycache__/**,\
  **/static/uploads/**,\
  tmp/**,\
  deploy/data/**,\
  **/scripts/**

sonar.test.inclusions=tests/**/*.py

sonar.coverage.exclusions=\
  **/migrations/**,\
  app/static/**,\
  **/__init__.py
